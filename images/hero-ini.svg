<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Text.Ini — section-organised configuration documents">
  <title>Bodu.Text.Ini</title>
  <defs>
    <linearGradient id="ini-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#ini-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#60A5FA"/>
    <rect y="14" width="150" height="8" fill="#60A5FA"/>
    <text x="75" y="16" fill="#0B2545" text-anchor="middle" font-weight="700" font-size="11">document</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="11">
      <text x="10" y="42"><tspan fill="#94A3B8">preamble</tspan></text>
      <text x="10" y="56">  root = true</text>
      <text x="10" y="77"><tspan fill="#F8FAFC" font-weight="700">[server]</tspan></text>
      <text x="10" y="91">  host = ...</text>
      <text x="10" y="105">  port = 8080</text>
      <text x="10" y="126"><tspan fill="#F8FAFC" font-weight="700">[logging]</tspan></text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#60A5FA" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#60A5FA" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#60A5FA" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">save</text>
    <text x="52" y="56">parse</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">ini text</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="11">
      <text x="10" y="42"><tspan fill="#94A3B8">; config sample</tspan></text>
      <text x="10" y="56">root = true</text>
      <text x="10" y="77"><tspan fill="#FBBF24">[server]</tspan></text>
      <text x="10" y="91"><tspan fill="#60A5FA">host</tspan> = localhost</text>
      <text x="10" y="105"><tspan fill="#60A5FA">port</tspan> = 8080</text>
      <text x="10" y="126"><tspan fill="#FBBF24">[logging]</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">sections · comments · round-trip</text>
  </g>
</svg>
