<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Core — the foundation package: buffers, threading, functional seams, text, validation">
  <title>Bodu.Core</title>
  <defs>
    <linearGradient id="core-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#core-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="150" height="8" fill="#3B82F6"/>
    <text x="75" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Bodu.Core</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="44">PooledBufferBuilder</text>
      <text x="10" y="62">WeekPattern</text>
      <text x="10" y="80">AsyncLock · RateGate</text>
      <text x="10" y="98">Option · Result</text>
      <text x="10" y="116">Memoizer · Either</text>
      <text x="10" y="134">SequenceGenerator</text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#3B82F6" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#3B82F6" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#3B82F6" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">extend</text>
    <text x="52" y="56">validate</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Extensions</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="44">enumerable ops</text>
      <text x="10" y="62">dictionary · list ops</text>
      <text x="10" y="80">EncodingDetection</text>
      <text x="10" y="98">StringEncoding</text>
      <text x="10" y="116">XML helpers</text>
      <text x="10" y="134"><tspan fill="#60A5FA">ThrowHelper</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">buffers · threading · railway seams · text · xml</text>
  </g>
</svg>
