<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Globalization.Calendar.Tool — the bodu-calendar command-line compiler and lint">
  <title>Bodu.Globalization.Calendar.Tool</title>
  <defs>
    <linearGradient id="caltool-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#caltool-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#60A5FA"/>
    <rect y="14" width="150" height="8" fill="#60A5FA"/>
    <text x="75" y="16" fill="#0B2545" text-anchor="middle" font-weight="700" font-size="11">bodu-calendar</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="10" y="44"><tspan fill="#60A5FA">$</tspan> lint holidays.xml</text>
      <text x="10" y="60">  <tspan fill="#34D399">0 errors, 0 warnings</tspan></text>
      <text x="10" y="84"><tspan fill="#60A5FA">$</tspan> compile holidays.xml</text>
      <text x="10" y="100">  wrote holidays.bcal</text>
      <text x="10" y="124"><tspan fill="#60A5FA">$</tspan> info holidays.bcal</text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#60A5FA" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#60A5FA" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#60A5FA" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">lint</text>
    <text x="52" y="56">compile</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Sealed pack</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="44">holidays.bcal</text>
      <text x="10" y="68"><tspan fill="#94A3B8" font-size="9">BODU-CAL-* diagnostics</tspan></text>
      <text x="10" y="84"><tspan fill="#94A3B8" font-size="9">integrity digest</tspan></text>
      <text x="10" y="108"><tspan fill="#94A3B8" font-size="9">dotnet tool install</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">lint · compile · info</text>
  </g>
</svg>
