<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-labelledby="fnv-title fnv-desc">
  <title id="fnv-title">FNV hash — FNV-1a and FNV-1 update ordering</title>
  <desc id="fnv-desc">The Fowler-Noll-Vo hash starts from a published offset basis and processes one input byte at a time. The two variants differ only in operation order: FNV-1a XORs the byte into the state and then multiplies by the FNV prime, while FNV-1 multiplies first and then XORs the byte. FNV-1a's XOR-first ordering gives better avalanche on short inputs and is the preferred variant.</desc>

  <defs>
    <style>
      .bg { fill: #0F172A; }
      .panel { fill: #1E293B; stroke: #334155; stroke-width: 1; }
      .header { fill: #111827; stroke: #334155; stroke-width: 1; }
      .title { fill: #F8FAFC; font: 700 15px/1 "Segoe UI",Arial,sans-serif; }
      .formula { fill: #94A3B8; font: italic 12px/1 "Cambria",Georgia,serif; }
      .label { fill: #F8FAFC; font: 700 13px/1 "Segoe UI",Arial,sans-serif; }
      .sub { fill: #CBD5E1; font: 400 11px/1 "Segoe UI",Arial,sans-serif; }
      .sub-muted { fill: #94A3B8; font: 400 10.5px/1 "Segoe UI",Arial,sans-serif; }
      .byte { fill: #F59E0B; }
      .state-a { fill: #14B8A6; stroke: #2DD4BF; stroke-width: 1; }
      .state-b { fill: #3B82F6; stroke: #60A5FA; stroke-width: 1; }
      .basis { fill: #A78BFA; stroke: #C4B5FD; stroke-width: 1; }
      .tag { fill: #FBBF24; stroke: #F59E0B; stroke-width: 1; }
      .wire { stroke: #CBD5E1; stroke-width: 1.6; fill: none; }
      .wire-byte { stroke: #FBBF24; stroke-width: 1.6; fill: none; }
      .wire-a { stroke: #2DD4BF; stroke-width: 1.8; fill: none; }
      .wire-b { stroke: #60A5FA; stroke-width: 1.8; fill: none; }
      .op { fill: #0F172A; stroke: #F8FAFC; stroke-width: 1.6; }
      .op-sym { fill: #F8FAFC; font: 700 14px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .block-text { fill: #0F172A; font: 700 12px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .variant { fill: #F8FAFC; font: 700 12px/1 "Segoe UI",Arial,sans-serif; }
      .mono { font-family: "Consolas","Menlo",monospace; }
    </style>
    <marker id="fnv-arr-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#CBD5E1"/>
    </marker>
    <marker id="fnv-arr-by" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FBBF24"/>
    </marker>
    <marker id="fnv-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2DD4BF"/>
    </marker>
    <marker id="fnv-arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60A5FA"/>
    </marker>
  </defs>

  <rect class="bg" width="820" height="320"/>

  <g transform="translate(10 10)">
    <rect class="panel" width="800" height="300" rx="8"/>
    <rect class="header" width="800" height="46" rx="8"/>
    <rect class="header" y="38" width="800" height="8"/>
    <text class="title" x="16" y="20">FNV — XOR / multiply order is the only difference</text>
    <text class="formula" x="784" y="38" text-anchor="end">prime · offset basis from the FNV specification per width</text>

    <!-- offset basis -->
    <g transform="translate(110 78)">
      <rect class="basis" x="-92" y="-16" width="184" height="32" rx="6"/>
      <text class="block-text" x="0" y="5" font-size="11">initial h = FNV offset basis</text>
    </g>
    <text class="sub-muted mono" x="18" y="106">32-bit: 0x811C9DC5</text>
    <text class="sub-muted mono" x="18" y="122">64-bit: 0xCBF29CE484222325</text>

    <!-- incoming byte (shared) -->
    <g transform="translate(110 162)">
      <rect class="byte" x="-34" y="-14" width="68" height="28" rx="4"/>
      <text class="label" x="0" y="5" text-anchor="middle" fill="#0F172A">byte</text>
    </g>

    <!-- FNV-1a lane -->
    <text class="variant" x="250" y="86" fill="#2DD4BF">FNV-1a — XOR first, then multiply (preferred)</text>
    <g transform="translate(360 110)">
      <circle class="op" cx="0" cy="0" r="15"/>
      <text class="op-sym" x="0" y="5">⊕</text>
    </g>
    <g transform="translate(470 110)">
      <circle class="op" cx="0" cy="0" r="15"/>
      <text class="op-sym" x="0" y="5">×</text>
    </g>
    <g transform="translate(360 110)">
      <text class="sub-muted" x="0" y="-24" text-anchor="middle">h ⊕ byte</text>
    </g>
    <g transform="translate(470 110)">
      <text class="sub-muted" x="0" y="-24" text-anchor="middle">× prime</text>
    </g>
    <line class="wire-a" x1="375" y1="110" x2="453" y2="110" marker-end="url(#fnv-arr-a)"/>
    <g transform="translate(600 110)">
      <rect class="state-a" x="-58" y="-16" width="116" height="32" rx="6"/>
      <text class="block-text" x="0" y="5">new state h</text>
    </g>
    <line class="wire-a" x1="487" y1="110" x2="540" y2="110" marker-end="url(#fnv-arr-a)"/>
    <!-- byte into FNV-1a XOR -->
    <path class="wire-byte" d="M 144 156 C 240 130, 300 118, 343 112" marker-end="url(#fnv-arr-by)"/>
    <!-- h feedback FNV-1a -->
    <path class="wire-a" d="M 600 126 C 600 156, 360 156, 360 130" stroke-dasharray="4 3" marker-end="url(#fnv-arr-a)"/>
    <text class="sub-muted" x="430" y="151" text-anchor="middle">hₚᵣₑᵥ — loop for next byte</text>

    <!-- FNV-1 lane -->
    <text class="variant" x="250" y="200" fill="#60A5FA">FNV-1 — multiply first, then XOR (legacy)</text>
    <g transform="translate(360 224)">
      <circle class="op" cx="0" cy="0" r="15"/>
      <text class="op-sym" x="0" y="5">×</text>
    </g>
    <g transform="translate(470 224)">
      <circle class="op" cx="0" cy="0" r="15"/>
      <text class="op-sym" x="0" y="5">⊕</text>
    </g>
    <g transform="translate(360 224)">
      <text class="sub-muted" x="0" y="-24" text-anchor="middle">h × prime</text>
    </g>
    <g transform="translate(470 224)">
      <text class="sub-muted" x="0" y="-24" text-anchor="middle">⊕ byte</text>
    </g>
    <line class="wire-b" x1="375" y1="224" x2="453" y2="224" marker-end="url(#fnv-arr-b)"/>
    <g transform="translate(600 224)">
      <rect class="state-b" x="-58" y="-16" width="116" height="32" rx="6"/>
      <text class="block-text" x="0" y="5">new state h</text>
    </g>
    <line class="wire-b" x1="487" y1="224" x2="540" y2="224" marker-end="url(#fnv-arr-b)"/>
    <!-- byte into FNV-1 XOR (second op) -->
    <path class="wire-byte" d="M 144 168 C 260 200, 380 244, 453 232" marker-end="url(#fnv-arr-by)"/>
    <!-- h feedback FNV-1 -->
    <path class="wire-b" d="M 600 240 C 600 270, 360 270, 360 244" stroke-dasharray="4 3" marker-end="url(#fnv-arr-b)"/>
    <text class="sub-muted" x="430" y="265" text-anchor="middle">hₚᵣₑᵥ — loop for next byte</text>

    <!-- basis feeds both lanes -->
    <path class="wire" d="M 110 94 L 110 130 L 200 130 L 200 110 L 343 110" marker-end="url(#fnv-arr-d)" opacity="0.7"/>

    <!-- footer note -->
    <text class="sub" x="20" y="290">Same prime, same basis, same bytes — only the operation order changes. FNV-1a's XOR-before-multiply mixes each byte before it can be diluted.</text>
  </g>
</svg>
