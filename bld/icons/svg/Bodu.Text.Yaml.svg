<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Bodu.Text.Yaml package icon">
  <title>Bodu.Text.Yaml</title>
  <defs>
    <linearGradient id="tyaml-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#tyaml-bg)" stroke="#60A5FA" stroke-width="3"/>

  <!-- Bodu suite mark -->
  <g transform="translate(21 21)">
    <circle r="7.5" fill="none" stroke="#F8FAFC" stroke-width="2.2" opacity="0.85"/>
    <circle cy="-7.5" r="2" fill="#F8FAFC" opacity="0.85"/>
  </g>

  <!-- package glyph -->
  <g transform="translate(64 56)">
    <text y="12" fill="#60A5FA" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-weight="700" font-size="34">- :</text>
  </g>

  <!-- monogram chip -->
  <rect x="36" y="94" width="56" height="22" rx="11" fill="#60A5FA"/>
  <text x="64" y="110" fill="#0B2545" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-weight="700" font-size="14">YAML</text>
</svg>
