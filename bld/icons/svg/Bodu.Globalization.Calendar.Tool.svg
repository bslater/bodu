<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Bodu.Globalization.Calendar.Tool package icon">
  <title>Bodu.Globalization.Calendar.Tool</title>
  <defs>
    <linearGradient id="caltool-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#caltool-bg)" stroke="#60A5FA" stroke-width="3"/>

  <!-- Bodu suite mark -->
  <g transform="translate(21 21)">
    <circle r="7.5" fill="none" stroke="#F8FAFC" stroke-width="2.2" opacity="0.85"/>
    <circle cy="-7.5" r="2" fill="#F8FAFC" opacity="0.85"/>
  </g>

  <!-- package glyph -->
  <g transform="translate(64 56)">
    <rect x="-20" y="-26" width="40" height="52" rx="5" fill="none" stroke="#60A5FA" stroke-width="3"/>
    <g stroke="#60A5FA" stroke-width="3" stroke-linecap="round">
      <line x1="-11" y1="-12" x2="11" y2="-12"/>
      <line x1="-11" y1="0" x2="11" y2="0"/>
      <line x1="-11" y1="12" x2="4" y2="12"/>
    </g>
  </g>

  <!-- monogram chip -->
  <rect x="41" y="94" width="46" height="22" rx="11" fill="#60A5FA"/>
  <text x="64" y="110" fill="#0B2545" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-weight="700" font-size="14">CLI</text>
</svg>
