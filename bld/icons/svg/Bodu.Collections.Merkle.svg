      <rect x="-9" y="7" width="10" height="10" rx="2"/>
      <rect x="-1" y="7" width="10" height="10" rx="2" opacity="0.55"/>
      <rect x="17" y="7" width="10" height="10" rx="2" opacity="0.55"/>
