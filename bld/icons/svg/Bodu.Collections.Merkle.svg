      <line x1="-13" y1="-12" x2="-4" y2="6"/>
      <line x1="13" y1="-12" x2="4" y2="6"/>
      <line x1="13" y1="-12" x2="22" y2="6"/>
      <line x1="0" y1="-26" x2="-13" y2="-12"/>
