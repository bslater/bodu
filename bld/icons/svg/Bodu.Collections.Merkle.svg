  <!-- monogram chip -->
  <rect x="41" y="94" width="46" height="22" rx="11" fill="#2DD4BF"/>
  <text x="64" y="110" fill="#042F2A" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-weight="700" font-size="14">MTH</text>
