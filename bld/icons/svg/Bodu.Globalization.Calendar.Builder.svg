<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Bodu.Globalization.Calendar.Builder package icon">
  <title>Bodu.Globalization.Calendar.Builder</title>
  <defs>
    <linearGradient id="calb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#calb-bg)" stroke="#FBBF24" stroke-width="3"/>

  <!-- Bodu suite mark -->
