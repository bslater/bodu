    <g stroke="#FBBF24" stroke-width="2.5">
      <rect x="-26" y="-24" width="44" height="13" rx="6.5" fill="#FBBF24"/>
      <rect x="-18" y="-6" width="44" height="13" rx="6.5" fill="none"/>
      <rect x="-26" y="12" width="44" height="13" rx="6.5" fill="none"/>
    </g>
  </g>

  <!-- monogram chip -->
  <rect x="41" y="94" width="46" height="22" rx="11" fill="#FBBF24"/>
  <text x="64" y="110" fill="#3A2A04" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-weight="700" font-size="14">BLD</text>
