<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Bodu.Numerics package icon">
  <title>Bodu.Numerics</title>
  <defs>
    <linearGradient id="num-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#num-bg)" stroke="#A78BFA" stroke-width="3"/>

  <!-- Bodu suite mark -->
  <g transform="translate(21 21)">
    <circle r="7.5" fill="none" stroke="#F8FAFC" stroke-width="2.2" opacity="0.85"/>
    <circle cy="-7.5" r="2" fill="#F8FAFC" opacity="0.85"/>
  </g>

  <!-- package glyph -->
  <g transform="translate(64 56)">
    <text x="0" y="-6" fill="#A78BFA" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-weight="700" font-size="24">22</text>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round"/>
    <text x="0" y="22" fill="#A78BFA" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-weight="700" font-size="24">7</text>
  </g>

  <!-- monogram chip -->
  <rect x="41" y="94" width="46" height="22" rx="11" fill="#A78BFA"/>
  <text x="64" y="110" fill="#241A47" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-weight="700" font-size="14">NUM</text>
</svg>
