<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Bodu.Core package icon">
  <title>Bodu.Core</title>
  <defs>
    <linearGradient id="core-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#core-bg)" stroke="#3B82F6" stroke-width="3"/>

  <!-- Bodu suite mark -->
  <g transform="translate(21 21)">
    <circle r="7.5" fill="none" stroke="#F8FAFC" stroke-width="2.2" opacity="0.85"/>
    <circle cy="-7.5" r="2" fill="#F8FAFC" opacity="0.85"/>
  </g>

  <!-- package glyph -->
  <g transform="translate(64 56)">
    <circle r="22" fill="none" stroke="#3B82F6" stroke-width="5"/>
    <circle cy="-22" r="5.5" fill="#3B82F6"/>
  </g>

  <!-- monogram chip -->
  <rect x="36" y="94" width="56" height="22" rx="11" fill="#3B82F6"/>
  <text x="64" y="110" fill="#0B2545" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-weight="700" font-size="14">CORE</text>
</svg>
