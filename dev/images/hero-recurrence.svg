<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Globalization.Recurrence — RFC 5545 RRULE and cron recurrence evaluation">
  <title>Bodu.Globalization.Recurrence</title>
  <defs>
    <linearGradient id="recur-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#recur-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#2DD4BF"/>
    <rect y="14" width="150" height="8" fill="#2DD4BF"/>
    <text x="75" y="16" fill="#042F2A" text-anchor="middle" font-weight="700" font-size="11">RRULE</text>

    <g stroke="#334155" stroke-width="1">
      <rect x="13" y="38" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="46" y="38" width="28" height="22" rx="3" fill="#2DD4BF"/>
      <rect x="79" y="38" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="112" y="38" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="13" y="68" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="46" y="68" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="79" y="68" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="112" y="68" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="13" y="98" width="28" height="22" rx="3" fill="#2DD4BF"/>
      <rect x="46" y="98" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="79" y="98" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="112" y="98" width="28" height="22" rx="3" fill="#0F172A"/>
    </g>
    <text x="10" y="148" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">weekly · monthly · yearly · cron</text>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#2DD4BF" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#2DD4BF" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#2DD4BF" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">parse</text>
    <text x="52" y="56">expand</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Occurrences</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="44">RecurrenceRule.Parse("FREQ=WEEKLY")</text>
      <text x="10" y="60">GetOccurrences(start)</text>
      <text x="10" y="84">CronExpression.Parse("0 9 * * 1-5")</text>
      <text x="10" y="100">GetNextOccurrence(after)</text>
      <text x="10" y="124"><tspan fill="#94A3B8" font-size="9">RDATE · EXDATE · BYSETPOS</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">RRULE occurrence enumeration · cron next/previous</text>
  </g>
</svg>
