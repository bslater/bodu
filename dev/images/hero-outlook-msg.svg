<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Formats.Outlook.Msg — the read-only .msg reader over the OLE2 container">
  <title>Bodu.Formats.Outlook.Msg</title>
  <defs>
    <linearGradient id="olkmsg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#olkmsg-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#2DD4BF"/>
    <rect y="14" width="150" height="8" fill="#2DD4BF"/>
    <text x="75" y="16" fill="#042F2A" text-anchor="middle" font-weight="700" font-size="10">MS-OXMSG streams</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="10" y="44">__properties_version1.0</text>
      <text x="10" y="61">__substg1.0_0037001F</text>
      <text x="10" y="78">__recip_version1.0_#…</text>
      <text x="10" y="95">__attach_version1.0_#…</text>
      <text x="10" y="112">__nameid_version1.0</text>
      <text x="10" y="137"><tspan fill="#94A3B8" font-size="9">over Bodu.IO.Compound</tspan></text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#2DD4BF" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#2DD4BF" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#2DD4BF" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">open</text>
    <text x="52" y="56">decode</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">OutlookMessage</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="44">Properties · Recipients</text>
      <text x="10" y="61">Attachments · nested msgs</text>
      <text x="10" y="78">named-property lookup</text>
      <text x="10" y="95"><tspan fill="#60A5FA">BodyText · Html · Rtf</tspan></text>
      <text x="10" y="112"><tspan fill="#94A3B8" font-size="9">MS-OXRTFCP decompression</tspan></text>
      <text x="10" y="129"><tspan fill="#94A3B8" font-size="9">Compatible / Strict levels</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">MAPI properties · recipients · attachments · bodies</text>
  </g>
</svg>
