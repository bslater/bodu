<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Formats.Excel.Binary — BIFF8 records decoded into worksheet cells">
  <title>Bodu.Formats.Excel.Binary</title>
  <defs>
    <linearGradient id="xls-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#xls-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#34D399"/>
    <rect y="14" width="150" height="8" fill="#34D399"/>
    <text x="75" y="16" fill="#06281F" text-anchor="middle" font-weight="700" font-size="11">BIFF8 records</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="44"><tspan fill="#94A3B8">FD 00</tspan> LABELSST</text>
      <text x="10" y="61"><tspan fill="#94A3B8">7E 02</tspan> RK</text>
      <text x="10" y="78"><tspan fill="#94A3B8">BD 00</tspan> MULRK</text>
      <text x="10" y="95"><tspan fill="#94A3B8">06 00</tspan> FORMULA</text>
      <text x="10" y="120"><tspan fill="#94A3B8" font-size="9">forward-only cursor over</tspan></text>
      <text x="10" y="137"><tspan fill="#94A3B8" font-size="9">the Workbook stream</tspan></text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#34D399" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#34D399" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#34D399" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">decode</text>
    <text x="52" y="56">stream</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">worksheet</text>

    <g font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <g fill="#94A3B8">
        <text x="38" y="46">A</text><text x="72" y="46">B</text><text x="108" y="46">C</text>
        <text x="14" y="64">1</text><text x="14" y="82">2</text><text x="14" y="100">3</text>
      </g>
      <g stroke="#334155" stroke-width="1" fill="none">
        <rect x="26" y="52" width="104" height="54" rx="3"/>
        <line x1="26" y1="70" x2="130" y2="70"/>
        <line x1="26" y1="88" x2="130" y2="88"/>
        <line x1="60" y1="52" x2="60" y2="106"/>
        <line x1="96" y1="52" x2="96" y2="106"/>
      </g>
      <text x="32" y="64" fill="#A78BFA">"USD"</text><text x="64" y="64" fill="#2DD4BF">0.68</text><text x="100" y="64" fill="#FBBF24">TRUE</text>
      <text x="32" y="82" fill="#2DD4BF">44929</text><text x="64" y="82" fill="#2DD4BF">112.7</text><text x="100" y="82" fill="#F87171">#N/A</text>
      <text x="32" y="100" fill="#A78BFA">"JPY"</text><text x="64" y="100" fill="#2DD4BF">0.70</text><text x="100" y="100" fill="#2DD4BF">8.5%</text>
    </g>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="14" y="128"><tspan fill="#94A3B8" font-size="9">cached formula results</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">read-only BIFF8 · shared strings · used range</text>
  </g>
</svg>
