<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Text.Configuration — file-targeted configuration layering">
  <title>Bodu.Text.Configuration</title>
  <defs>
    <linearGradient id="tcfg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#tcfg-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#A78BFA"/>
    <rect y="14" width="150" height="8" fill="#A78BFA"/>
    <text x="75" y="16" fill="#241A47" text-anchor="middle" font-weight="700" font-size="11">sections</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="42"><tspan fill="#94A3B8">preamble</tspan></text>
      <text x="10" y="56">root = true</text>
      <text x="10" y="77"><tspan fill="#2DD4BF">[*.cs]</tspan></text>
      <text x="10" y="91">indent = 4</text>
      <text x="10" y="112"><tspan fill="#A78BFA">[src/**]</tspan></text>
      <text x="10" y="126">indent = 2</text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#A78BFA" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#A78BFA" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#A78BFA" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">resolve</text>
    <text x="52" y="56">layer</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">resolved view</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="44"><tspan fill="#60A5FA">indent:style</tspan> = space</text>
      <text x="10" y="62"><tspan fill="#60A5FA">indent:size</tspan>  = 2</text>
      <text x="10" y="80"><tspan fill="#60A5FA">log:level</tspan>    = Warn</text>
      <text x="10" y="98"><tspan fill="#60A5FA">root</tspan>         = true</text>
      <text x="10" y="125"><tspan fill="#94A3B8">GetInt32 · GetEnum&lt;T&gt;</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">layer · glob-match · last-wins · resolve</text>
  </g>
</svg>
