<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="530" viewBox="0 0 900 530" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
    <marker id="arr" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════
       ROW 1 — Non-Cryptographic  (y = 10..169)
       ═══════════════════════════════════════════════════════════════ -->

  <!-- Panel 1 — Checksum  (x=10) -->
  <rect x="10"  y="10" width="278" height="159" rx="4" fill="#f4faff" stroke="#2a5a8f" stroke-width="1.2"/>
  <rect x="10"  y="10" width="278" height="30"  rx="4" fill="#1e4a7a"/>
  <rect x="10"  y="30" width="278" height="10"  fill="#1e4a7a"/>
  <text x="149" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Checksum</text>
  <text x="149" y="50" text-anchor="middle" font-size="9"  fill="#3a6a9f">Bodu.IO.Hashing.Checksums</text>

  <text x="149" y="72"  text-anchor="middle" font-size="10" fill="#333">byte stream  (arbitrary length)</text>
  <line x1="149" y1="77" x2="149" y2="93" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="59"  y="96" width="180" height="24" rx="3" fill="#ddeeff" stroke="#2a5a8f" stroke-width="1"/>
  <text x="149" y="113" text-anchor="middle" font-size="9.5" fill="#1a3a6f">CRC · Fletcher · Adler</text>
  <line x1="149" y1="120" x2="149" y2="136" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="149" y="149" text-anchor="middle" font-size="10" fill="#333">n-byte error-detection tag</text>

  <text x="149" y="166" text-anchor="middle" font-size="8.5" fill="#666" font-style="italic">No key · stream-oriented · error-pattern–aware</text>

  <!-- Panel 2 — Fingerprint  (x=306) -->
  <rect x="306" y="10" width="278" height="159" rx="4" fill="#f4faff" stroke="#2a5a8f" stroke-width="1.2"/>
  <rect x="306" y="10" width="278" height="30"  rx="4" fill="#1e4a7a"/>
  <rect x="306" y="30" width="278" height="10"  fill="#1e4a7a"/>
  <text x="445" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Fingerprint</text>
  <text x="445" y="50" text-anchor="middle" font-size="9"  fill="#3a6a9f">Bodu.IO.Hashing</text>

  <text x="445" y="72"  text-anchor="middle" font-size="10" fill="#333">byte buffer</text>
  <line x1="445" y1="77" x2="445" y2="93" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="330" y="96" width="230" height="24" rx="3" fill="#ddeeff" stroke="#2a5a8f" stroke-width="1"/>
  <text x="445" y="113" text-anchor="middle" font-size="9.5" fill="#1a3a6f">FNV · CityHash · Pearson · …</text>
  <line x1="445" y1="120" x2="445" y2="136" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="445" y="149" text-anchor="middle" font-size="10" fill="#333">n-byte hash value</text>

  <text x="445" y="166" text-anchor="middle" font-size="8.5" fill="#666" font-style="italic">No key · fast · distribution-optimised</text>

  <!-- Panel 3 — Check Digit  (x=602) -->
  <rect x="602" y="10" width="288" height="159" rx="4" fill="#f4faff" stroke="#2a5a8f" stroke-width="1.2"/>
  <rect x="602" y="10" width="288" height="30"  rx="4" fill="#1e4a7a"/>
  <rect x="602" y="30" width="288" height="10"  fill="#1e4a7a"/>
  <text x="746" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Check Digit</text>
  <text x="746" y="50" text-anchor="middle" font-size="9"  fill="#3a6a9f">Bodu.IO.Hashing.CheckDigits  /  Bodu.IO.Hashing.Checksums</text>

  <text x="746" y="72"  text-anchor="middle" font-size="10" fill="#333">digit / alphanumeric char sequence</text>
  <line x1="746" y1="77" x2="746" y2="93" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="626" y="96" width="240" height="24" rx="3" fill="#ddeeff" stroke="#2a5a8f" stroke-width="1"/>
  <text x="746" y="113" text-anchor="middle" font-size="9.5" fill="#1a3a6f">Luhn · Damm · Verhoeff · EAN · …</text>
  <line x1="746" y1="120" x2="746" y2="136" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="746" y="149" text-anchor="middle" font-size="10" fill="#333">single check character</text>

  <text x="746" y="166" text-anchor="middle" font-size="8.5" fill="#666" font-style="italic">No key · char-level · transcription-error–aware</text>

  <!-- ═══════════════════════════════════════════════════════════════
       ROW 2 — Cryptographic  (y = 185..344)
       ═══════════════════════════════════════════════════════════════ -->

  <!-- Panel 4 — Crypto Hash  (x=10) -->
  <rect x="10"  y="185" width="278" height="159" rx="4" fill="#f8f4ff" stroke="#5030a0" stroke-width="1.2"/>
  <rect x="10"  y="185" width="278" height="30"  rx="4" fill="#3a1070"/>
  <rect x="10"  y="205" width="278" height="10"  fill="#3a1070"/>
  <text x="149" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Cryptographic Hash</text>
  <text x="149" y="225" text-anchor="middle" font-size="9"  fill="#8060c0">Bodu.Security.Cryptography</text>

  <text x="149" y="247" text-anchor="middle" font-size="10" fill="#333">byte buffer</text>
  <line x1="149" y1="252" x2="149" y2="268" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="54"  y="271" width="190" height="24" rx="3" fill="#ede8f8" stroke="#5030a0" stroke-width="1"/>
  <text x="149" y="288" text-anchor="middle" font-size="9.5" fill="#30106a">Tiger · CubeHash · ASCON · …</text>
  <line x1="149" y1="295" x2="149" y2="311" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="149" y="324" text-anchor="middle" font-size="10" fill="#333">digest  (one-way, collision-resistant)</text>

  <text x="149" y="341" text-anchor="middle" font-size="8.5" fill="#666" font-style="italic">No key · pre-image resistant · cannot be reversed</text>

  <!-- Panel 5 — Keyed Hash / MAC  (x=306) -->
  <rect x="306" y="185" width="278" height="159" rx="4" fill="#f8f4ff" stroke="#5030a0" stroke-width="1.2"/>
  <rect x="306" y="185" width="278" height="30"  rx="4" fill="#3a1070"/>
  <rect x="306" y="205" width="278" height="10"  fill="#3a1070"/>
  <text x="445" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Keyed Hash / MAC</text>
  <text x="445" y="225" text-anchor="middle" font-size="9"  fill="#8060c0">Bodu.Security.Cryptography</text>

  <text x="445" y="247" text-anchor="middle" font-size="10" fill="#333">byte buffer  +  secret key</text>
  <line x1="445" y1="252" x2="445" y2="268" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="345" y="271" width="200" height="24" rx="3" fill="#ede8f8" stroke="#5030a0" stroke-width="1"/>
  <text x="445" y="288" text-anchor="middle" font-size="9.5" fill="#30106a">SipHash · Poly1305</text>
  <line x1="445" y1="295" x2="445" y2="311" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="445" y="324" text-anchor="middle" font-size="10" fill="#333">authentication tag</text>

  <text x="445" y="341" text-anchor="middle" font-size="8.5" fill="#666" font-style="italic">Secret key required · one-way · unforgeable without key</text>

  <!-- Panel 6 — Symmetric Cipher (incl. Tweakable)  (x=602) -->
  <rect x="602" y="185" width="288" height="159" rx="4" fill="#f8f4ff" stroke="#5030a0" stroke-width="1.2"/>
  <rect x="602" y="185" width="288" height="30"  rx="4" fill="#3a1070"/>
  <rect x="602" y="205" width="288" height="10"  fill="#3a1070"/>
  <text x="746" y="203" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Symmetric Cipher  (incl. Tweakable)</text>
  <text x="746" y="225" text-anchor="middle" font-size="9"  fill="#8060c0">Bodu.Security.Cryptography</text>

  <!-- Encrypt direction -->
  <text x="746" y="247" text-anchor="middle" font-size="9.5" fill="#333">plaintext + key + IV  [+ tweak]</text>
  <line x1="746" y1="252" x2="746" y2="264" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="671" y="267" width="150" height="20" rx="3" fill="#ede8f8" stroke="#5030a0" stroke-width="1"/>
  <text x="746" y="282" text-anchor="middle" font-size="9.5" fill="#30106a">Encrypt</text>
  <line x1="746" y1="287" x2="746" y2="299" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="746" y="311" text-anchor="middle" font-size="9.5" fill="#333">ciphertext</text>

  <!-- Decrypt direction -->
  <text x="746" y="323" text-anchor="middle" font-size="9.5" fill="#333">ciphertext + key + IV  [+ tweak]  →  Decrypt  →  plaintext</text>

  <text x="746" y="341" text-anchor="middle" font-size="8.5" fill="#666" font-style="italic">Secret key required · reversible · tweak = domain separator</text>

  <!-- ═══════════════════════════════════════════════════════════════
       ROW 3 — Public-key & key derivation  (y = 360..519, crypto-only)
       ═══════════════════════════════════════════════════════════════ -->

  <!-- Panel 7 — Asymmetric (Public-Key)  (x=10) -->
  <rect x="10"  y="360" width="278" height="159" rx="4" fill="#f8f4ff" stroke="#5030a0" stroke-width="1.2"/>
  <rect x="10"  y="360" width="278" height="30"  rx="4" fill="#3a1070"/>
  <rect x="10"  y="380" width="278" height="10"  fill="#3a1070"/>
  <text x="149" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Asymmetric (Public-Key)</text>
  <text x="149" y="400" text-anchor="middle" font-size="9"  fill="#8060c0">Bodu.Security.Cryptography</text>

  <text x="149" y="422" text-anchor="middle" font-size="9.5" fill="#333">key pair  +  message / peer key</text>
  <line x1="149" y1="427" x2="149" y2="443" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="39"  y="446" width="220" height="24" rx="3" fill="#ede8f8" stroke="#5030a0" stroke-width="1"/>
  <text x="149" y="462" text-anchor="middle" font-size="8.5" fill="#30106a">Ed25519 · X25519 · ML-KEM · ML-DSA · HPKE</text>
  <line x1="149" y1="470" x2="149" y2="486" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="149" y="499" text-anchor="middle" font-size="9.5" fill="#333">signature · shared secret · sealed msg</text>

  <text x="149" y="516" text-anchor="middle" font-size="8.5" fill="#666" font-style="italic">Key pair · public half published · verify-or-fail</text>

  <!-- Panel 8 — Key Derivation  (x=306) -->
  <rect x="306" y="360" width="278" height="159" rx="4" fill="#f8f4ff" stroke="#5030a0" stroke-width="1.2"/>
  <rect x="306" y="360" width="278" height="30"  rx="4" fill="#3a1070"/>
  <rect x="306" y="380" width="278" height="10"  fill="#3a1070"/>
  <text x="445" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Key Derivation</text>
  <text x="445" y="400" text-anchor="middle" font-size="9"  fill="#8060c0">Bodu.Security.Cryptography</text>

  <text x="445" y="422" text-anchor="middle" font-size="9.5" fill="#333">password / secret  +  salt</text>
  <line x1="445" y1="427" x2="445" y2="443" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="345" y="446" width="200" height="24" rx="3" fill="#ede8f8" stroke="#5030a0" stroke-width="1"/>
  <text x="445" y="462" text-anchor="middle" font-size="9.5" fill="#30106a">Argon2id · scrypt · HKDF</text>
  <line x1="445" y1="470" x2="445" y2="486" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="445" y="499" text-anchor="middle" font-size="9.5" fill="#333">derived key material</text>

  <text x="445" y="516" text-anchor="middle" font-size="8.5" fill="#666" font-style="italic">Memory-hard for passwords · HKDF for high-entropy</text>

  <!-- Cell 9 — clarifying note  (x=602) -->
  <rect x="602" y="360" width="288" height="159" rx="4" fill="#faf8ff" stroke="#5030a0" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="746" y="386" text-anchor="middle" font-size="11" font-weight="bold" fill="#30106a">Reading these two cards</text>

  <text x="614" y="410" font-size="9" fill="#555">Unlike the symmetric cards above, the</text>
  <text x="614" y="424" font-size="9" fill="#555">input or output here is an asymmetric</text>
  <text x="614" y="438" font-size="9" fill="#555">key pair, and the result is a secret to</text>
  <text x="614" y="452" font-size="9" fill="#555">derive from — not a ciphertext.</text>
  <text x="614" y="474" font-size="9" fill="#555">Verification failures are fatal: a bad</text>
  <text x="614" y="488" font-size="9" fill="#555">signature, KEM decapsulation, or HPKE</text>
  <text x="614" y="502" font-size="9" fill="#555">open aborts rather than returning data.</text>
</svg>
