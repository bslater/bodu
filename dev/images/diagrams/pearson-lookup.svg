<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="pe-title pe-desc">
  <title id="pe-title">Pearson hash — table-driven indexed XOR loop</title>
  <desc id="pe-desc">Peter Pearson's hash updates a single byte of running state per input byte. For each message byte b, the state h is XORed with b, that result indexes a 256-entry byte permutation table T, and the looked-up value becomes the new h. Wider outputs run several parallel accumulators in lockstep, each seeded with a different shifted starting state, and concatenate their final bytes into the digest.</desc>

  <defs>
    <style>
      .bg { fill: #0F172A; }
      .panel { fill: #1E293B; stroke: #334155; stroke-width: 1; }
      .header { fill: #111827; stroke: #334155; stroke-width: 1; }
      .title { fill: #F8FAFC; font: 700 15px/1 "Segoe UI",Arial,sans-serif; }
      .formula { fill: #94A3B8; font: italic 12px/1 "Cambria",Georgia,serif; }
      .label { fill: #F8FAFC; font: 700 13px/1 "Segoe UI",Arial,sans-serif; }
      .sub { fill: #CBD5E1; font: 400 11px/1 "Segoe UI",Arial,sans-serif; }
      .sub-muted { fill: #94A3B8; font: 400 10.5px/1 "Segoe UI",Arial,sans-serif; }
      .byte { fill: #F59E0B; }
      .state { fill: #14B8A6; stroke: #2DD4BF; stroke-width: 1; }
      .tableblock { fill: #A78BFA; stroke: #C4B5FD; stroke-width: 1; }
      .tag { fill: #FBBF24; stroke: #F59E0B; stroke-width: 1; }
      .wire { stroke: #CBD5E1; stroke-width: 1.6; fill: none; }
      .wire-byte { stroke: #FBBF24; stroke-width: 1.6; fill: none; }
      .wire-table { stroke: #C4B5FD; stroke-width: 1.8; fill: none; }
      .wire-state { stroke: #2DD4BF; stroke-width: 1.8; fill: none; }
      .xor { fill: #0F172A; stroke: #F8FAFC; stroke-width: 1.6; }
      .xor-sym { fill: #F8FAFC; font: 700 14px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .block-text { fill: #0F172A; font: 700 13px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .mono { font-family: "Consolas","Menlo",monospace; }
    </style>
    <marker id="pe-arr-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#CBD5E1"/>
    </marker>
    <marker id="pe-arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FBBF24"/>
    </marker>
    <marker id="pe-arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C4B5FD"/>
    </marker>
    <marker id="pe-arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <rect class="bg" width="820" height="300"/>

  <g transform="translate(10 10)">
    <rect class="panel" width="800" height="280" rx="8"/>
    <rect class="header" width="800" height="46" rx="8"/>
    <rect class="header" y="38" width="800" height="8"/>
    <text class="title" x="16" y="20">Pearson — one indexed XOR per byte</text>
    <text class="formula" x="784" y="38" text-anchor="end">h ← T[h ⊕ b];   T is a permutation of 0…255</text>

    <!-- incoming byte -->
    <g transform="translate(64 100)">
      <rect class="byte" x="-36" y="-14" width="72" height="28" rx="4"/>
      <text class="label" x="0" y="5" text-anchor="middle" fill="#0F172A">byte b</text>
    </g>

    <!-- XOR mixer -->
    <g transform="translate(210 100)">
      <circle class="xor" cx="0" cy="0" r="14"/>
      <text class="xor-sym" x="0" y="5">⊕</text>
    </g>
    <line class="wire-byte" x1="100" y1="100" x2="193" y2="100" marker-end="url(#pe-arr-b)"/>

    <!-- index result -->
    <g transform="translate(330 100)">
      <rect class="state" x="-50" y="-15" width="100" height="30" rx="5"/>
      <text class="block-text" x="0" y="5">index = h ⊕ b</text>
    </g>
    <line class="wire-byte" x1="224" y1="100" x2="278" y2="100" marker-end="url(#pe-arr-b)"/>

    <!-- permutation table -->
    <g transform="translate(540 64)">
      <rect class="panel" x="0" y="0" width="160" height="118" rx="8"/>
      <rect class="header" x="0" y="0" width="160" height="22" rx="8"/>
      <rect class="header" x="0" y="14" width="160" height="8"/>
      <text class="label" x="80" y="16" text-anchor="middle" font-size="12">T[256] permutation</text>
      <g class="sub-muted mono" font-size="10">
        <text x="14" y="40">5C</text><text x="58" y="40">→</text><text x="86" y="40">A3</text>
        <text x="14" y="58">5D</text><text x="58" y="58">→</text><text x="86" y="58">17</text>
        <text x="14" y="76" fill="#C4B5FD">5E</text><text x="58" y="76" fill="#C4B5FD">→</text><text x="86" y="76" fill="#C4B5FD">E9</text>
        <text x="14" y="94">5F</text><text x="58" y="94">→</text><text x="86" y="94">2B</text>
        <text x="14" y="112">60</text><text x="58" y="112">→</text><text x="86" y="112">7C</text>
      </g>
    </g>
    <line class="wire-byte" x1="380" y1="100" x2="468" y2="100" marker-end="url(#pe-arr-b)"/>
    <text class="sub-muted" x="424" y="93" text-anchor="middle">lookup</text>
    <line class="wire-table" x1="468" y1="100" x2="536" y2="123" marker-end="url(#pe-arr-p)"/>

    <!-- running state h -->
    <g transform="translate(330 196)">
      <rect class="state" x="-58" y="-17" width="116" height="34" rx="6"/>
      <text class="block-text" x="0" y="6">running state h</text>
    </g>
    <!-- table value feeds new h -->
    <path class="wire-table" d="M 620 184 L 620 226 L 330 226 L 330 215" marker-end="url(#pe-arr-p)"/>
    <text class="sub-muted" x="470" y="220" text-anchor="middle">h ← T[index]</text>
    <!-- h feeds back into XOR -->
    <path class="wire-state" d="M 290 192 C 230 178, 210 150, 210 116" stroke-dasharray="4 3" marker-end="url(#pe-arr-s)"/>
    <text class="sub-muted" x="234" y="160">hₚᵣₑᵥ</text>

    <!-- parallel accumulators legend -->
    <g transform="translate(40 196)">
      <rect class="tag" x="-26" y="-17" width="52" height="34" rx="5" opacity="0.55"/>
      <rect class="tag" x="-22" y="-13" width="52" height="34" rx="5" opacity="0.78"/>
      <rect class="tag" x="-18" y="-9" width="52" height="34" rx="5"/>
      <text class="label" x="8" y="12" text-anchor="middle" fill="#0F172A" font-size="11">h₀ h₁ h₂…</text>
    </g>
    <text class="sub-muted" x="14" y="240">N⁄8 parallel lanes, each seeded with a shifted start state</text>

    <!-- final output -->
    <g transform="translate(720 196)">
      <rect class="tag" x="-50" y="-16" width="100" height="32" rx="5"/>
      <text class="label" x="0" y="6" text-anchor="middle" fill="#0F172A" font-size="11">digest h₀‖h₁‖…</text>
    </g>
    <line class="wire" x1="392" y1="196" x2="664" y2="196" marker-end="url(#pe-arr-d)"/>

    <!-- footer note -->
    <text class="sub" x="20" y="262">The table is the hash: any 256-byte permutation works, but distribution quality — and collision behaviour — is entirely determined by that table.</text>
  </g>
</svg>
