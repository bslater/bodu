<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Globalization.Calendar.Caching — per-territory, per-year caching for notable-date services">
  <title>Bodu.Globalization.Calendar.Caching</title>
  <defs>
    <linearGradient id="calcache-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#calcache-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#FB923C"/>
    <rect y="14" width="150" height="8" fill="#FB923C"/>
    <text x="75" y="16" fill="#3B1E04" text-anchor="middle" font-weight="700" font-size="10">NotableDateService</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="44"><tspan fill="#FB923C">CachingNotableDateService</tspan></text>
      <text x="10" y="68">AU <tspan fill="#94A3B8">2026 ✓ 2027 ✓</tspan></text>
      <text x="10" y="84">GB <tspan fill="#94A3B8">2026 ✓</tspan></text>
      <text x="10" y="100">US <tspan fill="#94A3B8">2026 ✓ 2027 ✓</tspan></text>
      <text x="10" y="124"><tspan fill="#94A3B8" font-size="9">in-memory · one TOML/JSON</tspan></text>
      <text x="10" y="140"><tspan fill="#94A3B8" font-size="9">file per territory</tspan></text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#FB923C" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#FB923C" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#FB923C" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#FB923C" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">resolve</text>
    <text x="52" y="56">cache</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Computed years</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="44">GetNotableDates(…)</text>
      <text x="10" y="68"><tspan fill="#FB923C">hit</tspan> <tspan fill="#94A3B8">→ cached year</tspan></text>
      <text x="10" y="84"><tspan fill="#FB923C">miss</tspan> <tspan fill="#94A3B8">→ inner service</tspan></text>
      <text x="10" y="108"><tspan fill="#94A3B8" font-size="9">TTL or resource-version</tspan></text>
      <text x="10" y="124"><tspan fill="#94A3B8" font-size="9">change refreshes a year</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">compute a territory-year once · serve it cached</text>
  </g>
</svg>
