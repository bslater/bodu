<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Financial.ExchangeRates.DependencyInjection — resilient HttpClient wiring for exchange-rate providers">
  <title>Bodu.Financial.ExchangeRates.DependencyInjection</title>
  <defs>
    <linearGradient id="fxdi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#fxdi-bg)"/>

  <!-- Left column: the HTTP pipeline -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="170" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="170" height="22" rx="8" fill="#34D399"/>
    <rect y="14" width="170" height="8" fill="#34D399"/>
    <text x="85" y="16" fill="#06281F" text-anchor="middle" font-weight="700" font-size="10" font-family="'Consolas','Menlo',monospace">named HttpClient</text>

    <g stroke="#334155" stroke-width="1">
      <rect x="12" y="36" width="146" height="24" rx="5" fill="#0F172A"/>
      <rect x="12" y="72" width="146" height="24" rx="5" fill="#0F172A"/>
      <rect x="12" y="108" width="146" height="24" rx="5" fill="#0F172A"/>
    </g>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="20" y="52">Polly retry <tspan fill="#94A3B8">· backoff</tspan></text>
      <text x="20" y="88">circuit breaker</text>
      <text x="20" y="124">timeout <tspan fill="#94A3B8">· jitter</tspan></text>
    </g>
    <g fill="none" stroke="#34D399" stroke-width="1.4">
      <path d="M 85 60 L 85 72"/>
      <path d="M 85 96 L 85 108"/>
    </g>
    <text x="12" y="150" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">SingleFlightCoordinator</text>
  </g>

  <!-- middle: registration arrow -->
  <g transform="translate(206 96)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="84" y2="0"/>
    <polygon points="84,0 76,-4 76,4" fill="#34D399" stroke="none"/>
  </g>
  <g transform="translate(206 96)" fill="#34D399" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="42" y="-8">delegates</text>
  </g>

  <!-- Right column: the provider base -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="10" font-family="'Consolas','Menlo',monospace">Provider base</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="10" y="46">AddWebExchangeRate</text>
      <text x="10" y="62">Provider&lt;T&gt;(…)</text>
      <text x="10" y="88" fill="#60A5FA">WebExchangeRate</text>
      <text x="10" y="104" fill="#60A5FA">Provider</text>
      <text x="10" y="130" fill="#94A3B8" font-size="9">every source package</text>
      <text x="10" y="144" fill="#94A3B8" font-size="9">builds on this wiring</text>
    </g>
  </g>

  <!-- bottom note -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">shared machinery for BOE · ECB · RBA · Yahoo · OFX · XE · OANDA</text>
  </g>
</svg>
