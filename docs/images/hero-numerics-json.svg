<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Numerics.Serialization.Json — System.Text.Json converters for fractions and intervals">
  <title>Bodu.Numerics.Serialization.Json</title>
  <defs>
    <linearGradient id="numjson-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#numjson-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#A78BFA"/>
    <rect y="14" width="150" height="8" fill="#A78BFA"/>
    <text x="75" y="16" fill="#241A47" text-anchor="middle" font-weight="700" font-size="11">Bodu.Numerics</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="48">Fraction&lt;T&gt;</text>
    </g>
    <g font-family="'Consolas','Menlo',monospace" font-size="14" fill="#A78BFA">
      <text x="24" y="76">22</text>
      <text x="24" y="100">7</text>
    </g>
    <line x1="22" y1="82" x2="46" y2="82" stroke="#A78BFA" stroke-width="1.6"/>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="126">Interval&lt;T&gt; <tspan fill="#A78BFA">[1,2)</tspan></text>
      <text x="10" y="144">IntervalSet&lt;T&gt;</text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#A78BFA" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#A78BFA" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#A78BFA" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">write</text>
    <text x="52" y="56">read</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="10">System.Text.Json</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="42"><tspan fill="#FBBF24">{</tspan></text>
      <text x="10" y="58">  <tspan fill="#60A5FA">"fraction"</tspan>: <tspan fill="#34D399">"22/7"</tspan>,</text>
      <text x="10" y="74">  <tspan fill="#60A5FA">"interval"</tspan>: <tspan fill="#FBBF24">{</tspan></text>
      <text x="10" y="90">    <tspan fill="#60A5FA">"min"</tspan>: 1,</text>
      <text x="10" y="106">    <tspan fill="#60A5FA">"max"</tspan>: 2</text>
      <text x="10" y="122">  <tspan fill="#FBBF24">}</tspan></text>
      <text x="10" y="138"><tspan fill="#FBBF24">}</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">options.ConfigureForBoduNumerics() · NumericsJsonPolicy</text>
  </g>
</svg>
