<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Financial.ExchangeRates.Ofx — OFX exchange-rate provider">
  <title>Bodu.Financial.ExchangeRates.Ofx</title>
  <defs>
    <linearGradient id="fxofx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#fxofx-bg)"/>

  <!-- Left column: the source feed -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="170" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="170" height="22" rx="8" fill="#2DD4BF"/>
    <rect y="14" width="170" height="8" fill="#2DD4BF"/>
    <text x="85" y="16" fill="#042F2A" text-anchor="middle" font-weight="700" font-size="11">OFX</text>

    <g fill="#E2E8F0" font-size="10.5">
      <text x="12" y="46">OFX historical</text>
      <text x="12" y="63" fill="#94A3B8">rate service</text>
    </g>
    <rect x="12" y="74" width="34" height="18" rx="9" fill="#0F172A" stroke="#2DD4BF" stroke-width="1.2"/>
    <text x="29" y="87" fill="#2DD4BF" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-size="9.5">JSON</text>

    <!-- rate sparkline -->
    <g transform="translate(12 100)">
      <polyline points="0,34 24,26 48,30 72,16 96,22 120,8 144,14" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="144" cy="14" r="3" fill="#2DD4BF"/>
      <text x="0" y="52" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">AUD/NZD daily reference</text>
    </g>
  </g>

  <!-- middle: fetch/parse arrows -->
  <g transform="translate(206 84)" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="84" y2="0"/>
    <polygon points="84,0 76,-4 76,4" fill="#2DD4BF" stroke="none"/>
    <line x1="84" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#2DD4BF" stroke="none"/>
  </g>
  <g transform="translate(206 84)" fill="#2DD4BF" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="42" y="-6">fetch</text>
    <text x="42" y="56">parse</text>
  </g>

  <!-- Right column: the provider contract -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="10" font-family="'Consolas','Menlo',monospace">Provider</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="10" y="46">IDatedExchangeRate</text>
      <text x="10" y="62">Provider</text>
      <text x="10" y="88">ExchangeRateBook</text>
      <text x="10" y="112" fill="#2DD4BF">full history</text>
      <text x="10" y="140" fill="#94A3B8" font-size="9">public rate API</text>
    </g>
  </g>

  <!-- bottom note -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">services.AddOfxExchangeRates()</text>
  </g>
</svg>
