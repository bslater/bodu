<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Text.Filtering — include/exclude text filtering engine">
  <title>Bodu.Text.Filtering</title>
  <defs>
    <linearGradient id="text-filtering-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#text-filtering-bg)"/>

  <!-- Left panel: the pattern set -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#60A5FA"/>
    <rect y="14" width="150" height="8" fill="#60A5FA"/>
    <text x="75" y="16" fill="#0B2545" text-anchor="middle" font-weight="700" font-size="11">patterns</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="11">
      <text x="10" y="44"><tspan fill="#34D399">+</tspan> error*</text>
      <text x="10" y="62"><tspan fill="#34D399">+</tspan> {warn,fatal}*</text>
      <text x="10" y="80"><tspan fill="#34D399">+</tspan> job-[0-9]?</text>
      <text x="10" y="98"><tspan fill="#F87171">-</tspan> *debug*</text>
      <text x="10" y="116"><tspan fill="#F87171">-</tspan> ^tmp\d+$</text>
      <text x="10" y="140" fill="#94A3B8">literal → glob</text>
      <text x="56" y="154" fill="#94A3B8">→ regex</text>
    </g>
  </g>

  <!-- Center funnel -->
  <g transform="translate(186 78)">
    <path d="M0 0 L104 0 L66 26 L66 44 L38 44 L38 26 Z" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linejoin="round"/>
    <line x1="52" y1="48" x2="52" y2="58" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <polygon points="52,64 48,56 56,56" fill="#60A5FA"/>
  </g>
  <g fill="#60A5FA" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="238" y="70">cheapest first</text>
    <text x="238" y="160">IsMatch</text>
  </g>

  <!-- Right panel: kept values + telemetry -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">kept</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="11">
      <text x="10" y="44">error: disk full</text>
      <text x="10" y="62">warn: retrying</text>
      <text x="10" y="80">fatal: oom</text>
      <text x="10" y="102"><tspan fill="#FBBF24">stats</tspan></text>
      <text x="10" y="118" fill="#94A3B8">kept    100k</text>
      <text x="10" y="132" fill="#94A3B8">vetoed  312</text>
      <text x="10" y="146" fill="#94A3B8">hits/pattern</text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">include/exclude · glob · telemetry</text>
  </g>
</svg>
