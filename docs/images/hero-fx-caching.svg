<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Financial.ExchangeRates.Caching — read-through caching and aggregation for exchange-rate providers">
  <title>Bodu.Financial.ExchangeRates.Caching</title>
  <defs>
    <linearGradient id="fxcache-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#fxcache-bg)"/>

  <!-- Left column: the cache cascade -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="170" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="170" height="22" rx="8" fill="#34D399"/>
    <rect y="14" width="170" height="8" fill="#34D399"/>
    <text x="85" y="16" fill="#06281F" text-anchor="middle" font-weight="700" font-size="10" font-family="'Consolas','Menlo',monospace">IExchangeRateCache</text>

    <g stroke="#334155" stroke-width="1">
      <rect x="12" y="38" width="146" height="26" rx="5" fill="#0F172A"/>
      <rect x="24" y="76" width="134" height="26" rx="5" fill="#0F172A"/>
    </g>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="22" y="55">memory <tspan fill="#34D399">hit</tspan></text>
      <text x="34" y="93">TOML file <tspan fill="#94A3B8">miss ↓</tspan></text>
    </g>
    <g fill="none" stroke="#34D399" stroke-width="1.4">
      <path d="M 85 64 L 85 76"/>
      <path d="M 85 102 L 85 116"/>
    </g>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="12" y="130">StoreFetchedRange</text>
      <text x="12" y="148" fill="#94A3B8" font-size="9">DateRangeCoverage</text>
    </g>
  </g>

  <!-- middle: read-through arrows -->
  <g transform="translate(206 84)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="84" y2="0"/>
    <polygon points="84,0 76,-4 76,4" fill="#34D399" stroke="none"/>
    <line x1="84" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#34D399" stroke="none"/>
  </g>
  <g transform="translate(206 84)" fill="#34D399" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="42" y="-6">fetch</text>
    <text x="42" y="56">store</text>
  </g>

  <!-- Right column: decorated providers -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Providers</text>

    <g stroke="#334155" stroke-width="1">
      <rect x="12" y="36" width="118" height="20" rx="4" fill="#0F172A"/>
      <rect x="12" y="62" width="118" height="20" rx="4" fill="#0F172A"/>
      <rect x="12" y="88" width="118" height="20" rx="4" fill="#0F172A"/>
    </g>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="20" y="50">ECB <tspan fill="#94A3B8">priority 1</tspan></text>
      <text x="20" y="76">BOE <tspan fill="#94A3B8">priority 2</tspan></text>
      <text x="20" y="102">RBA <tspan fill="#94A3B8">per-pair</tspan></text>
      <text x="12" y="128" fill="#60A5FA">Aggregating</text>
      <text x="12" y="142" fill="#60A5FA">ExchangeRateProvider</text>
    </g>
  </g>

  <!-- bottom note -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">AddCachedExchangeRateProvider · AddAggregatedExchangeRateProvider</text>
  </g>
</svg>
