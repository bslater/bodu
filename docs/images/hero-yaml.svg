<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Text.Yaml — YAML reader and writer over a typed node model">
  <title>Bodu.Text.Yaml</title>
  <defs>
    <linearGradient id="yml-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#yml-bg)"/>

  <!-- Left column: YAML source text -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#34D399"/>
    <rect y="14" width="150" height="8" fill="#34D399"/>
    <text x="75" y="16" fill="#06281F" text-anchor="middle" font-weight="700" font-size="11">YAML text</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="11">
      <text x="10" y="42">title<tspan fill="#FBBF24">:</tspan> <tspan fill="#60A5FA">app</tspan></text>
      <text x="10" y="64">owner<tspan fill="#FBBF24">:</tspan></text>
      <text x="10" y="80">  name<tspan fill="#FBBF24">:</tspan> <tspan fill="#60A5FA">Tom</tspan></text>
      <text x="10" y="96">  born<tspan fill="#FBBF24">:</tspan> 1979-05-27</text>
      <text x="10" y="118">db<tspan fill="#FBBF24">:</tspan></text>
      <text x="10" y="134">  ports<tspan fill="#FBBF24">:</tspan> <tspan fill="#FBBF24">[</tspan>8000<tspan fill="#FBBF24">]</tspan></text>
    </g>
  </g>

  <!-- middle: bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#34D399" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#34D399" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#34D399" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">read</text>
    <text x="52" y="56">write</text>
  </g>

  <!-- Right column: YamlNode tree -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">YamlNode</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="11">
      <text x="10" y="42">mapping</text>
      <text x="22" y="58" fill="#60A5FA">title</text>
      <text x="22" y="74" fill="#60A5FA">owner</text>
      <text x="34" y="90">  name</text>
      <text x="34" y="106">  born</text>
      <text x="22" y="122" fill="#60A5FA">db</text>
      <text x="34" y="138">  ports[]</text>
    </g>
  </g>

  <!-- bottom note -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">block · flow · anchors · 1.2 core</text>
  </g>
</svg>
