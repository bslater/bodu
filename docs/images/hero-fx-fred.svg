<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Financial.ExchangeRates.Fred — FRED (St. Louis Fed) provider">
  <title>Bodu.Financial.ExchangeRates.Fred</title>
  <defs>
    <linearGradient id="fxfred-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#fxfred-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#4ADE80"/>
    <rect y="14" width="150" height="8" fill="#4ADE80"/>
    <text x="75" y="16" fill="#052E16" text-anchor="middle" font-weight="700" font-size="11">FRED</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="44">St. Louis Fed</text>
      <text x="10" y="61"><tspan fill="#94A3B8">DEXUSEU</tspan></text>
    </g>
    <rect x="10" y="74" width="70" height="18" rx="9" fill="#0F172A" stroke="#4ADE80" stroke-width="1.2"/>
    <text x="45" y="87" fill="#4ADE80" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-size="9.5">api_key</text>
    <g transform="translate(10 100)">
      <polyline points="0,32 22,24 43,28 65,14 87,20 108,10 130,16" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="130" cy="16" r="3" fill="#4ADE80"/>
      <text x="0" y="52" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">series_id per pair</text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#4ADE80" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#4ADE80" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#4ADE80" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">fetch</text>
    <text x="52" y="56">parse</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Provider</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="10" y="46">IDatedRateProvider</text>
      <text x="10" y="70">RateBook</text>
      <text x="10" y="94"><tspan fill="#4ADE80">mapped pairs</tspan></text>
      <text x="10" y="118"><tspan fill="#94A3B8" font-size="9">PairWebRateProvider</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">services.AddFredExchangeRates()</text>
  </g>
</svg>
