<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.IO.Biff — low-level codec for the BIFF5 and BIFF8 record streams inside .xls workbooks">
  <title>Bodu.IO.Biff</title>
  <defs>
    <linearGradient id="iobiff-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#iobiff-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#F59E0B"/>
    <rect y="14" width="150" height="8" fill="#F59E0B"/>
    <text x="75" y="16" fill="#3A2A04" text-anchor="middle" font-weight="700" font-size="11">BIFF records</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="44"><tspan fill="#94A3B8">BOF</tspan> · vers · dt</text>
      <text x="10" y="61">record id · length · payload</text>
      <text x="10" y="78"><tspan fill="#94A3B8">CONTINUE</tspan> · SST</text>
      <text x="10" y="95">RK · NUMBER · LABEL</text>
      <text x="10" y="120"><tspan fill="#94A3B8" font-size="9">BIFF5 code pages · BIFF8 Unicode</tspan></text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#F59E0B" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#F59E0B" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#F59E0B" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">frame</text>
    <text x="52" y="56">emit</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">BiffReader</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="44">Read()</text>
      <text x="10" y="61">RecordType / ValueSpan</text>
      <text x="10" y="78">GetNumber() · GetLabel()</text>
      <text x="10" y="95"><tspan fill="#60A5FA">BiffSstReader</tspan></text>
      <text x="10" y="112"><tspan fill="#60A5FA">BiffWriter</tspan></text>
      <text x="10" y="129"><tspan fill="#94A3B8" font-size="9">no workbook model · no CFB</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">record framing · typed accessors · reader + writer</text>
  </g>
</svg>
