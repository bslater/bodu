<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Text.Serialization — a System.Text.Json-style POCO serializer for TOML and Bencode over a lossless syntax tree">
  <defs>
    <style>
      .bg   { fill: #0F172A; }
      .pan  { fill: #1E293B; stroke: #334155; stroke-width: 1; }
      .ttl  { fill: #F8FAFC; font: 800 22px/1 "Segoe UI",Arial,sans-serif; }
      .sub  { fill: #94A3B8; font: 400 12px/1.3 "Segoe UI",Arial,sans-serif; }
      .chip { font: 700 11px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; fill: #0F172A; }
      .t1   { fill: #2DD4BF; }
      .t2   { fill: #A78BFA; }
      .t3   { fill: #FBBF24; }
      .t4   { fill: #60A5FA; }
      .ar   { stroke: #475569; stroke-width: 1.6; fill: none; }
      .cod  { fill: #E2E8F0; font: 700 12px/1.4 "Consolas",monospace; }
    </style>
    <marker id="h-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" width="480" height="220"/>
  <text class="ttl" x="28" y="48">Bodu.Text.Serialization</text>
  <text class="sub" x="28" y="70">A System.Text.Json-style POCO serializer</text>
  <text class="sub" x="28" y="86">for TOML and Bencode, over a lossless syntax tree.</text>

  <!-- mini pipeline -->
  <g transform="translate(28 110)">
    <rect class="t1" width="86" height="34" rx="6"/>
    <text class="chip" x="43" y="22">POCO</text>
    <rect class="t4" x="116" width="86" height="34" rx="6"/>
    <text class="chip" x="159" y="22">Engine</text>
    <rect class="t2" x="232" width="86" height="34" rx="6"/>
    <text class="chip" x="275" y="22">Syntax tree</text>
    <rect class="t3" x="348" width="86" height="34" rx="6"/>
    <text class="chip" x="391" y="22">Text / bytes</text>
    <path class="ar" marker-end="url(#h-a)" d="M102,17 L114,17"/>
    <path class="ar" marker-end="url(#h-a)" d="M218,17 L230,17"/>
    <path class="ar" marker-end="url(#h-a)" d="M334,17 L346,17"/>
  </g>

  <g transform="translate(28 168)">
    <rect class="pan" width="424" height="36" rx="6"/>
    <text class="cod" x="14" y="23">TomlSerializer.Serialize(config)  ·  Deserialize&lt;T&gt;(text)</text>
  </g>
</svg>
