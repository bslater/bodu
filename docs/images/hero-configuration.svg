<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Text.Configuration — file-targeted configuration layering">
  <title>Bodu.Text.Configuration</title>
  <defs>
    <linearGradient id="cfg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#cfg-bg)"/>

  <!-- Left column: layered sections -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="138" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="138" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="138" height="8" fill="#3B82F6"/>
    <text x="69" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">sections</text>

    <g font-family="'Consolas','Menlo',monospace" font-size="10">
      <g transform="translate(14 34)">
        <rect width="110" height="32" rx="5" fill="#0F172A" stroke="#475569" stroke-width="1"/>
        <text x="8" y="13" fill="#94A3B8">preamble</text>
        <text x="8" y="26" fill="#E2E8F0">root = true</text>
      </g>
      <g transform="translate(14 72)">
        <rect width="110" height="32" rx="5" fill="#0D3331" stroke="#2DD4BF" stroke-width="1"/>
        <text x="8" y="13" fill="#5EEAD4">[*.cs]</text>
        <text x="8" y="26" fill="#E2E8F0">indent = 4</text>
      </g>
      <g transform="translate(14 110)">
        <rect width="110" height="32" rx="5" fill="#2E1065" stroke="#A78BFA" stroke-width="1"/>
        <text x="8" y="13" fill="#C4B5FD">[src/**]</text>
        <text x="8" y="26" fill="#E2E8F0">indent = 2</text>
      </g>
    </g>
  </g>

  <!-- middle: resolve arrow with a target path -->
  <g transform="translate(176 80)">
    <g fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="18" x2="120" y2="18"/>
      <polygon points="120,18 112,14 112,22" fill="#60A5FA" stroke="none"/>
    </g>
    <text x="60" y="10" fill="#60A5FA" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">resolve</text>
    <text x="60" y="38" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9" text-anchor="middle">src/App/Foo.cs</text>
  </g>

  <!-- Right column: resolved flat view -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#A78BFA"/>
    <rect y="14" width="142" height="8" fill="#A78BFA"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">resolved view</text>

    <g font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="44" fill="#E2E8F0"><tspan fill="#60A5FA">indent:style</tspan> = space</text>
      <text x="10" y="64" fill="#E2E8F0"><tspan fill="#60A5FA">indent:size</tspan>  = 2</text>
      <text x="10" y="84" fill="#E2E8F0"><tspan fill="#60A5FA">log:level</tspan>    = Warn</text>
      <text x="10" y="104" fill="#E2E8F0"><tspan fill="#60A5FA">root</tspan>         = true</text>
      <text x="10" y="128" fill="#94A3B8">GetInt32 · GetEnum&lt;T&gt;</text>
    </g>
  </g>

  <!-- bottom note -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">layer · glob-match · last-wins · resolve</text>
  </g>
</svg>
