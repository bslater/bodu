<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Collections — bounded, ordered, and probabilistic collections">
  <title>Bodu.Collections</title>
  <defs>
    <linearGradient id="col-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#col-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#34D399"/>
    <rect y="14" width="150" height="8" fill="#34D399"/>
    <text x="75" y="16" fill="#06281F" text-anchor="middle" font-weight="700" font-size="10">CircularBuffer&lt;T&gt;</text>

    <g stroke="#334155" stroke-width="1.2">
      <rect x="105" y="78" width="18" height="18" rx="3" fill="#34D399"/>
      <rect x="90" y="112" width="18" height="18" rx="3" fill="#34D399"/>
      <rect x="66" y="126" width="18" height="18" rx="3" fill="#34D399"/>
      <rect x="42" y="112" width="18" height="18" rx="3" fill="#0F172A"/>
      <rect x="27" y="78" width="18" height="18" rx="3" fill="#0F172A"/>
      <rect x="42" y="44" width="18" height="18" rx="3" fill="#0F172A"/>
      <rect x="66" y="30" width="18" height="18" rx="3" fill="#34D399"/>
      <rect x="90" y="44" width="18" height="18" rx="3" fill="#34D399"/>
    </g>
    <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">
      <text x="75" y="26" text-anchor="middle">head</text>
      <text x="128" y="74">tail</text>
    </g>
    <line x1="126" y1="78" x2="118" y2="84" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
    <text x="10" y="152" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">bounded · O(1) ends</text>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#34D399" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#34D399" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#34D399" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">enqueue</text>
    <text x="52" y="56">dequeue</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Catalogue</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="42">Deque&lt;T&gt;</text>
      <text x="10" y="59">EvictingDictionary</text>
      <text x="10" y="76">IndexedPriorityQueue</text>
      <text x="10" y="93">RangeDictionary</text>
      <text x="10" y="110"><tspan fill="#60A5FA">IntervalTree</tspan></text>
      <text x="10" y="127"><tspan fill="#60A5FA">Trie · Graph&lt;T&gt;</tspan></text>
      <text x="10" y="144"><tspan fill="#34D399">BloomFilter · HLL</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">bounded · ordered · navigable · probabilistic</text>
  </g>
</svg>
