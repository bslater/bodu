<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Collections — bounded, ordered, and probabilistic collections">
  <title>Bodu.Collections</title>
  <defs>
    <linearGradient id="col-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#col-bg)"/>

  <!-- Left column: circular buffer ring -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="170" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="170" height="22" rx="8" fill="#34D399"/>
    <rect y="14" width="170" height="8" fill="#34D399"/>
    <text x="85" y="16" fill="#06281F" text-anchor="middle" font-weight="700" font-size="11" font-family="'Consolas','Menlo',monospace">CircularBuffer&lt;T&gt;</text>

    <!-- eight slots on a ring, head/tail markers -->
    <g stroke="#334155" stroke-width="1.2">
      <rect x="118" y="88" width="18" height="18" rx="3" fill="#34D399"/>
      <rect x="103" y="122" width="18" height="18" rx="3" fill="#34D399"/>
      <rect x="76"  y="136" width="18" height="18" rx="3" fill="#34D399"/>
      <rect x="49"  y="122" width="18" height="18" rx="3" fill="#0F172A"/>
      <rect x="34"  y="88"  width="18" height="18" rx="3" fill="#0F172A"/>
      <rect x="49"  y="54"  width="18" height="18" rx="3" fill="#0F172A"/>
      <rect x="76"  y="40"  width="18" height="18" rx="3" fill="#34D399"/>
      <rect x="103" y="54"  width="18" height="18" rx="3" fill="#34D399"/>
    </g>
    <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">
      <text x="85" y="35" text-anchor="middle">head</text>
      <text x="145" y="82" text-anchor="start">tail</text>
    </g>
    <g fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round">
      <path d="M 85 38 L 85 44"/>
      <path d="M 141 85 L 133 91"/>
    </g>
  </g>

  <!-- middle: enqueue/dequeue arrows -->
  <g transform="translate(206 84)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="84" y2="0"/>
    <polygon points="84,0 76,-4 76,4" fill="#34D399" stroke="none"/>
    <line x1="84" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#34D399" stroke="none"/>
  </g>
  <g transform="translate(206 84)" fill="#34D399" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="42" y="-6">enqueue</text>
    <text x="42" y="56">dequeue</text>
  </g>

  <!-- Right column: the catalogue -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Catalogue</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="42">Deque&lt;T&gt;</text>
      <text x="10" y="59">EvictingDictionary</text>
      <text x="10" y="76">IndexedPriorityQueue</text>
      <text x="10" y="93">RangeDictionary</text>
      <text x="10" y="110" fill="#60A5FA">IntervalTree</text>
      <text x="10" y="127" fill="#60A5FA">Trie · Graph&lt;T&gt;</text>
      <text x="10" y="144" fill="#34D399">BloomFilter · HLL</text>
    </g>
  </g>

  <!-- bottom note -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">bounded · ordered · navigable · probabilistic</text>
  </g>
</svg>
