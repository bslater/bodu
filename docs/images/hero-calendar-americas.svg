    <text x="26" y="46" fill="#34D399" font-size="9.5" text-anchor="middle">US</text>
    <rect x="43" y="34" width="28" height="16" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="57" y="46" fill="#34D399" font-size="9.5" text-anchor="middle">CA</text>
    <rect x="74" y="34" width="28" height="16" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="88" y="46" fill="#34D399" font-size="9.5" text-anchor="middle">MX</text>
    <rect x="105" y="34" width="28" height="16" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="119" y="46" fill="#34D399" font-size="9.5" text-anchor="middle">BR</text>
    <rect x="12" y="58" width="28" height="16" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="26" y="70" fill="#34D399" font-size="9.5" text-anchor="middle">AR</text>
    <rect x="43" y="58" width="28" height="16" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="57" y="70" fill="#34D399" font-size="9.5" text-anchor="middle">CL</text>
    <rect x="74" y="58" width="28" height="16" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="88" y="70" fill="#34D399" font-size="9.5" text-anchor="middle">CO</text>
    <rect x="105" y="58" width="28" height="16" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="119" y="70" fill="#34D399" font-size="9.5" text-anchor="middle">PE</text>
    <text x="12" y="150" fill="#94A3B8" font-size="9">AmericasCalendarData</text>
