    <rect y="14" width="170" height="8" fill="#34D399"/>
    <text x="85" y="16" fill="#06281F" text-anchor="middle" font-weight="700" font-size="11">Americas</text>

    <!-- month grid, notable dates highlighted -->
    <g stroke="#334155" stroke-width="1">
      <rect x="15" y="40" width="28" height="22" rx="3" fill="#34D399"/>
      <rect x="51" y="40" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="87" y="40" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="123" y="40" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="15" y="70" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="51" y="70" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="87" y="70" width="28" height="22" rx="3" fill="#34D399"/>
      <rect x="123" y="70" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="15" y="100" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="51" y="100" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="87" y="100" width="28" height="22" rx="3" fill="#0F172A"/>
      <rect x="123" y="100" width="28" height="22" rx="3" fill="#34D399"/>
    </g>
    <text x="12" y="150" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">national + subdivision rules</text>
  </g>

  <!-- middle: load arrows -->
  <g transform="translate(206 84)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="84" y2="0"/>
    <polygon points="84,0 76,-4 76,4" fill="#34D399" stroke="none"/>
    <line x1="84" y1="36" x2="0" y2="36"/>
