  </g>
  <g transform="translate(206 84)" fill="#34D399" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="42" y="-6">resolve</text>
    <text x="42" y="56">import</text>
  </g>

  <!-- Right column: territory chips -->
  <g transform="translate(310 30)" font-family="'Consolas','Menlo',monospace" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
