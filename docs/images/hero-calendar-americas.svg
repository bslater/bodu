<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Globalization.Calendar.Americas — embedded notable-date resource pack for Americas">
  <title>Bodu.Globalization.Calendar.Americas</title>
  <defs>
    <linearGradient id="calamericas-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#calamericas-bg)"/>

  <!-- Left column: region calendar -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="170" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
