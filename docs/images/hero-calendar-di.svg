<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Globalization.Calendar.DependencyInjection — service registration for the notable-date engine">
  <title>Bodu.Globalization.Calendar.DependencyInjection</title>
  <defs>
    <linearGradient id="caldi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#caldi-bg)"/>

  <!-- Left column: mini calendar -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#60A5FA"/>
    <rect y="14" width="150" height="8" fill="#60A5FA"/>
    <text x="75" y="16" fill="#0B2545" text-anchor="middle" font-weight="700" font-size="10" font-family="'Consolas','Menlo',monospace">NotableDateService</text>

    <g stroke="#334155" stroke-width="1">
      <rect x="15" y="36" width="24" height="20" rx="3" fill="#0F172A"/>
      <rect x="45" y="36" width="24" height="20" rx="3" fill="#0F172A"/>
      <rect x="75" y="36" width="24" height="20" rx="3" fill="#60A5FA"/>
      <rect x="105" y="36" width="24" height="20" rx="3" fill="#0F172A"/>
      <rect x="15" y="62" width="24" height="20" rx="3" fill="#0F172A"/>
      <rect x="45" y="62" width="24" height="20" rx="3" fill="#60A5FA"/>
      <rect x="75" y="62" width="24" height="20" rx="3" fill="#0F172A"/>
      <rect x="105" y="62" width="24" height="20" rx="3" fill="#0F172A"/>
      <rect x="15" y="88" width="24" height="20" rx="3" fill="#0F172A"/>
      <rect x="45" y="88" width="24" height="20" rx="3" fill="#0F172A"/>
      <rect x="75" y="88" width="24" height="20" rx="3" fill="#0F172A"/>
      <rect x="105" y="88" width="24" height="20" rx="3" fill="#60A5FA"/>
    </g>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9">
      <text x="15" y="128">GetNotableDates(year)</text>
      <text x="15" y="146" fill="#94A3B8">IsWorkingDay · Observed</text>
    </g>
  </g>

  <!-- middle: plug connector -->
  <g transform="translate(186 92)">
    <line x1="0" y1="10" x2="58" y2="10" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <rect x="58" y="0" width="18" height="20" rx="3" fill="#60A5FA"/>
    <rect x="76" y="4" width="8" height="4" fill="#60A5FA"/>
    <rect x="76" y="12" width="8" height="4" fill="#60A5FA"/>
    <rect x="88" y="-4" width="10" height="28" rx="3" fill="none" stroke="#34D399" stroke-width="2"/>
    <line x1="98" y1="10" x2="104" y2="10" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right column: the service collection -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="10" font-family="'Consolas','Menlo',monospace">IServiceCollection</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="10" y="46">services</text>
      <text x="14" y="64" fill="#60A5FA">.AddNotableDateService</text>
      <text x="22" y="80">(<tspan fill="#34D399">"AU"</tspan>)</text>
      <text x="14" y="102" fill="#60A5FA">.AddReloadableNotable</text>
      <text x="22" y="118" fill="#60A5FA">DateService(…)</text>
      <text x="10" y="144" fill="#94A3B8" font-size="9">hosted · reloadable</text>
    </g>
  </g>

  <!-- bottom note -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">using Bodu.Globalization.Calendar;</text>
  </g>
</svg>
