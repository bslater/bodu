<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Collections.Merkle — RFC 6962 Merkle trees, inclusion proofs, and consistency proofs">
  <title>Bodu.Collections.Merkle</title>
  <defs>
    <linearGradient id="merkle-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#merkle-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#2DD4BF"/>
    <rect y="14" width="150" height="8" fill="#2DD4BF"/>
    <text x="75" y="16" fill="#042F2A" text-anchor="middle" font-weight="700" font-size="11">MTH(D[n])</text>

    <g stroke="#2DD4BF" stroke-width="1.6" fill="none">
      <line x1="75" y1="52" x2="52" y2="80"/>
      <line x1="75" y1="52" x2="112" y2="112"/>
      <line x1="52" y1="90" x2="35" y2="112"/>
      <line x1="52" y1="90" x2="69" y2="112"/>
    </g>
    <circle cx="75" cy="46" r="7" fill="#2DD4BF"/>
    <circle cx="52" cy="85" r="5.5" fill="none" stroke="#2DD4BF" stroke-width="1.8"/>
    <g fill="#2DD4BF" stroke="#334155" stroke-width="0.8">
      <rect x="28" y="112" width="14" height="14" rx="2.5"/>
      <rect x="62" y="112" width="14" height="14" rx="2.5"/>
      <rect x="105" y="112" width="14" height="14" rx="2.5" opacity="0.6"/>
    </g>
    <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="8.5" text-anchor="middle">
      <text x="35" y="136">d0</text>
      <text x="69" y="136">d1</text>
      <text x="112" y="136">d2</text>
    </g>
    <text x="10" y="152" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">3 leaves split 2 + 1</text>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#2DD4BF" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#2DD4BF" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#2DD4BF" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">commit</text>
    <text x="52" y="56">verify</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Proofs</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="42">ComputeRoot</text>
      <text x="10" y="59">ComputeBlocked</text>
      <text x="10" y="76"><tspan fill="#2DD4BF">AuthenticationPath</tspan></text>
      <text x="10" y="93"><tspan fill="#2DD4BF">ConsistencyProof</tspan></text>
      <text x="10" y="110">VerifyInclusion</text>
      <text x="10" y="127">BindRoot</text>
      <text x="10" y="144"><tspan fill="#94A3B8" font-size="9">Bodu.Core only</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">RFC 6962 · H(0x00‖leaf) · H(0x01‖l‖r) · O(log n) proofs</text>
  </g>
</svg>
