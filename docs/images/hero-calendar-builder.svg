<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Globalization.Calendar.Builder — fluent authoring for notable-date documents">
  <title>Bodu.Globalization.Calendar.Builder</title>
  <defs>
    <linearGradient id="calb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#calb-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#FBBF24"/>
    <rect y="14" width="150" height="8" fill="#FBBF24"/>
    <text x="75" y="16" fill="#3A2A04" text-anchor="middle" font-weight="700" font-size="10">DocumentBuilder</text>

    <g stroke="#334155" stroke-width="1">
      <rect x="10" y="36" width="130" height="20" rx="10" fill="#0F172A"/>
      <rect x="10" y="64" width="130" height="20" rx="10" fill="#0F172A"/>
      <rect x="10" y="92" width="130" height="20" rx="10" fill="#0F172A"/>
      <rect x="10" y="120" width="130" height="20" rx="10" fill="#FBBF24"/>
    </g>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="18" y="49">.AddFixedDate(…)</text>
      <text x="18" y="77">.AddNthWeekday(…)</text>
      <text x="18" y="105">.AddEasterOffset(…)</text>
      <text x="18" y="133" fill="#3A2A04" font-weight="700">.Save("au.xml")</text>
    </g>
    <g fill="none" stroke="#FBBF24" stroke-width="1.4">
      <path d="M 75 56 L 75 64"/>
      <path d="M 75 84 L 75 92"/>
      <path d="M 75 112 L 75 120"/>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#FBBF24" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#FBBF24" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#FBBF24" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">ToXml</text>
    <text x="52" y="56">FromXml</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Document</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="10" y="42"><tspan fill="#60A5FA">&lt;notableDates&gt;</tspan></text>
      <text x="10" y="57">  &lt;rule name=<tspan fill="#34D399">"Anzac"</tspan></text>
      <text x="10" y="72">    month=<tspan fill="#34D399">"4"</tspan> day=<tspan fill="#34D399">"25"</tspan>/&gt;</text>
      <text x="10" y="87">  &lt;rule name=<tspan fill="#34D399">"Easter"</tspan></text>
      <text x="10" y="102">    algorithm=<tspan fill="#34D399">"…"</tspan>/&gt;</text>
      <text x="10" y="117"><tspan fill="#60A5FA">&lt;/notableDates&gt;</tspan></text>
      <text x="10" y="139"><tspan fill="#94A3B8" font-size="9">XML · JSON subset</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">author · serialize · load · resolve</text>
  </g>
</svg>
