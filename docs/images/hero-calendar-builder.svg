<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Globalization.Calendar.Builder — fluent authoring for notable-date documents">
  <title>Bodu.Globalization.Calendar.Builder</title>
  <defs>
    <linearGradient id="calb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#calb-bg)"/>

  <!-- Left column: the fluent chain -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="170" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="170" height="22" rx="8" fill="#FBBF24"/>
    <rect y="14" width="170" height="8" fill="#FBBF24"/>
    <text x="85" y="16" fill="#3A2A04" text-anchor="middle" font-weight="700" font-size="10" font-family="'Consolas','Menlo',monospace">DocumentBuilder</text>

    <g stroke="#334155" stroke-width="1">
      <rect x="12" y="36" width="146" height="20" rx="10" fill="#0F172A"/>
      <rect x="12" y="64" width="146" height="20" rx="10" fill="#0F172A"/>
      <rect x="12" y="92" width="146" height="20" rx="10" fill="#0F172A"/>
      <rect x="12" y="120" width="146" height="20" rx="10" fill="#FBBF24"/>
    </g>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="20" y="50">.AddFixedDate(…)</text>
      <text x="20" y="78">.AddNthWeekday(…)</text>
      <text x="20" y="106">.AddEasterOffset(…)</text>
      <text x="20" y="134" fill="#3A2A04" font-weight="700">.Save("au.xml")</text>
    </g>
    <g fill="none" stroke="#FBBF24" stroke-width="1.4">
      <path d="M 85 56 L 85 64"/>
      <path d="M 85 84 L 85 92"/>
      <path d="M 85 112 L 85 120"/>
    </g>
  </g>

  <!-- middle: serialize arrows -->
  <g transform="translate(206 84)" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="84" y2="0"/>
    <polygon points="84,0 76,-4 76,4" fill="#FBBF24" stroke="none"/>
    <line x1="84" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#FBBF24" stroke="none"/>
  </g>
  <g transform="translate(206 84)" fill="#FBBF24" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="42" y="-6">ToXml</text>
    <text x="42" y="56">FromXml</text>
  </g>

  <!-- Right column: the document -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Document</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="10" y="44" fill="#60A5FA">&lt;notableDates&gt;</text>
      <text x="18" y="62">&lt;rule name=<tspan fill="#34D399">"Anzac"</tspan></text>
      <text x="26" y="78">month=<tspan fill="#34D399">"4"</tspan> day=<tspan fill="#34D399">"25"</tspan>/&gt;</text>
      <text x="18" y="96">&lt;rule name=<tspan fill="#34D399">"Easter"</tspan></text>
      <text x="26" y="112">algorithm=<tspan fill="#34D399">"…"</tspan>/&gt;</text>
      <text x="10" y="130" fill="#60A5FA">&lt;/notableDates&gt;</text>
      <text x="10" y="150" fill="#94A3B8" font-size="9">XML · JSON subset</text>
    </g>
  </g>

  <!-- bottom note -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">author · serialize · load · resolve</text>
  </g>
</svg>
