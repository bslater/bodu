<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu serializers — Bencode, TOML, and YAML sharing one System.Text.Json-aligned shape">
  <title>Bodu serializers — Bencode · TOML · YAML</title>
  <defs>
    <linearGradient id="ser-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#ser-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#A78BFA"/>
    <rect y="14" width="150" height="8" fill="#A78BFA"/>
    <text x="75" y="16" fill="#241A47" text-anchor="middle" font-weight="700" font-size="11">three formats</text>

    <g stroke="#334155" stroke-width="1.2">
      <rect x="10" y="34" width="130" height="34" rx="6" fill="#0F172A"/>
      <rect x="10" y="76" width="130" height="34" rx="6" fill="#0F172A"/>
      <rect x="10" y="118" width="130" height="34" rx="6" fill="#0F172A"/>
    </g>
    <g stroke="none">
      <rect x="10" y="34" width="5" height="34" rx="2.5" fill="#34D399"/>
      <rect x="10" y="76" width="5" height="34" rx="2.5" fill="#FBBF24"/>
      <rect x="10" y="118" width="5" height="34" rx="2.5" fill="#60A5FA"/>
    </g>
    <g font-family="'Consolas','Menlo',monospace">
      <text x="24" y="48" fill="#34D399" font-weight="700" font-size="10">bencode</text>
      <text x="24" y="62" fill="#94A3B8" font-size="9">d3:key5:valuee</text>
      <text x="24" y="90" fill="#FBBF24" font-weight="700" font-size="10">TOML</text>
      <text x="24" y="104" fill="#94A3B8" font-size="9">key = "value"</text>
      <text x="24" y="132" fill="#60A5FA" font-weight="700" font-size="10">YAML</text>
      <text x="24" y="146" fill="#94A3B8" font-size="9">key: value</text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#A78BFA" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#A78BFA" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#A78BFA" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">serialize</text>
    <text x="52" y="56">deserialize</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">One shape</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="46">•Serializer</text>
      <text x="10" y="63">•Node <tspan fill="#94A3B8">mutable DOM</tspan></text>
      <text x="10" y="80">•Document <tspan fill="#94A3B8">read-only</tspan></text>
      <text x="10" y="97">Utf8•Reader</text>
      <text x="10" y="114">Utf8•Writer</text>
      <text x="10" y="139"><tspan fill="#94A3B8" font-size="9">System.Text.Json-aligned</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">three self-contained libraries · one architecture</text>
  </g>
</svg>
