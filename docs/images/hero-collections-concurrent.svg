<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Collections.Concurrent — thread-safe collection variants">
  <title>Bodu.Collections.Concurrent</title>
  <defs>
    <linearGradient id="colc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#colc-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#60A5FA"/>
    <rect y="14" width="150" height="8" fill="#60A5FA"/>
    <text x="75" y="16" fill="#0B2545" text-anchor="middle" font-weight="700" font-size="11">Threads</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="48">producer 1</text>
      <text x="10" y="76">producer 2</text>
      <text x="10" y="104">consumer</text>
    </g>
    <g fill="none" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4">
      <line x1="10" y1="58" x2="138" y2="58"/>
      <line x1="10" y1="96" x2="138" y2="96"/>
      <line x1="138" y1="134" x2="10" y2="134"/>
    </g>
    <text x="10" y="152" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">no locks on the hot path</text>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#60A5FA" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#60A5FA" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#60A5FA" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">TryAdd</text>
    <text x="52" y="56">TryTake</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">MPMC ring</text>

    <g stroke="#334155" stroke-width="1.2">
      <rect x="12" y="38" width="26" height="22" rx="3" fill="#60A5FA"/>
      <rect x="44" y="38" width="26" height="22" rx="3" fill="#60A5FA"/>
      <rect x="76" y="38" width="26" height="22" rx="3" fill="#0F172A"/>
      <rect x="108" y="38" width="26" height="22" rx="3" fill="#0F172A"/>
    </g>
    <g fill="#0B2545" font-family="'Consolas','Menlo',monospace" font-size="9" text-anchor="middle">
      <text x="25" y="52">s=4</text>
      <text x="57" y="52">s=5</text>
      <text x="89" y="52" fill="#94A3B8">s=6</text>
      <text x="121" y="52" fill="#94A3B8">s=7</text>
    </g>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="12" y="86">ConcurrentCircular</text>
      <text x="12" y="102">Buffer&lt;T&gt;</text>
      <text x="12" y="126"><tspan fill="#60A5FA">ConcurrentHashSet&lt;T&gt;</tspan></text>
      <text x="12" y="142"><tspan fill="#94A3B8" font-size="9">lock-free membership</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">Vyukov MPMC ring · lock-free set</text>
  </g>
</svg>
