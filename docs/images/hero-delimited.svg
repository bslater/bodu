<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Text.Delimited — character-separated record parsing">
  <title>Bodu.Text.Delimited</title>
  <defs>
    <linearGradient id="dlm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#dlm-bg)"/>

  <!-- Left column: row/column grid model -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="138" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="138" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="138" height="8" fill="#3B82F6"/>
    <text x="69" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">row model</text>

    <g font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
      <!-- header row -->
      <rect x="8" y="34" width="122" height="24" fill="#3B82F6" opacity="0.85"/>
      <text x="29" y="50" fill="#F8FAFC" font-weight="700">name</text>
      <text x="69" y="50" fill="#F8FAFC" font-weight="700">age</text>
      <text x="109" y="50" fill="#F8FAFC" font-weight="700">city</text>
      <!-- data rows -->
      <g fill="none" stroke="#334155" stroke-width="1">
        <rect x="8" y="58" width="122" height="24"/>
        <rect x="8" y="82" width="122" height="24"/>
        <rect x="8" y="106" width="122" height="24"/>
        <line x1="48" y1="34" x2="48" y2="130"/>
        <line x1="89" y1="34" x2="89" y2="130"/>
      </g>
      <g fill="#E2E8F0">
        <text x="29" y="74">Alice</text>
        <text x="69" y="74">30</text>
        <text x="109" y="74">Paris</text>
        <text x="29" y="98">Bob</text>
        <text x="69" y="98">25</text>
        <text x="109" y="98">London</text>
        <text x="29" y="122">Eve</text>
        <text x="69" y="122">35</text>
        <text x="109" y="122">Rome</text>
      </g>
    </g>
  </g>

  <!-- middle: bidirectional pipeline arrows -->
  <g transform="translate(176 80)" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="120" y2="0"/>
    <polygon points="120,0 112,-4 112,4" fill="#60A5FA" stroke="none"/>
    <line x1="120" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#60A5FA" stroke="none"/>
  </g>
  <g transform="translate(176 80)" fill="#60A5FA" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="60" y="-6">format</text>
    <text x="60" y="56">parse</text>
  </g>

  <!-- Right column: delimited text -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#A78BFA"/>
    <rect y="14" width="142" height="8" fill="#A78BFA"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">csv text</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="11">
      <text x="10" y="44">name<tspan fill="#FBBF24">,</tspan>age<tspan fill="#FBBF24">,</tspan>city</text>
      <text x="10" y="64">Alice<tspan fill="#FBBF24">,</tspan>30<tspan fill="#FBBF24">,</tspan>Paris</text>
      <text x="10" y="84">Bob<tspan fill="#FBBF24">,</tspan>25<tspan fill="#FBBF24">,</tspan>London</text>
      <text x="10" y="104">Eve<tspan fill="#FBBF24">,</tspan>35<tspan fill="#FBBF24">,</tspan>Rome</text>
    </g>
  </g>

  <!-- bottom note -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">delimited · quoted · header-keyed</text>
  </g>
</svg>
