<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Financial.ExchangeRates.Caching.Sqlite — durable SQLite backend for exchange-rate caching">
  <title>Bodu.Financial.ExchangeRates.Caching.Sqlite</title>
  <defs>
    <linearGradient id="fxsql-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#fxsql-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#60A5FA"/>
    <rect y="14" width="150" height="8" fill="#60A5FA"/>
    <text x="75" y="16" fill="#0B2545" text-anchor="middle" font-weight="700" font-size="11">rates.db</text>

    <g stroke="#60A5FA" stroke-width="1.6" fill="#0F172A">
      <g transform="translate(47 40)">
        <ellipse cx="28" cy="8" rx="28" ry="8"/>
        <path d="M 0 8 L 0 50 A 28 8 0 0 0 56 50 L 56 8" fill="#0F172A"/>
        <ellipse cx="28" cy="29" rx="28" ry="8" fill="none" stroke-dasharray="3 3" stroke-width="1"/>
      </g>
    </g>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="14" y="122">rates <tspan fill="#94A3B8">(pair,date,mid)</tspan></text>
      <text x="14" y="139">coverage <tspan fill="#94A3B8">(pair,range)</tspan></text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#60A5FA" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#60A5FA" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#60A5FA" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">lookup</text>
    <text x="52" y="56">persist</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Rate cache</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="10" y="44"><tspan fill="#60A5FA">AddSqliteRateCache(…)</tspan></text>
      <text x="10" y="68">CachingExchangeRate</text>
      <text x="10" y="84">Provider <tspan fill="#94A3B8">read-through</tspan></text>
      <text x="10" y="108"><tspan fill="#94A3B8" font-size="9">survives restarts —</tspan></text>
      <text x="10" y="124"><tspan fill="#94A3B8" font-size="9">fetch once per range</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">durable single-file cache · zero server</text>
  </g>
</svg>
