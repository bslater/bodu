<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.IO.Hashing — non-cryptographic hashing, CRC catalogue, and check digits">
  <title>Bodu.IO.Hashing</title>
  <defs>
    <linearGradient id="iohash-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#iohash-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#FB923C"/>
    <rect y="14" width="150" height="8" fill="#FB923C"/>
    <text x="75" y="16" fill="#3B1E04" text-anchor="middle" font-weight="700" font-size="11">input bytes</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="46"><tspan fill="#94A3B8">0x</tspan>a7 <tspan fill="#94A3B8">0x</tspan>f3 <tspan fill="#94A3B8">0x</tspan>18</text>
      <text x="10" y="64"><tspan fill="#94A3B8">0x</tspan>c2 <tspan fill="#94A3B8">0x</tspan>9d <tspan fill="#94A3B8">0x</tspan>44</text>
    </g>
    <g stroke="#334155" stroke-width="1.2">
      <rect x="10" y="88" width="20" height="20" rx="3" fill="#FB923C"/>
      <rect x="36" y="88" width="20" height="20" rx="3" fill="#0F172A"/>
      <rect x="62" y="88" width="20" height="20" rx="3" fill="#FB923C"/>
      <rect x="88" y="88" width="20" height="20" rx="3" fill="#0F172A"/>
      <rect x="114" y="88" width="20" height="20" rx="3" fill="#FB923C"/>
    </g>
    <text x="10" y="126" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">shift register · polynomial</text>
    <text x="10" y="148" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">crc32 = ec6c8f7d</text>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#FB923C" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#FB923C" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#FB923C" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#FB923C" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">append</text>
    <text x="52" y="56">digest</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Catalogue</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="44">Crc <tspan fill="#94A3B8">×85 standards</tspan></text>
      <text x="10" y="60">Fletcher-16/32/64</text>
      <text x="10" y="76">Adler32 · Adler64</text>
      <text x="10" y="92">Fnv1a32 · Fnv1a64</text>
      <text x="10" y="116"><tspan fill="#60A5FA">Luhn · IBAN · ISBN</tspan></text>
      <text x="10" y="132"><tspan fill="#60A5FA">Damm · ISO 7064</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">RevEng CRC catalogue · streaming · resumable · check digits</text>
  </g>
</svg>
