<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Financial.ExchangeRates.Xe — XE.com exchange-rate provider">
  <title>Bodu.Financial.ExchangeRates.Xe</title>
  <defs>
    <linearGradient id="fxxe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#fxxe-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#F87171"/>
    <rect y="14" width="150" height="8" fill="#F87171"/>
    <text x="75" y="16" fill="#3B0A0A" text-anchor="middle" font-weight="700" font-size="11">XE</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="44">XE.com currency</text>
      <text x="10" y="61"><tspan fill="#94A3B8">data service</tspan></text>
    </g>
    <rect x="10" y="74" width="79" height="18" rx="9" fill="#0F172A" stroke="#F87171" stroke-width="1.2"/>
    <text x="49" y="87" fill="#F87171" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-size="9.5">JSON + token</text>
    <g transform="translate(10 100)">
      <polyline points="0,34 22,26 43,30 65,16 87,22 108,8 130,14" fill="none" stroke="#F87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="130" cy="14" r="3" fill="#F87171"/>
      <text x="0" y="52" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">USD/EUR daily reference</text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#F87171" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#F87171" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#F87171" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#F87171" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">fetch</text>
    <text x="52" y="56">parse</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Provider</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="10" y="46">IDatedRateProvider</text>
      <text x="10" y="70">RateBook</text>
      <text x="10" y="94"><tspan fill="#F87171">full history</tspan></text>
      <text x="10" y="118"><tspan fill="#94A3B8" font-size="9">account-scoped API</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">services.AddXeExchangeRates()</text>
  </g>
</svg>
