<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 448" role="img" aria-labelledby="clm-t clm-d">
  <title id="clm-t">Bodu.Collections — namespace map</title>
  <desc id="clm-d">Bodu.Collections ships the specialized collection catalogue across four namespaces. Bodu.Collections.Generic holds the bounded ring-backed collections, the evicting and sequenced dictionaries, navigable sets and dictionaries with rank and select, bidirectional, layered, and defaulting dictionaries, the two-key table, bit set, and the range-keyed lookups and overlap-storing interval trees. Bodu.Collections.Probabilistic holds the approximate sketches: BloomFilter, CountMinSketch, and HyperLogLog. Bodu.Collections.Generic.Graphs holds the graph container, graph algorithms, and union-find. Bodu.Collections.Generic.Trees holds the trie family, radix tries, the Aho-Corasick multi-pattern matcher, and the n-ary tree. The package depends on Bodu.Core, and the thread-safe variants ship in Bodu.Collections.Concurrent.</desc>

  <defs>
    <style>
      .clm-bg   { fill: #0F172A; }
      .clm-pan  { fill: #1E293B; stroke: #334155; stroke-width: 1; }
      .clm-hdr  { fill: #111827; stroke: #334155; stroke-width: 1; }
      .clm-ttl  { fill: #F8FAFC; font: 700 15px/1 "Segoe UI",Arial,sans-serif; }
      .clm-form { fill: #94A3B8; font: italic 12px/1 "Cambria",Georgia,serif; }
      .clm-card { fill: #0D3331; stroke: #2DD4BF; stroke-width: 1; }
      .clm-ns   { fill: #5EEAD4; font: 700 12px/1 "Consolas",Menlo,monospace; }
      .clm-role { fill: #E2E8F0; font: 700 11px/1 "Segoe UI",Arial,sans-serif; }
      .clm-type { fill: #94A3B8; font: 400 10px/1 "Segoe UI",Arial,sans-serif; }
      .clm-aux  { fill: #2E1065; stroke: #A78BFA; stroke-width: 1; }
      .clm-auxt { fill: #C4B5FD; font: 700 11px/1 "Segoe UI",Arial,sans-serif; }
      .clm-auxs { fill: #CBD5E1; font: 400 10px/1 "Segoe UI",Arial,sans-serif; }
    </style>
  </defs>

  <rect class="clm-bg" width="840" height="448"/>

