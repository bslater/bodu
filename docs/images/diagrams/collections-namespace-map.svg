      <text class="clm-ns" x="12" y="22">Bodu.Collections</text>
      <text class="clm-ns" x="12" y="37">.Generic.Trees</text>
      <text class="clm-role" x="12" y="57">Tries and text search</text>
      <text class="clm-type" x="12" y="77">Trie · Trie&lt;V&gt;</text>
      <text class="clm-type" x="12" y="95">RadixTrie (path-compressed)</text>
      <text class="clm-type" x="12" y="113">AhoCorasickAutomaton</text>
      <text class="clm-type" x="12" y="131">Tree&lt;T&gt; n-ary traversals</text>
    </g>

    <!-- Annotation: dependencies -->
    <rect class="clm-aux" x="14" y="380" width="792" height="34" rx="6"/>
    <text class="clm-auxt" x="28" y="401">Depends on Bodu.Core</text>
    <text class="clm-auxs" x="182" y="401">ThrowHelper guards · IRandomGenerator — thread-safe variants (ConcurrentCircularBuffer&lt;T&gt;, ConcurrentHashSet&lt;T&gt;) ship in Bodu.Collections.Concurrent</text>
  </g>
