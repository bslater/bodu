    <rect class="clm-hdr" y="38" width="820" height="8"/>
    <text class="clm-ttl" x="16" y="29">Bodu.Collections — the specialized collection catalogue</text>
    <text class="clm-form" x="804" y="29" text-anchor="end">namespaces unchanged · split out of Bodu.Core</text>

    <!-- Wide card: Bodu.Collections.Generic -->
    <g transform="translate(14 60)">
      <rect class="clm-card" width="792" height="146" rx="7"/>
      <text class="clm-ns" x="12" y="22">Bodu.Collections.Generic</text>
      <text class="clm-role" x="12" y="42">Bounded, ordered, navigable, and range-keyed collections</text>
      <text class="clm-type" x="12" y="64">CircularBuffer&lt;T&gt; · Deque&lt;T&gt; · SegmentedBuffer&lt;T&gt;</text>
      <text class="clm-type" x="12" y="82">EvictingDictionary&lt;K,V&gt; (policies + TTL expiry)</text>
      <text class="clm-type" x="12" y="100">SequencedDictionary&lt;K,V&gt; · BiDictionary&lt;K,V&gt;</text>
      <text class="clm-type" x="12" y="118">LayeredDictionary&lt;K,V&gt; · DefaultingDictionary&lt;K,V&gt;</text>
      <text class="clm-type" x="12" y="136">Table&lt;R,C,V&gt; · BitSet · Multiset&lt;T&gt;</text>
      <text class="clm-type" x="412" y="64">NavigableSet&lt;T&gt; · NavigableDictionary&lt;K,V&gt; (rank/select)</text>
      <text class="clm-type" x="412" y="82">IndexedSet&lt;T&gt; · OrderedSet&lt;T&gt; · IndexedPriorityQueue&lt;T,P&gt;</text>
      <text class="clm-type" x="412" y="100">RangeDictionary&lt;K,V&gt; · RangeSet&lt;T&gt;</text>
      <text class="clm-type" x="412" y="118">IntervalTree&lt;T&gt; · IntervalTree&lt;K,V&gt; (overlap-storing)</text>
      <text class="clm-type" x="412" y="136">MultiValueDictionary&lt;K,V&gt; · RingBackedCollection&lt;T&gt;</text>
    </g>

