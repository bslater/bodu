<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="sp-t sp-d">
  <title id="sp-t">Bodu serialization pipeline</title>
  <desc id="sp-d">The Bodu serializer runs in both directions over a layered stack. Serializing takes a POCO, runs the reflection-based SerializationEngine and its converters, writes format-neutral value tokens to an ISerializationWriter, which a per-format writer adapter turns into a concrete syntax tree, which the format writer renders to TOML text or Bencode bytes. Deserializing reverses the stack: a parser builds the concrete syntax tree from text or bytes, a per-format reader adapter exposes it through ISerializationReader, and the engine and converters bind the value tokens back to a POCO. The common engine is format-agnostic; everything format-specific lives in the adapters, the syntax tree, and the parser/writer.</desc>

  <defs>
    <style>
      .bg   { fill: #0F172A; }
      .pan  { fill: #1E293B; stroke: #334155; stroke-width: 1; }
      .hdr  { fill: #111827; stroke: #334155; stroke-width: 1; }
      .ttl  { fill: #F8FAFC; font: 700 15px/1 "Segoe UI",Arial,sans-serif; }
      .lbl  { fill: #F8FAFC; font: 700 13px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .mut  { fill: #94A3B8; font: 400 10px/1.3 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .poco { fill: #0D3331; stroke: #2DD4BF; stroke-width: 1.5; }
      .eng  { fill: #1E3A5F; stroke: #60A5FA; stroke-width: 1.5; }
      .adp  { fill: #2A1B54; stroke: #A78BFA; stroke-width: 1.5; }
      .cst  { fill: #3A2A0A; stroke: #FBBF24; stroke-width: 1.5; }
      .out  { fill: #3F1D2B; stroke: #FB7185; stroke-width: 1.5; }
      .wdn  { stroke: #2DD4BF; stroke-width: 1.6; fill: none; }
      .wup  { stroke: #A78BFA; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="sp-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2DD4BF"/>
    </marker>
    <marker id="sp-au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect class="bg" width="860" height="300"/>
  <g transform="translate(10 10)">
    <rect class="pan" width="840" height="280" rx="8"/>
    <rect class="hdr" width="840" height="30" rx="8"/>
    <rect class="hdr" y="22" width="840" height="8"/>
    <text class="ttl" x="16" y="20">Serialization pipeline — POCO ⇄ text / bytes</text>

    <text class="mut" x="120" y="52" style="fill:#2DD4BF">Serialize ▸</text>
    <text class="mut" x="730" y="52" style="fill:#A78BFA">◂ Deserialize</text>

    <!-- stages -->
    <g transform="translate(20 64)">
      <rect class="poco" width="150" height="92" rx="8"/>
      <text class="lbl" x="75" y="36">POCO</text>
      <text class="mut" x="75" y="58">your types</text>
      <text class="mut" x="75" y="72">records · classes</text>
    </g>

    <g transform="translate(190 64)">
      <rect class="eng" width="160" height="92" rx="8"/>
      <text class="lbl" x="80" y="32">Engine</text>
      <text class="mut" x="80" y="52">SerializationEngine</text>
      <text class="mut" x="80" y="66">FormatConverter&lt;T&gt;</text>
      <text class="mut" x="80" y="80">FormatSerializerOptions</text>
    </g>

    <g transform="translate(370 64)">
      <rect class="adp" width="150" height="92" rx="8"/>
      <text class="lbl" x="75" y="32">Adapter</text>
      <text class="mut" x="75" y="52">ISerialization</text>
      <text class="mut" x="75" y="66">Reader / Writer</text>
      <text class="mut" x="75" y="80">value tokens</text>
    </g>

    <g transform="translate(540 64)">
      <rect class="cst" width="150" height="92" rx="8"/>
      <text class="lbl" x="75" y="32">Syntax tree</text>
      <text class="mut" x="75" y="52">SyntaxNode · RawKind</text>
      <text class="mut" x="75" y="66">parser / writer</text>
      <text class="mut" x="75" y="80">lossless</text>
    </g>

    <g transform="translate(710 64)">
      <rect class="out" width="110" height="92" rx="8"/>
      <text class="lbl" x="55" y="36">Wire</text>
      <text class="mut" x="55" y="58">TOML text</text>
      <text class="mut" x="55" y="72">Bencode bytes</text>
    </g>

    <!-- serialize arrows (teal, top) -->
    <path class="wdn" marker-end="url(#sp-ad)" d="M170,98 L188,98"/>
    <path class="wdn" marker-end="url(#sp-ad)" d="M350,98 L368,98"/>
    <path class="wdn" marker-end="url(#sp-ad)" d="M520,98 L538,98"/>
    <path class="wdn" marker-end="url(#sp-ad)" d="M690,98 L708,98"/>

    <!-- deserialize arrows (purple, bottom) -->
    <path class="wup" marker-end="url(#sp-au)" d="M708,128 L690,128"/>
    <path class="wup" marker-end="url(#sp-au)" d="M538,128 L520,128"/>
    <path class="wup" marker-end="url(#sp-au)" d="M368,128 L350,128"/>
    <path class="wup" marker-end="url(#sp-au)" d="M188,128 L170,128"/>

    <text class="mut" x="420" y="190" style="font-size:11px">The engine, converters, and options are format-agnostic; the adapter, syntax tree, and parser/writer are per format.</text>
    <text class="mut" x="420" y="208" style="font-size:11px">Bodu.Text.Serialization  ·  Bodu.Text.Serialization.Toml  ·  Bodu.Text.Serialization.Bencode</text>
  </g>
</svg>
