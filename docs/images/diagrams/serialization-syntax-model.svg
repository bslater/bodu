<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-labelledby="sm-t sm-d">
  <title id="sm-t">The concrete syntax tree model</title>
  <desc id="sm-d">Every node in a Bodu concrete syntax tree derives from the common SyntaxNode, which carries an integer RawKind "type code", a SourceSpan, and a parent link. Each format maps the RawKind onto its own strongly typed Kind enumeration — TomlSyntaxKind for TOML and BencodeSyntaxKind for Bencode — exactly as System.Text.Json exposes a JsonValueKind. Tokens are the leaves of the tree; a text format such as TOML attaches leading and trailing trivia (whitespace, comments, newlines) to each token so the source reproduces exactly, while a binary format such as Bencode attaches no trivia and reproduces its bytes by re-encoding its canonical values.</desc>

  <defs>
    <style>
      .bg   { fill: #0F172A; }
      .pan  { fill: #1E293B; stroke: #334155; stroke-width: 1; }
      .hdr  { fill: #111827; stroke: #334155; stroke-width: 1; }
      .ttl  { fill: #F8FAFC; font: 700 15px/1 "Segoe UI",Arial,sans-serif; }
      .lbl  { fill: #F8FAFC; font: 700 13px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .cod  { fill: #F8FAFC; font: 700 12px/1 "Consolas",monospace; text-anchor: middle; }
      .mut  { fill: #94A3B8; font: 400 10px/1.3 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .base { fill: #1E3A5F; stroke: #60A5FA; stroke-width: 1.5; }
      .toml { fill: #0D3331; stroke: #2DD4BF; stroke-width: 1.5; }
      .benc { fill: #2A1B54; stroke: #A78BFA; stroke-width: 1.5; }
      .triv { fill: #3A2A0A; stroke: #FBBF24; stroke-width: 1.5; }
      .ln   { stroke: #475569; stroke-width: 1.4; fill: none; }
    </style>
    <marker id="sm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" width="860" height="320"/>
  <g transform="translate(10 10)">
    <rect class="pan" width="840" height="300" rx="8"/>
    <rect class="hdr" width="840" height="30" rx="8"/>
    <rect class="hdr" y="22" width="840" height="8"/>
    <text class="ttl" x="16" y="20">Syntax model — one base, a per-format type code</text>

    <!-- base node -->
    <g transform="translate(330 48)">
      <rect class="base" width="180" height="86" rx="8"/>
      <text class="lbl" x="90" y="28">SyntaxNode</text>
      <text class="cod" x="90" y="50">int RawKind</text>
      <text class="mut" x="90" y="66">SourceSpan · Parent</text>
      <text class="mut" x="90" y="78">tokens · trivia · lists</text>
    </g>

    <!-- toml kind -->
    <g transform="translate(70 176)">
      <rect class="toml" width="220" height="92" rx="8"/>
      <text class="lbl" x="110" y="26">TOML</text>
      <text class="cod" x="110" y="46">TomlSyntaxKind</text>
      <text class="mut" x="110" y="64">Table · Array · String</text>
      <text class="mut" x="110" y="78">Integer · …DateTime · trivia</text>
    </g>

    <!-- json analogue -->
    <g transform="translate(310 176)">
      <rect class="triv" width="220" height="92" rx="8"/>
      <text class="lbl" x="110" y="26">analogue</text>
      <text class="cod" x="110" y="46">JsonValueKind</text>
      <text class="mut" x="110" y="64">System.Text.Json exposes</text>
      <text class="mut" x="110" y="78">the same type-code idea</text>
    </g>

    <!-- bencode kind -->
    <g transform="translate(550 176)">
      <rect class="benc" width="220" height="92" rx="8"/>
      <text class="lbl" x="110" y="26">Bencode</text>
      <text class="cod" x="110" y="46">BencodeSyntaxKind</text>
      <text class="mut" x="110" y="64">Integer · ByteString</text>
      <text class="mut" x="110" y="78">List · Dictionary · no trivia</text>
    </g>

    <!-- connectors -->
    <path class="ln" marker-end="url(#sm-a)" d="M390,134 C300,156 240,158 180,174"/>
    <path class="ln" marker-end="url(#sm-a)" d="M420,134 L420,174"/>
    <path class="ln" marker-end="url(#sm-a)" d="M450,134 C540,156 600,158 660,174"/>

    <text class="mut" x="420" y="292" style="font-size:11px">Each format casts RawKind to its own Kind enum — the literal "generic object with a type code".</text>
  </g>
</svg>
