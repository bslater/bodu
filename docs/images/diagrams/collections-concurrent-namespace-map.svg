      <text class="ccm-type" x="14" y="76">lock-free Contains · ISet&lt;T&gt; surface</text>
      <text class="ccm-type" x="14" y="94">snapshot enumeration and ToArray</text>
      <text class="ccm-type" x="14" y="112">ApproximateCount (hot path) · coherent Count</text>
      <text class="ccm-use" x="14" y="132">dedup of concurrent streams · active-id tracking</text>
    </g>

    <!-- aux bar: peers -->
    <rect class="ccm-aux" x="20" y="282" width="378" height="32" rx="6"/>
    <text class="ccm-auxt" x="34" y="302">Non-concurrent peer</text>
    <text class="ccm-auxs" x="176" y="302">CircularBuffer&lt;T&gt; — fail-fast, single-threaded</text>

    <rect class="ccm-aux" x="408" y="282" width="378" height="32" rx="6"/>
    <text class="ccm-auxt" x="422" y="302">Non-concurrent peer</text>
    <text class="ccm-auxs" x="564" y="302">HashSet&lt;T&gt; (BCL) · OrderedSet&lt;T&gt;</text>
  </g>
</svg>
