<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" role="img" aria-labelledby="rfc6962-title rfc6962-desc">
  <title id="rfc6962-title">RFC 6962 Merkle Tree Hash over seven leaves</title>
  <desc id="rfc6962-desc">A tree of seven entries splits at k = 4, the largest power of two strictly below n. The left subtree of four leaves reduces to a balanced pair of nodes; the right subtree of three leaves splits 2 + 1, and its lone third leaf hash is promoted to the next level unchanged rather than re-hashed as a one-child node. Leaves are hashed with the 0x00 prefix and internal nodes with the 0x01 prefix, so no leaf preimage can collide with a node preimage. The authentication path for leaf 6 carries two steps where every other leaf carries three.</desc>

  <defs>
    <style>
      .bg { fill: #0F172A; }
      .panel { fill: #1E293B; stroke: #334155; stroke-width: 1; }
      .title { fill: #F8FAFC; font: 700 15px/1 "Segoe UI",Arial,sans-serif; }
      .formula { fill: #CBD5E1; font: 400 12px/1 "Consolas",Menlo,monospace; }
      .level { fill: #94A3B8; font: 600 11px/1 "Segoe UI",Arial,sans-serif; }
      .label { fill: #041F1C; font: 700 12px/1 "Consolas",Menlo,monospace; text-anchor: middle; }
      .nlabel { fill: #F8FAFC; font: 700 11.5px/1 "Consolas",Menlo,monospace; text-anchor: middle; }
      .sub { fill: #CBD5E1; font: 400 10.5px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .muted { fill: #94A3B8; font: 400 10.5px/1 "Segoe UI",Arial,sans-serif; }
      .callout { fill: #2DD4BF; font: 600 11px/1 "Segoe UI",Arial,sans-serif; }
      .warn { fill: #FBBF24; font: 600 11px/1 "Segoe UI",Arial,sans-serif; }

      .entry { fill: #0F172A; stroke: #475569; stroke-width: 1; }
      .leaf  { fill: #2DD4BF; stroke: #5EEAD4; stroke-width: 1; }
      .node  { fill: #1E3A5F; stroke: #60A5FA; stroke-width: 1.4; }
      .root  { fill: #1D4ED8; stroke: #93C5FD; stroke-width: 1.8; }
      .edge  { fill: none; stroke: #64748B; stroke-width: 1.6; }
      .promote { fill: none; stroke: #2DD4BF; stroke-width: 2; stroke-dasharray: 6 4; }
      .path  { fill: none; stroke: #FBBF24; stroke-width: 2.4; }
      .split { stroke: #FBBF24; stroke-width: 1.4; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect class="bg" width="820" height="510" rx="10"/>

  <!-- Header: the recurrence -->
  <rect class="panel" x="20" y="18" width="780" height="72" rx="8"/>
  <text class="title" x="36" y="40">RFC 6962 §2.1 — Merkle Tree Hash, n = 7</text>
  <text class="formula" x="36" y="60">MTH({}) = H() · MTH({d}) = H(0x00 ‖ d) · MTH(D[n]) = H(0x01 ‖ MTH(D[0:k]) ‖ MTH(D[k:n]))</text>
  <text class="muted" x="36" y="79">k is the largest power of two <tspan class="warn">strictly below</tspan> n — so 7 splits 4 + 3, and 8 splits 4 + 4, never 8 + 0.</text>

  <!-- Level labels -->
  <text class="level" x="30" y="136">root</text>
  <text class="level" x="30" y="226">level 2</text>
  <text class="level" x="30" y="316">level 1</text>
  <text class="level" x="30" y="368">leaves</text>
  <text class="level" x="30" y="443">entries</text>

  <!-- Edges: drawn before the nodes so the boxes sit on top -->
  <g class="edge">
    <!-- root -> level 2 -->
    <path d="M 418 152 L 230 196"/>
    <path d="M 418 152 L 605 196"/>
    <!-- level 2 -> level 1 -->
    <path d="M 230 242 L 130 286"/>
    <path d="M 230 242 L 330 286"/>
    <path d="M 605 242 L 530 286"/>
    <!-- level 1 -> leaves -->
    <path d="M 130 332 L 80 376"/>
    <path d="M 130 332 L 180 376"/>
    <path d="M 330 332 L 280 376"/>
    <path d="M 330 332 L 380 376"/>
    <path d="M 530 332 L 480 376"/>
    <path d="M 530 332 L 580 376"/>
  </g>

  <!-- The promotion: leaf 6's hash rises two levels unchanged -->
  <path class="promote" d="M 680 376 L 680 264 L 621 242"/>

  <!-- The split at k = 4 -->
  <line class="split" x1="430" y1="262" x2="430" y2="440"/>
  <text class="warn" x="436" y="258">k = 4</text>
  <text class="muted" x="430" y="432" style="text-anchor:middle">D[0:4]  │  D[4:7]</text>

  <!-- Root -->
  <rect class="root" x="358" y="106" width="120" height="46" rx="6"/>
  <text class="nlabel" x="418" y="126">MTH(D[0:7])</text>
  <text class="nlabel" x="418" y="142" style="fill:#BFDBFE">H(0x01 ‖ · ‖ ·)</text>

  <!-- Level 2 -->
  <rect class="node" x="176" y="196" width="108" height="46" rx="6"/>
  <text class="nlabel" x="230" y="216">MTH(D[0:4])</text>
  <text class="sub" x="230" y="232">balanced</text>

  <rect class="node" x="551" y="196" width="108" height="46" rx="6"/>
  <text class="nlabel" x="605" y="216">MTH(D[4:7])</text>
  <text class="sub" x="605" y="232">splits 2 + 1</text>

  <!-- Level 1 -->
  <g>
    <rect class="node" x="86" y="286" width="88" height="46" rx="6"/>
    <text class="nlabel" x="130" y="306">n(0,1)</text>
    <text class="sub" x="130" y="322">0x01</text>

    <rect class="node" x="286" y="286" width="88" height="46" rx="6"/>
    <text class="nlabel" x="330" y="306">n(2,3)</text>
    <text class="sub" x="330" y="322">0x01</text>

    <rect class="node" x="486" y="286" width="88" height="46" rx="6"/>
    <text class="nlabel" x="530" y="306">n(4,5)</text>
    <text class="sub" x="530" y="322">0x01</text>
  </g>

  <!-- Leaves -->
  <g>
    <rect class="leaf" x="48" y="376" width="64" height="34" rx="5"/>
    <text class="label" x="80" y="398">l(d0)</text>
    <rect class="leaf" x="148" y="376" width="64" height="34" rx="5"/>
    <text class="label" x="180" y="398">l(d1)</text>
    <rect class="leaf" x="248" y="376" width="64" height="34" rx="5"/>
    <text class="label" x="280" y="398">l(d2)</text>
    <rect class="leaf" x="348" y="376" width="64" height="34" rx="5"/>
    <text class="label" x="380" y="398">l(d3)</text>
    <rect class="leaf" x="448" y="376" width="64" height="34" rx="5"/>
    <text class="label" x="480" y="398">l(d4)</text>
    <rect class="leaf" x="548" y="376" width="64" height="34" rx="5"/>
    <text class="label" x="580" y="398">l(d5)</text>
    <rect class="leaf" x="648" y="376" width="64" height="34" rx="5"/>
    <text class="label" x="680" y="398">l(d6)</text>
  </g>

  <!-- Entries -->
  <g>
    <rect class="entry" x="48" y="448" width="64" height="26" rx="4"/>
    <text class="sub" x="80" y="465">d0</text>
    <rect class="entry" x="148" y="448" width="64" height="26" rx="4"/>
    <text class="sub" x="180" y="465">d1</text>
    <rect class="entry" x="248" y="448" width="64" height="26" rx="4"/>
    <text class="sub" x="280" y="465">d2</text>
    <rect class="entry" x="348" y="448" width="64" height="26" rx="4"/>
    <text class="sub" x="380" y="465">d3</text>
    <rect class="entry" x="448" y="448" width="64" height="26" rx="4"/>
    <text class="sub" x="480" y="465">d4</text>
    <rect class="entry" x="548" y="448" width="64" height="26" rx="4"/>
    <text class="sub" x="580" y="465">d5</text>
    <rect class="entry" x="648" y="448" width="64" height="26" rx="4"/>
    <text class="sub" x="680" y="465">d6</text>
  </g>

  <!-- Promotion callout -->
  <g style="text-anchor:end">
    <text class="callout" x="806" y="150">l(d6) is promoted unchanged</text>
    <text class="muted" x="806" y="166">never re-hashed as H(0x01 ‖ l(d6))</text>
    <text class="muted" x="806" y="182">so leaf 6's path has 2 steps, not 3</text>
  </g>

  <!-- Footer legend -->
  <text class="muted" x="36" y="496">l(d) = H(0x00 ‖ d) · n(a,b) = H(0x01 ‖ a ‖ b) · the prefixes keep leaf and node preimages in disjoint domains — the second-preimage defence.</text>
</svg>
