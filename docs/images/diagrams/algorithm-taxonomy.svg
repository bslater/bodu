<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="375" viewBox="0 0 900 375" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- ═══ Title bar ═══ -->
  <rect x="0" y="0" width="900" height="42" fill="#1e3a5f"/>
  <text x="450" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Bodu Algorithm Families</text>

  <!-- ═══ Level 1 — Non-Cryptographic ═══ -->
  <rect x="12" y="56" width="418" height="50" rx="4" fill="#ddeeff" stroke="#2a5a8f" stroke-width="1.5"/>
  <text x="221" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a6f">Non-Cryptographic</text>
  <text x="221" y="94" text-anchor="middle" font-size="9.5" fill="#3a6a9f">Bodu.IO.Hashing — error detection · distribution · identity validation</text>

  <!-- ═══ Level 1 — Cryptographic ═══ -->
  <rect x="470" y="56" width="418" height="50" rx="4" fill="#ede8f8" stroke="#5030a0" stroke-width="1.5"/>
  <text x="679" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#30106a">Cryptographic</text>
  <text x="679" y="94" text-anchor="middle" font-size="9.5" fill="#5030a0">Bodu.Security.Cryptography — adversary-resistant primitives</text>

  <!-- title to L1 connectors -->
  <line x1="221" y1="42" x2="221" y2="56" stroke="#666" stroke-width="1"/>
  <line x1="679" y1="42" x2="679" y2="56" stroke="#666" stroke-width="1"/>

  <!-- ═══ Connector rails — Non-Crypto ═══ -->
  <line x1="221" y1="106" x2="221" y2="124" stroke="#2a5a8f" stroke-width="1.2"/>
  <line x1="79"  y1="124" x2="363" y2="124" stroke="#2a5a8f" stroke-width="1.2"/>
  <line x1="79"  y1="124" x2="79"  y2="138" stroke="#2a5a8f" stroke-width="1.2"/>
  <line x1="221" y1="124" x2="221" y2="138" stroke="#2a5a8f" stroke-width="1.2"/>
  <line x1="363" y1="124" x2="363" y2="138" stroke="#2a5a8f" stroke-width="1.2"/>

  <!-- ═══ Connector rails — Crypto ═══ -->
  <line x1="679" y1="106" x2="679" y2="124" stroke="#5030a0" stroke-width="1.2"/>
  <line x1="533" y1="124" x2="820" y2="124" stroke="#5030a0" stroke-width="1.2"/>
  <line x1="533" y1="124" x2="533" y2="138" stroke="#5030a0" stroke-width="1.2"/>
  <line x1="676" y1="124" x2="676" y2="138" stroke="#5030a0" stroke-width="1.2"/>
  <line x1="820" y1="124" x2="820" y2="138" stroke="#5030a0" stroke-width="1.2"/>

  <!-- ═══ Level 2 — Fingerprint ═══ -->
  <rect x="12"  y="138" width="134" height="48" rx="3" fill="#f4faff" stroke="#2a5a8f" stroke-width="1"/>
  <text x="79"  y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a6f">Fingerprint</text>
  <text x="79"  y="175" text-anchor="middle" font-size="9"    fill="#3a6a9f">non-cryptographic hash</text>

  <!-- ═══ Level 2 — Checksum ═══ -->
  <rect x="155" y="138" width="132" height="48" rx="3" fill="#f4faff" stroke="#2a5a8f" stroke-width="1"/>
  <text x="221" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a6f">Checksum</text>
  <text x="221" y="175" text-anchor="middle" font-size="9"    fill="#3a6a9f">stream checksums</text>

  <!-- ═══ Level 2 — Check Digit ═══ -->
  <rect x="297" y="138" width="133" height="48" rx="3" fill="#f4faff" stroke="#2a5a8f" stroke-width="1"/>
  <text x="363" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a6f">Check Digit</text>
  <text x="363" y="175" text-anchor="middle" font-size="9"    fill="#3a6a9f">identity validation</text>

  <!-- ═══ Level 2 — Crypto Hash ═══ -->
  <rect x="470" y="138" width="126" height="48" rx="3" fill="#f8f4ff" stroke="#5030a0" stroke-width="1"/>
  <text x="533" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#30106a">Crypto Hash</text>
  <text x="533" y="175" text-anchor="middle" font-size="9"    fill="#5030a0">one-way digest / XOF</text>

  <!-- ═══ Level 2 — Keyed Hash / MAC ═══ -->
  <rect x="606" y="138" width="140" height="48" rx="3" fill="#f8f4ff" stroke="#5030a0" stroke-width="1"/>
  <text x="676" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#30106a">Keyed Hash / MAC</text>
  <text x="676" y="175" text-anchor="middle" font-size="9"    fill="#5030a0">authentication tag</text>

  <!-- ═══ Level 2 — Cipher ═══ -->
  <rect x="756" y="138" width="132" height="48" rx="3" fill="#f8f4ff" stroke="#5030a0" stroke-width="1"/>
  <text x="822" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#30106a">Cipher</text>
  <text x="822" y="175" text-anchor="middle" font-size="9"    fill="#5030a0">encrypt / decrypt</text>

  <!-- ═══ Type lists ═══ -->

  <!-- Fingerprint -->
  <text x="15"  y="202" font-size="9" fill="#333">FNV-1a / FNV-1 (32 / 64-bit)</text>
  <text x="15"  y="216" font-size="9" fill="#333">CityHash-32 / 64 / 128</text>
  <text x="15"  y="230" font-size="9" fill="#333">MurmurHash3-32 / x64-128</text>
  <text x="15"  y="244" font-size="9" fill="#333">XxHash-32 / 64</text>
  <text x="15"  y="258" font-size="9" fill="#333">Pearson (8 – 2048-bit)</text>
  <text x="15"  y="272" font-size="9" fill="#333">Bernstein · BKDR · SDBM</text>
  <text x="15"  y="286" font-size="9" fill="#333">JSHash · Elf64 · ApHash · Pjw32</text>

  <!-- Checksum -->
  <text x="158" y="202" font-size="9" fill="#333">CRC  (113 named standards,</text>
  <text x="158" y="216" font-size="9" fill="#333">  widths 1 – 64-bit)</text>
  <text x="158" y="232" font-size="9" fill="#333">Fletcher-16 / 32 / 64</text>
  <text x="158" y="246" font-size="9" fill="#333">Adler-32 / 32C / 64</text>

  <!-- Check Digit -->
  <text x="300" y="202" font-size="9" fill="#333">Luhn · Damm · Verhoeff</text>
  <text x="300" y="216" font-size="9" fill="#333">EAN-8 / EAN-13 · GTIN-14</text>
  <text x="300" y="230" font-size="9" fill="#333">UPC-A · ISIN · SEDOL</text>
  <text x="300" y="244" font-size="9" fill="#333">CUSIP · IBAN · ISBN-10/13</text>
  <text x="300" y="258" font-size="9" fill="#333">ABA routing · LEI</text>

  <!-- Crypto Hash -->
  <text x="473" y="202" font-size="9" fill="#333">Tiger-128 / 160 / 192</text>
  <text x="473" y="216" font-size="9" fill="#333">CubeHash · Snefru-128/256</text>
  <text x="473" y="230" font-size="9" fill="#333">ASCON-Hash256 / HashA256</text>
  <text x="473" y="244" font-size="9" fill="#333">ASCON-XOF128 / CXOF128</text>

  <!-- Keyed Hash / MAC -->
  <text x="609" y="202" font-size="9" fill="#333">SipHash-64 / SipHash-128</text>
  <text x="609" y="216" font-size="9" fill="#333">Poly1305  (one-time)</text>

  <!-- Cipher -->
  <text x="759" y="202" font-size="9" fill="#333">Threefish-256 ◆</text>
  <text x="759" y="216" font-size="9" fill="#333">Threefish-512 ◆</text>
  <text x="759" y="230" font-size="9" fill="#333">Threefish-1024 ◆</text>
  <text x="759" y="246" font-size="9" fill="#999" font-style="italic">  ◆ tweakable (+ 128-bit tweak)</text>
  <text x="759" y="262" font-size="9" fill="#333">Skipjack · Blowfish</text>
  <text x="759" y="276" font-size="9" fill="#333">ASCON-AEAD128</text>

  <!-- ═══ Vertical separator ═══ -->
  <line x1="445" y1="56" x2="445" y2="305" stroke="#ccc" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- ═══ Footnotes ═══ -->
  <line x1="10" y1="310" x2="890" y2="310" stroke="#ddd" stroke-width="0.8"/>
  <text x="10" y="326" font-size="8.5" fill="#666" font-style="italic">◆  Tweakable block cipher — Threefish accepts a public 128-bit tweak that domain-separates encryption contexts without changing the key.</text>
  <text x="10" y="342" font-size="8.5" fill="#666" font-style="italic">ASCON is a multi-role family: Hash256/HashA256 are one-way digests; XOF128/CXOF128 are extendable-output functions; AEAD128 is an authenticated cipher.</text>
  <text x="10" y="358" font-size="8.5" fill="#666" font-style="italic">Snefru-128 and Snefru-256 are cryptanalytically broken; listed for interoperability only.</text>
</svg>
