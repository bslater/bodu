<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-labelledby="pl-title pl-desc">
  <title id="pl-title">Poly1305 polynomial accumulation</title>
  <desc id="pl-desc">Poly1305 evaluates a polynomial in the clamped key word r over the prime field 2^130 minus 5. Each 16-byte message block is read as a little-endian integer with a high bit appended, added into a running accumulator, and the sum is multiplied by r and reduced modulo 2^130 minus 5. After the last block the secret 16-byte word s is added once, and the low 128 bits form the authentication tag. The key (r, s) must be fresh for every message.</desc>

  <defs>
    <style>
      .bg { fill: #0F172A; }
      .panel { fill: #1E293B; stroke: #334155; stroke-width: 1; }
      .header { fill: #111827; stroke: #334155; stroke-width: 1; }
      .title { fill: #F8FAFC; font: 700 15px/1 "Segoe UI",Arial,sans-serif; }
      .formula { fill: #94A3B8; font: italic 12px/1 "Cambria",Georgia,serif; }
      .label { fill: #F8FAFC; font: 700 13px/1 "Segoe UI",Arial,sans-serif; }
      .sub { fill: #CBD5E1; font: 400 11px/1 "Segoe UI",Arial,sans-serif; }
      .sub-muted { fill: #94A3B8; font: 400 10.5px/1 "Segoe UI",Arial,sans-serif; }
      .block { fill: #F59E0B; }
      .block-text { fill: #0F172A; font: 700 12px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .accum { fill: #14B8A6; stroke: #2DD4BF; stroke-width: 1; }
      .accum-text { fill: #0F172A; font: 700 13px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .keyword { fill: #A78BFA; stroke: #C4B5FD; stroke-width: 1; }
      .keyword-text { fill: #0F172A; font: 700 13px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .tag { fill: #FBBF24; stroke: #F59E0B; stroke-width: 1; }
      .reduce { fill: #3B82F6; stroke: #60A5FA; stroke-width: 1; }
      .reduce-text { fill: #F8FAFC; font: 700 11px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .op { fill: #0F172A; stroke: #F8FAFC; stroke-width: 1.6; }
      .op-sym { fill: #F8FAFC; font: 700 14px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .wire { stroke: #CBD5E1; stroke-width: 1.6; fill: none; }
      .wire-acc { stroke: #2DD4BF; stroke-width: 1.8; fill: none; }
      .wire-key { stroke: #C4B5FD; stroke-width: 1.8; fill: none; }
      .wire-block { stroke: #FBBF24; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="pl-arr-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#CBD5E1"/>
    </marker>
    <marker id="pl-arr-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2DD4BF"/>
    </marker>
    <marker id="pl-arr-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C4B5FD"/>
    </marker>
    <marker id="pl-arr-block" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FBBF24"/>
    </marker>
  </defs>

  <rect class="bg" width="820" height="320"/>

  <g transform="translate(10 10)">
    <rect class="panel" width="800" height="300" rx="8"/>
    <rect class="header" width="800" height="46" rx="8"/>
    <rect class="header" y="38" width="800" height="8"/>
    <text class="title" x="16" y="20">Poly1305 — polynomial evaluation in r over 2¹³⁰ − 5</text>
    <text class="formula" x="784" y="38" text-anchor="end">acc ← (acc + blockᵢ) · r  mod (2¹³⁰ − 5)</text>

    <!-- incoming 16-byte block -->
    <g transform="translate(70 110)">
      <rect class="block" x="-44" y="-15" width="88" height="30" rx="5"/>
      <text class="block-text" x="0" y="-1">blockᵢ (16 B)</text>
      <text class="block-text" x="0" y="12" font-size="9">+ high bit</text>
    </g>
    <text class="sub-muted" x="26" y="148">little-endian, one block per step</text>

    <!-- ADD: acc + block -->
    <g transform="translate(220 110)">
      <circle class="op" cx="0" cy="0" r="15"/>
      <text class="op-sym" x="0" y="5">+</text>
    </g>
    <line class="wire-block" x1="114" y1="110" x2="203" y2="110" marker-end="url(#pl-arr-block)"/>

    <!-- accumulator -->
    <g transform="translate(220 200)">
      <rect class="accum" x="-58" y="-20" width="116" height="40" rx="6"/>
      <text class="accum-text" x="0" y="-1">acc</text>
      <text class="accum-text" x="0" y="13" font-size="9">130-bit running sum</text>
    </g>
    <!-- acc feeds the adder -->
    <path class="wire-acc" d="M 220 180 L 220 127" marker-end="url(#pl-arr-acc)"/>
    <text class="sub" x="228" y="160">accₚᵣₑᵥ</text>

    <!-- MULTIPLY by r -->
    <g transform="translate(360 110)">
      <circle class="op" cx="0" cy="0" r="15"/>
      <text class="op-sym" x="0" y="6">×</text>
    </g>
    <line class="wire-acc" x1="235" y1="110" x2="343" y2="110" marker-end="url(#pl-arr-acc)"/>

    <!-- key word r -->
    <g transform="translate(360 56)">
      <rect class="keyword" x="-46" y="-14" width="92" height="28" rx="5"/>
      <text class="keyword-text" x="0" y="5">r (clamped)</text>
    </g>
    <path class="wire-key" d="M 360 70 L 360 93" marker-end="url(#pl-arr-key)"/>

    <!-- REDUCE mod p -->
    <g transform="translate(490 110)">
      <rect class="reduce" x="-58" y="-19" width="116" height="38" rx="6"/>
      <text class="reduce-text" x="0" y="-2">reduce</text>
      <text class="reduce-text" x="0" y="11" font-size="9">mod 2¹³⁰ − 5</text>
    </g>
    <line class="wire-acc" x1="375" y1="110" x2="429" y2="110" marker-end="url(#pl-arr-acc)"/>

    <!-- reduced value loops back into accumulator -->
    <path class="wire-acc" d="M 490 129 L 490 200 L 281 200" stroke-dasharray="4 3" marker-end="url(#pl-arr-acc)"/>
    <text class="sub-muted" x="486" y="172" text-anchor="end">updated acc — loop for next block</text>

    <!-- finalisation: + s -->
    <g transform="translate(635 110)">
      <circle class="op" cx="0" cy="0" r="15"/>
      <text class="op-sym" x="0" y="5">+</text>
    </g>
    <path class="wire-acc" d="M 548 110 L 618 110" marker-end="url(#pl-arr-acc)"/>
    <text class="sub-muted" x="583" y="100" text-anchor="middle">after last block</text>

    <!-- key word s -->
    <g transform="translate(635 56)">
      <rect class="keyword" x="-44" y="-14" width="88" height="28" rx="5"/>
      <text class="keyword-text" x="0" y="5">s (16 B)</text>
    </g>
    <path class="wire-key" d="M 635 70 L 635 93" marker-end="url(#pl-arr-key)"/>

    <!-- final tag -->
    <g transform="translate(720 200)">
      <rect class="tag" x="-58" y="-20" width="116" height="40" rx="6"/>
      <text class="label" x="0" y="-1" text-anchor="middle" fill="#0F172A">tag</text>
      <text class="block-text" x="0" y="13" font-size="9">low 128 bits</text>
    </g>
    <path class="wire" d="M 635 125 L 635 200 L 658 200" marker-end="url(#pl-arr-d)"/>

    <!-- legend / key note -->
    <g transform="translate(40 254)">
      <rect class="panel" x="0" y="-16" width="720" height="30" rx="6" stroke-dasharray="5 3"/>
      <text class="sub" x="14" y="3">Key = (r ‖ s), 32 bytes — one-time use. Reusing (r, s) across two messages reveals r and breaks forgery resistance.</text>
    </g>

    <!-- footer note -->
    <text class="sub" x="20" y="290">Each block contributes a term rⁿ; the tag is the polynomial evaluated at r, then masked into the visible 16-byte authenticator.</text>
  </g>
</svg>
