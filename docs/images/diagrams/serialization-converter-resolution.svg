<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" role="img" aria-labelledby="cr-t cr-d">
  <title id="cr-t">Converter resolution order</title>
  <desc id="cr-d">For a given type the serializer selects a converter by checking four sources in order. First, a member-level converter attribute on the property or field. Second, a type-level converter attribute on the type. Third, the first matching converter registered on the serializer options. Fourth, the built-in converters for scalars, enums, nullable values, collections, dictionaries, and plain objects. A converter factory found in any of these positions is asked to create the concrete converter for the requested type, and the result is cached on the options. The order mirrors System.Text.Json.</desc>

  <defs>
    <style>
      .bg   { fill: #0F172A; }
      .pan  { fill: #1E293B; stroke: #334155; stroke-width: 1; }
      .hdr  { fill: #111827; stroke: #334155; stroke-width: 1; }
      .ttl  { fill: #F8FAFC; font: 700 15px/1 "Segoe UI",Arial,sans-serif; }
      .lbl  { fill: #F8FAFC; font: 700 13px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .num  { fill: #0F172A; font: 800 13px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .mut  { fill: #94A3B8; font: 400 10px/1.3 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .s1   { fill: #0D3331; stroke: #2DD4BF; stroke-width: 1.5; }
      .s2   { fill: #1E3A5F; stroke: #60A5FA; stroke-width: 1.5; }
      .s3   { fill: #2A1B54; stroke: #A78BFA; stroke-width: 1.5; }
      .s4   { fill: #3A2A0A; stroke: #FBBF24; stroke-width: 1.5; }
      .badge{ fill: #F8FAFC; }
      .ar   { stroke: #475569; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="cr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" width="860" height="250"/>
  <g transform="translate(10 10)">
    <rect class="pan" width="840" height="230" rx="8"/>
    <rect class="hdr" width="840" height="30" rx="8"/>
    <rect class="hdr" y="22" width="840" height="8"/>
    <text class="ttl" x="16" y="20">Converter resolution — first match wins</text>

    <g transform="translate(20 70)">
      <rect class="s1" width="190" height="110" rx="8"/>
      <circle class="badge" cx="24" cy="24" r="13"/>
      <text class="num" x="24" y="28">1</text>
      <text class="lbl" x="95" y="54">Member attribute</text>
      <text class="mut" x="95" y="76">[FormatConverter]</text>
      <text class="mut" x="95" y="90">on the property</text>
    </g>

    <g transform="translate(230 70)">
      <rect class="s2" width="190" height="110" rx="8"/>
      <circle class="badge" cx="24" cy="24" r="13"/>
      <text class="num" x="24" y="28">2</text>
      <text class="lbl" x="95" y="54">Type attribute</text>
      <text class="mut" x="95" y="76">[FormatConverter]</text>
      <text class="mut" x="95" y="90">on the type</text>
    </g>

    <g transform="translate(440 70)">
      <rect class="s3" width="190" height="110" rx="8"/>
      <circle class="badge" cx="24" cy="24" r="13"/>
      <text class="num" x="24" y="28">3</text>
      <text class="lbl" x="95" y="54">options.Converters</text>
      <text class="mut" x="95" y="76">first registered</text>
      <text class="mut" x="95" y="90">converter that matches</text>
    </g>

    <g transform="translate(650 70)">
      <rect class="s4" width="170" height="110" rx="8"/>
      <circle class="badge" cx="24" cy="24" r="13"/>
      <text class="num" x="24" y="28">4</text>
      <text class="lbl" x="85" y="54">Built-ins</text>
      <text class="mut" x="85" y="76">scalars · enums · nullable</text>
      <text class="mut" x="85" y="90">collections · objects</text>
    </g>

    <path class="ar" marker-end="url(#cr-a)" d="M210,125 L228,125"/>
    <path class="ar" marker-end="url(#cr-a)" d="M420,125 L438,125"/>
    <path class="ar" marker-end="url(#cr-a)" d="M630,125 L648,125"/>

    <text class="mut" x="420" y="208" style="font-size:11px">A factory in any position creates the concrete converter for the requested type; the result is cached. Mirrors System.Text.Json.</text>
  </g>
</svg>
