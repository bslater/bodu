<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Formats.Excel.Binary — BIFF8 records decoded into worksheet cells">
  <title>Bodu.Formats.Excel.Binary</title>
  <defs>
    <linearGradient id="xl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="xl-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#xl-bg)"/>

  <!-- incoming BIFF8 record stream on the left -->
  <g font-family="'Consolas','Menlo',monospace" font-size="11">
    <text x="22" y="36" fill="#94A3B8" opacity="0.8">BIFF8 records »</text>
  </g>
  <g transform="translate(22 46)" font-family="'Consolas','Menlo',monospace" font-size="10">
    <g fill="#0B1220" stroke="#475569" stroke-width="1">
      <rect x="0"  y="0" width="58" height="20" rx="3"/>
      <rect x="0"  y="26" width="58" height="20" rx="3"/>
      <rect x="0"  y="52" width="58" height="20" rx="3"/>
      <rect x="0"  y="78" width="58" height="20" rx="3"/>
    </g>
    <g fill="#FBBF24">
      <text x="8" y="14">FD 00</text>
      <text x="8" y="40">7E 02</text>
      <text x="8" y="66">BD 00</text>
      <text x="8" y="92">06 00</text>
    </g>
    <g fill="#64748B" font-size="9">
      <text x="64" y="14">LABELSST</text>
      <text x="64" y="40">RK</text>
      <text x="64" y="66">MULRK</text>
      <text x="64" y="92">FORMULA</text>
    </g>
  </g>

  <!-- decode arrow -->
  <g fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round">
    <path d="M 150 110 L 188 110"/>
    <polygon points="188,110 180,106 180,114" fill="#34D399" stroke="none"/>
  </g>
  <text x="169" y="100" fill="#34D399" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">decode</text>

  <!-- worksheet grid on the right -->
  <g transform="translate(200 40)" font-family="'Consolas','Menlo',monospace" font-size="11">
    <!-- column header row -->
    <g fill="url(#xl-head)" stroke="#047857" stroke-width="1">
      <rect x="22" y="0" width="58" height="22" rx="2"/>
      <rect x="82" y="0" width="58" height="22" rx="2"/>
      <rect x="142" y="0" width="58" height="22" rx="2"/>
    </g>
    <g fill="#ECFDF5" text-anchor="middle" font-weight="700">
      <text x="51" y="15">A</text>
      <text x="111" y="15">B</text>
      <text x="171" y="15">C</text>
    </g>
    <!-- row number gutter -->
    <g fill="#0D3331" stroke="#10B981" stroke-width="1">
      <rect x="0" y="24" width="20" height="34" rx="2"/>
      <rect x="0" y="60" width="20" height="34" rx="2"/>
      <rect x="0" y="96" width="20" height="34" rx="2"/>
    </g>
    <g fill="#6EE7B7" text-anchor="middle">
      <text x="10" y="45">1</text>
      <text x="10" y="81">2</text>
      <text x="10" y="117">3</text>
    </g>
    <!-- cell grid -->
    <g fill="#1E293B" stroke="#334155" stroke-width="1">
      <rect x="22" y="24" width="58" height="34" rx="2"/>
      <rect x="82" y="24" width="58" height="34" rx="2"/>
      <rect x="142" y="24" width="58" height="34" rx="2"/>
      <rect x="22" y="60" width="58" height="34" rx="2"/>
      <rect x="82" y="60" width="58" height="34" rx="2"/>
      <rect x="142" y="60" width="58" height="34" rx="2"/>
      <rect x="22" y="96" width="58" height="34" rx="2"/>
      <rect x="82" y="96" width="58" height="34" rx="2"/>
      <rect x="142" y="96" width="58" height="34" rx="2"/>
    </g>
    <!-- cell values -->
    <g text-anchor="middle" font-size="10">
      <text x="51"  y="45" fill="#C4B5FD">"USD"</text>
      <text x="111" y="45" fill="#5EEAD4">0.6828</text>
      <text x="171" y="45" fill="#FBBF24">TRUE</text>
      <text x="51"  y="81" fill="#5EEAD4">44929</text>
      <text x="111" y="81" fill="#5EEAD4">112.71</text>
      <text x="171" y="81" fill="#F87171">#N/A</text>
      <text x="51"  y="117" fill="#C4B5FD">"JPY"</text>
      <text x="111" y="117" fill="#5EEAD4">0.7029</text>
      <text x="171" y="117" fill="#64748B">…</text>
    </g>
  </g>

  <!-- output tag -->
  <g transform="translate(200 182)" fill="#34D399" font-family="'Consolas','Menlo',monospace" font-size="11">
    <text x="0" y="0" opacity="0.9">» ExcelCell { Kind, Value }</text>
  </g>
</svg>
