<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Text.Serialization — shared primitives for the System.Text.Json-shaped serializers">
  <title>Bodu.Text.Serialization</title>
  <defs>
    <linearGradient id="tser-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#tser-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#A78BFA"/>
    <rect y="14" width="150" height="8" fill="#A78BFA"/>
    <text x="75" y="16" fill="#241A47" text-anchor="middle" font-weight="700" font-size="11">shared core</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="42"><tspan fill="#A78BFA">[BoduPropertyName]</tspan></text>
      <text x="10" y="57"><tspan fill="#A78BFA">[BoduIgnore]</tspan></text>
      <text x="10" y="72"><tspan fill="#A78BFA">[BoduRequired]</tspan></text>
      <text x="10" y="94">NamingPolicy</text>
      <text x="10" y="109">UnmappedMemberHandling</text>
      <text x="10" y="131"><tspan fill="#94A3B8" font-size="9">one attribute family,</tspan></text>
      <text x="10" y="146"><tspan fill="#94A3B8" font-size="9">every format</tspan></text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#A78BFA" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#A78BFA" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#A78BFA" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">declare</text>
    <text x="52" y="56">consume</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Serializers</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="44"><tspan fill="#A78BFA">Bencode</tspan>Serializer</text>
      <text x="10" y="61"><tspan fill="#A78BFA">Toml</tspan>Serializer</text>
      <text x="10" y="86"><tspan fill="#94A3B8">callbacks · creation ·</tspan></text>
      <text x="10" y="103"><tspan fill="#94A3B8">ignore · naming enums</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">format-agnostic seams · consumed per format</text>
  </g>
</svg>
