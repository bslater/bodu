<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Financial.ExchangeRates.Caching.Distributed — IDistributedCache backend for exchange-rate caching">
  <title>Bodu.Financial.ExchangeRates.Caching.Distributed</title>
  <defs>
    <linearGradient id="fxdist-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#fxdist-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#F87171"/>
    <rect y="14" width="150" height="8" fill="#F87171"/>
    <text x="75" y="16" fill="#3B0A0A" text-anchor="middle" font-weight="700" font-size="10">IDistributedCache</text>

    <g stroke="#F87171" stroke-width="1.4" fill="#0F172A">
      <g transform="translate(20 44)">
        <ellipse cx="18" cy="5" rx="18" ry="5"/>
        <path d="M 0 5 L 0 27 A 18 5 0 0 0 36 27 L 36 5" fill="#0F172A"/>
      </g>
      <g transform="translate(94 44)">
        <ellipse cx="18" cy="5" rx="18" ry="5"/>
        <path d="M 0 5 L 0 27 A 18 5 0 0 0 36 27 L 36 5" fill="#0F172A"/>
      </g>
      <g transform="translate(57 92)">
        <ellipse cx="18" cy="5" rx="18" ry="5"/>
        <path d="M 0 5 L 0 27 A 18 5 0 0 0 36 27 L 36 5" fill="#0F172A"/>
      </g>
    </g>
    <g stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 3" fill="none">
      <line x1="58" y1="60" x2="92" y2="60"/>
      <line x1="42" y1="74" x2="70" y2="94"/>
      <line x1="108" y1="74" x2="80" y2="94"/>
    </g>
    <text x="12" y="148" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">Redis · SQL Server · any backend</text>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#F87171" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#F87171" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#F87171" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#F87171" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">get</text>
    <text x="52" y="56">set</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Rate cache</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="10" y="44"><tspan fill="#F87171">AddDistributedRateCache</tspan></text>
      <text x="10" y="60"><tspan fill="#F87171">AddRedisRateCache</tspan></text>
      <text x="10" y="84">StoreFetchedRange</text>
      <text x="10" y="100">DateRangeCoverage</text>
      <text x="10" y="124"><tspan fill="#94A3B8" font-size="9">shared across instances</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">one durable rate cache for the whole fleet</text>
  </g>
</svg>
