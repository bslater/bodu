<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Financial.ExchangeRates.Caching.Distributed — IDistributedCache backend for exchange-rate caching">
  <title>Bodu.Financial.ExchangeRates.Caching.Distributed</title>
  <defs>
    <linearGradient id="fxdist-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#fxdist-bg)"/>

  <!-- Left column: networked cache nodes -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="170" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="170" height="22" rx="8" fill="#F87171"/>
    <rect y="14" width="170" height="8" fill="#F87171"/>
    <text x="85" y="16" fill="#3B0A0A" text-anchor="middle" font-weight="700" font-size="10" font-family="'Consolas','Menlo',monospace">IDistributedCache</text>

    <!-- three cylinders joined by a mesh -->
    <g stroke="#F87171" stroke-width="1.4" fill="#0F172A">
      <g transform="translate(28 46)">
        <ellipse cx="20" cy="6" rx="20" ry="6"/>
        <path d="M 0 6 L 0 30 A 20 6 0 0 0 40 30 L 40 6" fill="#0F172A"/>
      </g>
      <g transform="translate(104 46)">
        <ellipse cx="20" cy="6" rx="20" ry="6"/>
        <path d="M 0 6 L 0 30 A 20 6 0 0 0 40 30 L 40 6" fill="#0F172A"/>
      </g>
      <g transform="translate(66 96)">
        <ellipse cx="20" cy="6" rx="20" ry="6"/>
        <path d="M 0 6 L 0 30 A 20 6 0 0 0 40 30 L 40 6" fill="#0F172A"/>
      </g>
    </g>
    <g stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 3" fill="none">
      <line x1="70" y1="64" x2="102" y2="64"/>
      <line x1="52" y1="80" x2="78" y2="98"/>
      <line x1="120" y1="80" x2="94" y2="98"/>
    </g>
    <text x="85" y="148" fill="#94A3B8" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-size="9">Redis · SQL Server · any backend</text>
  </g>

  <!-- middle: shared cache arrows -->
  <g transform="translate(206 84)" fill="none" stroke="#F87171" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="84" y2="0"/>
    <polygon points="84,0 76,-4 76,4" fill="#F87171" stroke="none"/>
    <line x1="84" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#F87171" stroke="none"/>
  </g>
  <g transform="translate(206 84)" fill="#F87171" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="42" y="-6">get</text>
    <text x="42" y="56">set</text>
  </g>

  <!-- Right column: cache API -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="10" font-family="'Consolas','Menlo',monospace">Rate cache</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="10" y="46" fill="#F87171">AddDistributedRateCache</text>
      <text x="10" y="66" fill="#F87171">AddRedisRateCache</text>
      <text x="10" y="92">StoreFetchedRange</text>
      <text x="10" y="110">DateRangeCoverage</text>
      <text x="10" y="136" fill="#94A3B8" font-size="9">shared across instances</text>
    </g>
  </g>

  <!-- bottom note -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">one durable rate cache for the whole fleet</text>
  </g>
</svg>
