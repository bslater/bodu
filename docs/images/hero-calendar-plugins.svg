<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Globalization.Calendar.Plugins — trust-gated loading of external date algorithms">
  <title>Bodu.Globalization.Calendar.Plugins</title>
  <defs>
    <linearGradient id="calplg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#calplg-bg)"/>

  <!-- Left column: the external assembly -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 4"/>
    <rect width="150" height="22" rx="8" fill="#2DD4BF"/>
    <rect y="14" width="150" height="8" fill="#2DD4BF"/>
    <text x="75" y="16" fill="#042F2A" text-anchor="middle" font-weight="700" font-size="10" font-family="'Consolas','Menlo',monospace">External assembly</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="48">MyAlgorithms.dll</text>
      <text x="10" y="74" fill="#2DD4BF">INotableDate</text>
      <text x="10" y="90" fill="#2DD4BF">Algorithm</text>
      <text x="10" y="116" fill="#94A3B8" font-size="9">custom lunar rules,</text>
      <text x="10" y="132" fill="#94A3B8" font-size="9">regional observances…</text>
    </g>
  </g>

  <!-- middle: the trust gate (shield) -->
  <g transform="translate(200 66)">
    <line x1="-14" y1="44" x2="8" y2="44" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
    <path d="M 38 0 L 68 10 L 68 46 Q 68 74 38 88 Q 8 74 8 46 L 8 10 Z"
          fill="#1E293B" stroke="#2DD4BF" stroke-width="2.4"/>
    <circle cx="38" cy="38" r="8" fill="none" stroke="#2DD4BF" stroke-width="2.4"/>
    <rect x="35" y="44" width="6" height="16" rx="3" fill="#2DD4BF"/>
    <line x1="68" y1="44" x2="90" y2="44" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
    <polygon points="90,44 82,40 82,48" fill="#2DD4BF"/>
    <text x="38" y="110" fill="#2DD4BF" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-size="10">trust gate</text>
  </g>

  <!-- Right column: the calendar engine -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Calendar engine</text>

    <g stroke="#334155" stroke-width="1">
      <rect x="12" y="36" width="118" height="20" rx="4" fill="#0F172A"/>
      <rect x="12" y="62" width="118" height="20" rx="4" fill="#0F172A"/>
      <rect x="12" y="88" width="118" height="20" rx="4" fill="#0F172A" stroke="#2DD4BF" stroke-dasharray="4 3"/>
    </g>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="20" y="50">EasterCalculator</text>
      <text x="20" y="76">LunarPhaseCalculator</text>
      <text x="20" y="102" fill="#2DD4BF">← plugin slot</text>
      <text x="12" y="130" fill="#94A3B8" font-size="9">strategies resolve by</text>
      <text x="12" y="144" fill="#94A3B8" font-size="9">algorithm name</text>
    </g>
  </g>

  <!-- bottom note -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">trust-gated assembly loading</text>
  </g>
</svg>
