<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Text.Ini — section-organised configuration documents">
  <title>Bodu.Text.Ini</title>
  <defs>
    <linearGradient id="ini-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#ini-bg)"/>

  <!-- Left column: section/entry document model -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="138" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="138" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="138" height="8" fill="#3B82F6"/>
    <text x="69" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">document</text>

    <g font-family="'Consolas','Menlo',monospace" font-size="11">
      <text x="10" y="42" fill="#94A3B8">preamble</text>
      <text x="22" y="58" fill="#E2E8F0">root = true</text>
      <rect x="8" y="68" width="122" height="16" rx="3" fill="#3B82F6" opacity="0.85"/>
      <text x="14" y="80" fill="#F8FAFC" font-weight="700">[server]</text>
      <text x="22" y="100" fill="#E2E8F0">host = ...</text>
      <text x="22" y="116" fill="#E2E8F0">port = 8080</text>
      <rect x="8" y="124" width="122" height="16" rx="3" fill="#3B82F6" opacity="0.85"/>
      <text x="14" y="136" fill="#F8FAFC" font-weight="700">[logging]</text>
    </g>
  </g>

  <!-- middle: bidirectional pipeline arrows -->
  <g transform="translate(176 80)" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="120" y2="0"/>
    <polygon points="120,0 112,-4 112,4" fill="#60A5FA" stroke="none"/>
    <line x1="120" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#60A5FA" stroke="none"/>
  </g>
  <g transform="translate(176 80)" fill="#60A5FA" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="60" y="-6">save</text>
    <text x="60" y="56">parse</text>
  </g>

  <!-- Right column: ini text -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#A78BFA"/>
    <rect y="14" width="142" height="8" fill="#A78BFA"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">ini text</text>

    <g font-family="'Consolas','Menlo',monospace" font-size="11">
      <text x="10" y="42" fill="#94A3B8">; config sample</text>
      <text x="10" y="58" fill="#E2E8F0">root = true</text>
      <text x="10" y="80" fill="#FBBF24">[server]</text>
      <text x="10" y="96" fill="#E2E8F0"><tspan fill="#60A5FA">host</tspan> = localhost</text>
      <text x="10" y="112" fill="#E2E8F0"><tspan fill="#60A5FA">port</tspan> = 8080</text>
      <text x="10" y="134" fill="#FBBF24">[logging]</text>
    </g>
  </g>

  <!-- bottom note -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">sections · comments · round-trip</text>
  </g>
</svg>
