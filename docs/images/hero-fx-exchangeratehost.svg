<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Financial.ExchangeRates.ExchangeRateHost — exchangerate.host provider">
  <title>Bodu.Financial.ExchangeRates.ExchangeRateHost</title>
  <defs>
    <linearGradient id="fxxrh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#fxxrh-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#C084FC"/>
    <rect y="14" width="150" height="8" fill="#C084FC"/>
    <text x="75" y="16" fill="#2E1065" text-anchor="middle" font-weight="700" font-size="10">exchangerate.host</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="44">timeseries</text>
      <text x="10" y="61"><tspan fill="#94A3B8">quotes: USDEUR</tspan></text>
    </g>
    <rect x="10" y="74" width="92" height="18" rx="9" fill="#0F172A" stroke="#C084FC" stroke-width="1.2"/>
    <text x="56" y="87" fill="#C084FC" text-anchor="middle" font-family="'Consolas','Menlo',monospace" font-size="9.5">access_key</text>
    <g transform="translate(10 100)">
      <polyline points="0,30 22,20 43,26 65,10 87,18 108,8 130,16" fill="none" stroke="#C084FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="130" cy="16" r="3" fill="#C084FC"/>
      <text x="0" y="52" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">source + quotes (USD)</text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#C084FC" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#C084FC" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#C084FC" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#C084FC" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">fetch</text>
    <text x="52" y="56">parse</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Provider</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="10" y="46">IDatedRateProvider</text>
      <text x="10" y="70">RateBook</text>
      <text x="10" y="94"><tspan fill="#C084FC">any pair</tspan></text>
      <text x="10" y="118"><tspan fill="#94A3B8" font-size="9">PairWebRateProvider</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">services.AddExchangeRateHostExchangeRates()</text>
  </g>
</svg>
