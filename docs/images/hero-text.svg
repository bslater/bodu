<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Text — text-encoding utilities in the Bodu.Core foundation package">
  <title>Bodu.Text</title>
  <defs>
    <linearGradient id="text-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#text-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#F472B6"/>
    <rect y="14" width="150" height="8" fill="#F472B6"/>
    <text x="75" y="16" fill="#3D0A24" text-anchor="middle" font-weight="700" font-size="11">Bodu.Text</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="46">EncodingDetection</text>
      <text x="10" y="64">EncodingExtensions</text>
      <text x="10" y="82">StringEncoding</text>
      <text x="10" y="100">Extensions</text>
      <text x="10" y="127"><tspan fill="#94A3B8" font-size="9">namespace in Bodu.Core</tspan></text>
    </g>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#F472B6" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#F472B6" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#F472B6" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#F472B6" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">detect</text>
    <text x="52" y="56">decode</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="11">Detection</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10">
      <text x="10" y="44">BOM <tspan fill="#94A3B8">UTF-8/16/32</tspan></text>
      <text x="10" y="61">heuristic sniffing</text>
      <text x="10" y="78">charset fallbacks</text>
      <text x="10" y="103"><tspan fill="#60A5FA">GetString(span)</tspan></text>
      <text x="10" y="120"><tspan fill="#60A5FA">TryGetBytes(…)</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">encoding detection · span-first conversions</text>
  </g>
</svg>
