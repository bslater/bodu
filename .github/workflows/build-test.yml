name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      TEST_PROJECTS: >-
        Bodu.Core/test/Bodu.Core.Test.csproj
        Bodu.Security.Cryptography/test/Bodu.Security.Cryptography.Test.csproj
        Bodu.IO/test/Bodu.IO.Test.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x

      - name: Restore
        run: |
          for proj in $TEST_PROJECTS; do
            echo "::group::Restore $proj"
            dotnet restore "$proj"
            echo "::endgroup::"
          done

      - name: Build
        run: |
          for proj in $TEST_PROJECTS; do
            echo "::group::Build $proj"
            dotnet build "$proj" --configuration Release --no-restore
            echo "::endgroup::"
          done

      - name: Test
        run: |
          status=0
          for proj in $TEST_PROJECTS; do
            name=$(basename "$proj" .csproj)
            echo "::group::Test $name"
            dotnet test "$proj" \
              --configuration Release \
              --no-build \
              --settings test.runsettings \
              --results-directory "${{ github.workspace }}/TestResults/$name" \
              --logger "trx;LogFileName=$name.trx" \
              --logger "console;verbosity=normal" || status=$?
            echo "::endgroup::"
          done
          exit $status

      - name: Upload TRX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: TestResults/**/*.trx
          retention-days: 14
          if-no-files-found: error

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: MSTest Results
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false
