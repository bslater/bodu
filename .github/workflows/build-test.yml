name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The Bodu.Text.Yaml Regression tier reads the yaml/yaml-test-suite conformance corpus, linked as the
          # 'yaml-test-suite' git submodule; check it out so those tests have their vectors.
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            10.0.x

      - name: Pack Bodu.CodeStyle.XmlDocumentation analyzer (local feed)
        working-directory: Bodu.CodeStyle
        run: |
          dotnet pack Bodu.CodeStyle.XmlDocumentation/Bodu.CodeStyle.XmlDocumentation.csproj \
            --configuration Release \
            --output "${{ github.workspace }}/local-packages"

      - name: Discover test projects
        run: |
          # Every '*.Test.csproj' that is a member of bodu.slnx. Deriving the list from the
          # solution keeps CI in sync as projects are added or removed, and naturally excludes
          # the benchmark harnesses (which are not test projects and are not built in CI).
          projects=$(grep -oE 'Path="[^"]*\.Test\.csproj"' bodu.slnx \
            | sed -E 's/^Path="//; s/"$//; s/\\/\//g' \
            | sort -u)

          if [ -z "$projects" ]; then
            echo "::error::No test projects discovered in bodu.slnx" >&2
            exit 1
          fi

          # Module-presence guard: assert every regional calendar test pack is a member of bodu.slnx. A pack
          # silently dropped from the solution (as the Africa and MiddleEast packs once were) would otherwise
          # shrink the test/coverage surface while the build stayed green. Fail fast if any expected pack is gone.
          missing=""
          for region in Africa Americas AsiaPacific Europe MiddleEast; do
            expected="Bodu.Globalization.Calendar.$region.Test.csproj"
            if ! echo "$projects" | grep -q "/$expected\$"; then
              missing="$missing $expected"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::Expected regional calendar test projects missing from bodu.slnx:$missing" >&2
            exit 1
          fi

          echo "Discovered test projects:"
          echo "$projects"

          {
            echo 'TEST_PROJECTS<<EOF'
            echo "$projects"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Restore
        run: |
          for proj in $TEST_PROJECTS; do
            echo "::group::Restore $proj"
            dotnet restore "$proj"
            echo "::endgroup::"
          done

      - name: Build
        run: |
          for proj in $TEST_PROJECTS; do
            echo "::group::Build $proj"
            dotnet build "$proj" --configuration Release --no-restore
            echo "::endgroup::"
          done

      - name: Test
        run: |
          status=0

          for proj in $TEST_PROJECTS; do
            name=$(basename "$proj" .csproj)

            echo "::group::Test $name"

            dotnet test "$proj" \
              --configuration Release \
              --no-build \
              --settings test.runsettings \
              --results-directory "${{ github.workspace }}/TestResults/$name" \
              --logger "trx;LogFileName=$name.trx" \
              --logger "console;verbosity=normal" || status=$?

            echo "::endgroup::"
          done

          exit $status

      - name: Run samples
        run: |
          # Every sample console app that is a member of bodu.slnx (excluding sample test
          # projects, which run in the Test step above). Samples are offline and deterministic;
          # running each one is the smoke test that keeps the sample code from rotting.
          projects=$(grep -oE 'Path="samples/[^"]*\.csproj"' bodu.slnx \
            | sed -E 's/^Path="//; s/"$//; s/\\/\//g' \
            | grep -v '\.Test\.csproj$' \
            | sort -u)

          if [ -z "$projects" ]; then
            echo "::error::No sample projects discovered in bodu.slnx" >&2
            exit 1
          fi

          for proj in $projects; do
            name=$(basename "$proj" .csproj)
            echo "::group::Run $name"
            dotnet run --project "$proj" --configuration Release
            echo "::endgroup::"
          done

      - name: Upload TRX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: TestResults/**/*.trx
          retention-days: 14
          if-no-files-found: error

      - name: Filter failed tests into separate TRX
        if: always()
        shell: pwsh
        run: |
          $sourceRoot = Join-Path '${{ github.workspace }}' 'TestResults'
          $failedRoot = Join-Path '${{ github.workspace }}' 'FailedTestResults'

          if (-not (Test-Path $sourceRoot)) {
            Write-Host 'No TestResults directory found; nothing to filter.'
            return
          }

          $ns = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'
          $trxFiles = Get-ChildItem -Path $sourceRoot -Filter '*.trx' -Recurse -File
          $totalFailed = 0

          foreach ($trx in $trxFiles) {
            [xml]$doc = Get-Content -LiteralPath $trx.FullName
            $nsMgr = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
            $nsMgr.AddNamespace('t', $ns)

            $failedResults = @($doc.SelectNodes('//t:UnitTestResult[@outcome="Failed"]', $nsMgr))

            if ($failedResults.Count -eq 0) {
              Write-Host ("No failed tests in {0}; skipping." -f $trx.Name)
              continue
            }

            $failedIds = @{}

            foreach ($node in $failedResults) {
              $failedIds[$node.testId] = $true
            }

            foreach ($node in @($doc.SelectNodes('//t:UnitTestResult', $nsMgr))) {
              if (-not $failedIds.ContainsKey($node.testId)) {
                [void]$node.ParentNode.RemoveChild($node)
              }
            }

            foreach ($node in @($doc.SelectNodes('//t:TestEntry', $nsMgr))) {
              if (-not $failedIds.ContainsKey($node.testId)) {
                [void]$node.ParentNode.RemoveChild($node)
              }
            }

            foreach ($node in @($doc.SelectNodes('//t:TestDefinitions/*', $nsMgr))) {
              if (-not $failedIds.ContainsKey($node.id)) {
                [void]$node.ParentNode.RemoveChild($node)
              }
            }

            $counters = $doc.SelectSingleNode('//t:ResultSummary/t:Counters', $nsMgr)

            if ($null -ne $counters) {
              foreach ($attr in @($counters.Attributes)) {
                $counters.SetAttribute($attr.Name, '0')
              }

              $counters.SetAttribute('total', [string]$failedResults.Count)
              $counters.SetAttribute('executed', [string]$failedResults.Count)
              $counters.SetAttribute('failed', [string]$failedResults.Count)
            }

            $relative = [System.IO.Path]::GetRelativePath($sourceRoot, $trx.FullName)
            $target = Join-Path $failedRoot ([System.IO.Path]::ChangeExtension($relative, '.failed.trx'))

            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
            $doc.Save($target)

            Write-Host ("Wrote {0} (failed: {1})" -f $target, $failedResults.Count)

            $totalFailed += $failedResults.Count
          }

          Write-Host ("Total failed tests captured: {0}" -f $totalFailed)

      - name: Publish failed test summary
        if: always()
        shell: pwsh
        run: |
          $sourceRoot = Join-Path '${{ github.workspace }}' 'TestResults'
          $summaryFile = Join-Path '${{ github.workspace }}' 'failed-tests-summary.md'

          "# Failed Test Summary" | Out-File -FilePath $summaryFile -Encoding utf8
          "" | Out-File -FilePath $summaryFile -Append -Encoding utf8

          if (-not (Test-Path $sourceRoot)) {
            "No TestResults directory found." | Out-File -FilePath $summaryFile -Append -Encoding utf8
            Get-Content $summaryFile | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            return
          }

          $ns = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'
          $trxFiles = Get-ChildItem -Path $sourceRoot -Filter '*.trx' -Recurse -File
          $totalFailed = 0

          foreach ($trx in $trxFiles) {
            [xml]$doc = Get-Content -LiteralPath $trx.FullName
            $nsMgr = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
            $nsMgr.AddNamespace('t', $ns)

            $failedResults = @($doc.SelectNodes('//t:UnitTestResult[@outcome="Failed"]', $nsMgr))

            if ($failedResults.Count -eq 0) {
              continue
            }

            "## $($trx.BaseName)" | Out-File -FilePath $summaryFile -Append -Encoding utf8
            "" | Out-File -FilePath $summaryFile -Append -Encoding utf8

            foreach ($result in $failedResults) {
              $testName = $result.testName
              $messageNode = $result.SelectSingleNode('t:Output/t:ErrorInfo/t:Message', $nsMgr)
              $stackNode = $result.SelectSingleNode('t:Output/t:ErrorInfo/t:StackTrace', $nsMgr)

              "- **$testName**" | Out-File -FilePath $summaryFile -Append -Encoding utf8

              if ($null -ne $messageNode) {
                $message = $messageNode.InnerText.Trim()
                "  - Message: $message" | Out-File -FilePath $summaryFile -Append -Encoding utf8
              }

              if ($null -ne $stackNode) {
                $stackTrace = $stackNode.InnerText.Trim()

                if (-not [string]::IsNullOrWhiteSpace($stackTrace)) {
                  "  - Stack trace:" | Out-File -FilePath $summaryFile -Append -Encoding utf8
                  "" | Out-File -FilePath $summaryFile -Append -Encoding utf8
                  "    ````text" | Out-File -FilePath $summaryFile -Append -Encoding utf8
                  $stackTrace | Out-File -FilePath $summaryFile -Append -Encoding utf8
                  "    ````" | Out-File -FilePath $summaryFile -Append -Encoding utf8
                }
              }

              "" | Out-File -FilePath $summaryFile -Append -Encoding utf8
            }

            $totalFailed += $failedResults.Count
          }

          if ($totalFailed -eq 0) {
            "No failed tests were found." | Out-File -FilePath $summaryFile -Append -Encoding utf8
          }

          "" | Out-File -FilePath $summaryFile -Append -Encoding utf8
          "_Total failed tests captured: $totalFailed._" | Out-File -FilePath $summaryFile -Append -Encoding utf8

          Get-Content $summaryFile | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload failed-tests TRX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-failed-trx
          path: FailedTestResults/**/*.failed.trx
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failed test summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-summary
          path: failed-tests-summary.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment failed test summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const summaryPath = 'failed-tests-summary.md';
            const marker = '<!-- bodu-ci-failed-tests-summary -->';

            if (!fs.existsSync(summaryPath)) {
              return;
            }

            const summary = fs.readFileSync(summaryPath, 'utf8');

            if (!summary.includes('- **')) {
              return;
            }

            const maxBodyLength = 60000;
            let body = [
              marker,
              '## CI failed test summary',
              '',
              summary,
              '',
              '@claude please review these failed tests and suggest the required code or test fixes.'
            ].join('\n');

            if (body.length > maxBodyLength) {
              body = body.substring(0, maxBodyLength) + '\n\n_Comment truncated because the failure output was too large. See the workflow summary or uploaded artifacts for the full output._';
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body &&
              comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });

              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body
            });

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: MSTest Results
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false
