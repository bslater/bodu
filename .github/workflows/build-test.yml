name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

jobs:
  # Runs on both Ubuntu 24.04 and 26.04 while GitHub moves ubuntu-latest from one to the other,
  # gradually, between October 19 and November 19, 2026. Drop ubuntu-24.04 from the list once 26.04
  # has proven itself. fail-fast is off so a failure on one image does not cancel the other.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The Bodu.Text.Yaml Regression tier reads the yaml/yaml-test-suite conformance corpus, linked as the
          # 'yaml-test-suite' git submodule; check it out so those tests have their vectors.
          submodules: recursive

      # Bash-only and seconds to run, so it gates before the SDK setup: a namespace/folder violation
      # fails the same way locally and here, without waiting on a full restore and build.
      - name: Check folder / namespace alignment
        run: bash bld/check-folder-namespace-alignment.sh

      # Same rationale: bash-only and seconds to run, so a malformed manifest or a shipping package
      # missing its README, tier banner or icon fails here rather than in a release run - after a tag
      # has been pushed and a nuget.org version can no longer be withdrawn.
      - name: Check release manifest
        run: bash bld/check-release-manifest.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The .NET 10 SDK is the exact version global.json pins, so an SDK upgrade is a deliberate
          # change. The .NET 8 SDK beside it builds the Bodu.CodeStyle solution and runs the net8.0 legs.
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Pack Bodu.CodeStyle.XmlDocumentation analyzer (local feed)
        working-directory: Bodu.CodeStyle
        run: |
          dotnet pack Bodu.CodeStyle.XmlDocumentation/Bodu.CodeStyle.XmlDocumentation.csproj \
            --configuration Release \
            --output "${{ github.workspace }}/local-packages"

      - name: Discover test projects
        run: |
          # Every '*.Test.csproj' that is a member of bodu.slnx. Deriving the list from the
          # solution keeps CI in sync as projects are added or removed, and naturally excludes
          # the benchmark harnesses (which are not test projects and are not built in CI).
          projects=$(grep -oE 'Path="[^"]*\.Test\.csproj"' bodu.slnx \
            | sed -E 's/^Path="//; s/"$//; s/\\/\//g' \
            | sort -u)

          if [ -z "$projects" ]; then
            echo "::error::No test projects discovered in bodu.slnx" >&2
            exit 1
          fi

          # Module-presence guard: assert every regional calendar test pack is a member of bodu.slnx. A pack
          # silently dropped from the solution (as the Africa and MiddleEast packs once were) would otherwise
          # shrink the test/coverage surface while the build stayed green. Fail fast if any expected pack is gone.
          missing=""
          for region in Africa Americas AsiaPacific Europe MiddleEast; do
            expected="Bodu.Globalization.Calendar.$region.Test.csproj"
            if ! echo "$projects" | grep -q "/$expected\$"; then
              missing="$missing $expected"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::Expected regional calendar test projects missing from bodu.slnx:$missing" >&2
            exit 1
          fi

          echo "Discovered test projects:"
          echo "$projects"

          {
            echo 'TEST_PROJECTS<<EOF'
            echo "$projects"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Restore
        run: |
          for proj in $TEST_PROJECTS; do
            echo "::group::Restore $proj"
            dotnet restore "$proj"
            echo "::endgroup::"
          done

      - name: Build
        run: |
          # Warnings are errors in CI, here and in release.yml's test gate: any compiler or analyzer
          # warning fails the pull request, while a local build still reports it as a warning. A
          # deliberate finding is suppressed at its site with a justification, as the existing
          # suppressions are. MSBuild, SDK and NuGet warnings are not promoted (that would take
          # -warnaserror), so a newly published package advisory cannot fail unrelated pull requests.
          for proj in $TEST_PROJECTS; do
            echo "::group::Build $proj"
            dotnet build "$proj" --configuration Release --no-restore -p:TreatWarningsAsErrors=true
            echo "::endgroup::"
          done

      - name: Test
        run: |
          # The TRX logger takes LogFilePrefix, not LogFileName: every project runs once per target
          # framework, and with a fixed file name the second run overwrites the first's TRX, so the
          # reports and artifacts below would see only one framework's results. The prefix form writes
          # <name>_<framework>_<timestamp>.trx, one file per run.
          status=0

          for proj in $TEST_PROJECTS; do
            name=$(basename "$proj" .csproj)

            echo "::group::Test $name"

            dotnet test "$proj" \
              --configuration Release \
              --no-build \
              --settings test.runsettings \
              --results-directory "${{ github.workspace }}/TestResults/$name" \
              --logger "trx;LogFilePrefix=$name" \
              --logger "console;verbosity=normal" || status=$?

            echo "::endgroup::"
          done

          exit $status

      - name: Build samples and the docs project
        run: |
          # The members of bodu.slnx that the Build step does not reach: every sample project other
          # than the sample test projects the Build step has already compiled, and docs/doc.csproj,
          # the container for the documentation sources. Each is compiled the way a test project is:
          # in Release, for every target framework, with warnings as errors, so a warning in one of
          # them fails the pull request too. LiveRates and the library samples are compiled here
          # although the next step does not run them.
          projects=$(grep -oE 'Path="samples/[^"]*\.csproj"' bodu.slnx \
            | sed -E 's/^Path="//; s/"$//; s/\\/\//g' \
            | grep -v '\.Test\.csproj$' \
            | sort -u)

          if [ -z "$projects" ]; then
            echo "::error::No sample projects discovered in bodu.slnx" >&2
            exit 1
          fi

          # One build of a generated solution rather than a build per project: MSBuild evaluates the
          # libraries the samples share once and builds the samples in parallel, which takes seconds where
          # a build per project took minutes. A failing sample does not stop the others, so one run
          # reports every failure. The solution holds these projects alone; the libraries the samples
          # reference are built through those references, as the Build step built them.
          solution_dir="$RUNNER_TEMP/samples-solution"
          dotnet new sln --format slnx --name samples --output "$solution_dir"
          dotnet sln "$solution_dir/samples.slnx" add --in-root --include-references false $projects docs/doc.csproj
          dotnet build "$solution_dir/samples.slnx" --configuration Release -p:TreatWarningsAsErrors=true

      - name: Run samples
        run: |
          # Every sample console app that is a member of bodu.slnx. Samples are offline and
          # deterministic; running each one is the smoke test that keeps the sample code from
          # rotting. Three kinds of project are members but are not run here:
          #   * sample test projects, which run in the Test step above;
          #   * LiveRates, the one deliberate exception that calls a live web feed;
          #   * library sample projects with no entry point (a plugin assembly, for example),
          #     which are exercised by the host sample that loads them.
          # The OutputType filter is what excludes the third kind, so adding a library sample
          # does not need this step edited.
          projects=$(grep -oE 'Path="samples/[^"]*\.csproj"' bodu.slnx \
            | sed -E 's/^Path="//; s/"$//; s/\\/\//g' \
            | grep -v '\.Test\.csproj$' \
            | grep -v '\.Samples\.LiveRates\.csproj$' \
            | while read -r proj; do \
                grep -qE '<OutputType>\s*Exe\s*</OutputType>' "$proj" && echo "$proj"; \
              done \
            | sort -u)

          if [ -z "$projects" ]; then
            echo "::error::No sample projects discovered in bodu.slnx" >&2
            exit 1
          fi

          # Samples multi-target, so --framework is required: `dotnet run` refuses to guess.
          # They run on the newest supported framework only: the sample code is identical across
          # legs, and the step above has compiled both, so running each sample twice
          # would double the step's wall-clock for no additional signal. --no-build runs what that
          # step compiled.
          for proj in $projects; do
            name=$(basename "$proj" .csproj)
            echo "::group::Run $name"
            dotnet run --project "$proj" --configuration Release --framework net10.0 --no-build
            echo "::endgroup::"
          done

      - name: Upload TRX artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-trx-${{ matrix.os }}
          path: TestResults/**/*.trx
          retention-days: 14
          if-no-files-found: error

      - name: Filter failed tests into separate TRX
        if: always()
        shell: pwsh
        run: |
          $sourceRoot = Join-Path '${{ github.workspace }}' 'TestResults'
          $failedRoot = Join-Path '${{ github.workspace }}' 'FailedTestResults'

          if (-not (Test-Path $sourceRoot)) {
            Write-Host 'No TestResults directory found; nothing to filter.'
            return
          }

          $ns = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'
          $trxFiles = Get-ChildItem -Path $sourceRoot -Filter '*.trx' -Recurse -File
          $totalFailed = 0

          foreach ($trx in $trxFiles) {
            [xml]$doc = Get-Content -LiteralPath $trx.FullName
            $nsMgr = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
            $nsMgr.AddNamespace('t', $ns)

            $failedResults = @($doc.SelectNodes('//t:UnitTestResult[@outcome="Failed"]', $nsMgr))

            if ($failedResults.Count -eq 0) {
              Write-Host ("No failed tests in {0}; skipping." -f $trx.Name)
              continue
            }

            $failedIds = @{}

            foreach ($node in $failedResults) {
              $failedIds[$node.testId] = $true
            }

            foreach ($node in @($doc.SelectNodes('//t:UnitTestResult', $nsMgr))) {
              if (-not $failedIds.ContainsKey($node.testId)) {
                [void]$node.ParentNode.RemoveChild($node)
              }
            }

            foreach ($node in @($doc.SelectNodes('//t:TestEntry', $nsMgr))) {
              if (-not $failedIds.ContainsKey($node.testId)) {
                [void]$node.ParentNode.RemoveChild($node)
              }
            }

            foreach ($node in @($doc.SelectNodes('//t:TestDefinitions/*', $nsMgr))) {
              if (-not $failedIds.ContainsKey($node.id)) {
                [void]$node.ParentNode.RemoveChild($node)
              }
            }

            $counters = $doc.SelectSingleNode('//t:ResultSummary/t:Counters', $nsMgr)

            if ($null -ne $counters) {
              foreach ($attr in @($counters.Attributes)) {
                $counters.SetAttribute($attr.Name, '0')
              }

              $counters.SetAttribute('total', [string]$failedResults.Count)
              $counters.SetAttribute('executed', [string]$failedResults.Count)
              $counters.SetAttribute('failed', [string]$failedResults.Count)
            }

            $relative = [System.IO.Path]::GetRelativePath($sourceRoot, $trx.FullName)
            $target = Join-Path $failedRoot ([System.IO.Path]::ChangeExtension($relative, '.failed.trx'))

            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
            $doc.Save($target)

            Write-Host ("Wrote {0} (failed: {1})" -f $target, $failedResults.Count)

            $totalFailed += $failedResults.Count
          }

          Write-Host ("Total failed tests captured: {0}" -f $totalFailed)

      - name: Publish failed test summary
        if: always()
        shell: pwsh
        run: |
          $sourceRoot = Join-Path '${{ github.workspace }}' 'TestResults'
          $summaryFile = Join-Path '${{ github.workspace }}' 'failed-tests-summary.md'

          "# Failed Test Summary" | Out-File -FilePath $summaryFile -Encoding utf8
          "" | Out-File -FilePath $summaryFile -Append -Encoding utf8

          if (-not (Test-Path $sourceRoot)) {
            "No TestResults directory found." | Out-File -FilePath $summaryFile -Append -Encoding utf8
            Get-Content $summaryFile | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            return
          }

          $ns = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'
          $trxFiles = Get-ChildItem -Path $sourceRoot -Filter '*.trx' -Recurse -File
          $totalFailed = 0

          foreach ($trx in $trxFiles) {
            [xml]$doc = Get-Content -LiteralPath $trx.FullName
            $nsMgr = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
            $nsMgr.AddNamespace('t', $ns)

            $failedResults = @($doc.SelectNodes('//t:UnitTestResult[@outcome="Failed"]', $nsMgr))

            if ($failedResults.Count -eq 0) {
              continue
            }

            "## $($trx.BaseName)" | Out-File -FilePath $summaryFile -Append -Encoding utf8
            "" | Out-File -FilePath $summaryFile -Append -Encoding utf8

            foreach ($result in $failedResults) {
              $testName = $result.testName
              $messageNode = $result.SelectSingleNode('t:Output/t:ErrorInfo/t:Message', $nsMgr)
              $stackNode = $result.SelectSingleNode('t:Output/t:ErrorInfo/t:StackTrace', $nsMgr)

              "- **$testName**" | Out-File -FilePath $summaryFile -Append -Encoding utf8

              if ($null -ne $messageNode) {
                $message = $messageNode.InnerText.Trim()
                "  - Message: $message" | Out-File -FilePath $summaryFile -Append -Encoding utf8
              }

              if ($null -ne $stackNode) {
                $stackTrace = $stackNode.InnerText.Trim()

                if (-not [string]::IsNullOrWhiteSpace($stackTrace)) {
                  "  - Stack trace:" | Out-File -FilePath $summaryFile -Append -Encoding utf8
                  "" | Out-File -FilePath $summaryFile -Append -Encoding utf8
                  "    ````text" | Out-File -FilePath $summaryFile -Append -Encoding utf8
                  $stackTrace | Out-File -FilePath $summaryFile -Append -Encoding utf8
                  "    ````" | Out-File -FilePath $summaryFile -Append -Encoding utf8
                }
              }

              "" | Out-File -FilePath $summaryFile -Append -Encoding utf8
            }

            $totalFailed += $failedResults.Count
          }

          if ($totalFailed -eq 0) {
            "No failed tests were found." | Out-File -FilePath $summaryFile -Append -Encoding utf8
          }

          "" | Out-File -FilePath $summaryFile -Append -Encoding utf8
          "_Total failed tests captured: $totalFailed._" | Out-File -FilePath $summaryFile -Append -Encoding utf8

          Get-Content $summaryFile | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload failed-tests TRX artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-failed-trx-${{ matrix.os }}
          path: FailedTestResults/**/*.failed.trx
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failed test summary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests-summary-${{ matrix.os }}
          path: failed-tests-summary.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment failed test summary on PR
        # Only the first image in the list comments. A second comment would repeat every failure the
        # two images share and ask Claude to review it twice; the other image's failures are in its
        # own job summary and test report.
        if: always() && github.event_name == 'pull_request' && strategy.job-index == 0
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            const summaryPath = 'failed-tests-summary.md';
            const marker = '<!-- bodu-ci-failed-tests-summary -->';

            if (!fs.existsSync(summaryPath)) {
              return;
            }

            const summary = fs.readFileSync(summaryPath, 'utf8');

            if (!summary.includes('- **')) {
              return;
            }

            const maxBodyLength = 60000;
            let body = [
              marker,
              '## CI failed test summary (${{ matrix.os }})',
              '',
              summary,
              '',
              '@claude please review these failed tests and suggest the required code or test fixes.'
            ].join('\n');

            if (body.length > maxBodyLength) {
              body = body.substring(0, maxBodyLength) + '\n\n_Comment truncated because the failure output was too large. See the workflow summary or uploaded artifacts for the full output._';
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body &&
              comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });

              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body
            });

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: MSTest Results (${{ matrix.os }})
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          # Only failing tests are listed. The suite has more than 90,000 tests per framework, and with
          # every one listed the report runs to megabytes, far past the summary's size limit, and the
          # reporter overflows its stack assembling it. Each test class is still listed with its counts.
          list-tests: failed

  # The job above runs every suite on x64, where the Argon2 AdvSimd kernel and the GHASH PMULL kernel cannot
  # execute. This one runs the two cryptography suites on GitHub's hosted ARM64 runner (free for public
  # repositories), on both frameworks, so both kernels are held to the same vectors as the x64 ones and the SIMD
  # opt-out is proven on ARM64 too. SimdCapabilitiesTests fails if the AdvSimd gate is closed here, so the job cannot
  # silently fall back to the scalar Argon2 kernel; the PMULL gate opens wherever the processor lists 'pmull' among
  # the features the step below reports. It proves correctness; performance is measured separately. Like the
  # job above, it runs on both Ubuntu 24.04 and 26.04 until 24.04 is dropped.
  build-test-arm64:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    env:
      TEST_PROJECTS: >-
        Bodu.Security.Cryptography/test/Bodu.Security.Cryptography.Test.csproj
        Bodu.Security.Cryptography.Simd.Test/test/Bodu.Security.Cryptography.Simd.Test.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The .NET 10 SDK is the exact version global.json pins, so an SDK upgrade is a deliberate
          # change. The .NET 8 SDK beside it builds the Bodu.CodeStyle solution and runs the net8.0 legs.
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Pack Bodu.CodeStyle.XmlDocumentation analyzer (local feed)
        working-directory: Bodu.CodeStyle
        run: |
          dotnet pack Bodu.CodeStyle.XmlDocumentation/Bodu.CodeStyle.XmlDocumentation.csproj \
            --configuration Release \
            --output "${{ github.workspace }}/local-packages"

      - name: Report processor
        run: |
          uname -m
          grep -m1 -i 'features' /proc/cpuinfo || true

      - name: Restore
        run: |
          for proj in $TEST_PROJECTS; do
            echo "::group::Restore $proj"
            dotnet restore "$proj"
            echo "::endgroup::"
          done

      - name: Build
        run: |
          # Warnings are errors in CI, here and in release.yml's test gate: any compiler or analyzer
          # warning fails the pull request, while a local build still reports it as a warning. A
          # deliberate finding is suppressed at its site with a justification, as the existing
          # suppressions are. MSBuild, SDK and NuGet warnings are not promoted (that would take
          # -warnaserror), so a newly published package advisory cannot fail unrelated pull requests.
          for proj in $TEST_PROJECTS; do
            echo "::group::Build $proj"
            dotnet build "$proj" --configuration Release --no-restore -p:TreatWarningsAsErrors=true
            echo "::endgroup::"
          done

      - name: Test
        run: |
          # The TRX logger takes LogFilePrefix, not LogFileName: every project runs once per target
          # framework, and with a fixed file name the second run overwrites the first's TRX, so the
          # reports and artifacts below would see only one framework's results. The prefix form writes
          # <name>_<framework>_<timestamp>.trx, one file per run.
          status=0

          for proj in $TEST_PROJECTS; do
            name=$(basename "$proj" .csproj)

            echo "::group::Test $name"

            dotnet test "$proj" \
              --configuration Release \
              --no-build \
              --settings test.runsettings \
              --results-directory "${{ github.workspace }}/TestResults/$name" \
              --logger "trx;LogFilePrefix=$name" \
              --logger "console;verbosity=normal" || status=$?

            echo "::endgroup::"
          done

          exit $status

      - name: Upload TRX artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-trx-${{ matrix.os }}
          path: TestResults/**/*.trx
          retention-days: 14
          if-no-files-found: error

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: MSTest Results (${{ matrix.os }})
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          # Only failing tests are listed, as in the job above: a full list runs past the summary's size
          # limit, and a long enough one overflows the reporter's stack. Each test class is still listed.
          list-tests: failed
