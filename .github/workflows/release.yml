name: Release

# Builds, strong-name (real) signs, packs, and optionally publishes the Bodu packages.
#
# The whole solution is packed, but only packages listed in the shipping manifest
# (bld/release-manifest.txt) are staged and pushed to nuget.org - packages for waves that have not
# been released yet are produced as build artifacts only. See bld/RELEASING.md for the release model.
#
# Triggered for a release by pushing a version tag (e.g. v1.0.0), or manually via the Actions tab.
#
# The tag is a LABEL, not the version. Nothing here passes a version to `dotnet pack` - each package's
# version comes from bld/Versioning.props, which now runs two streams: Stable-tier packages ship at
# BoduBaseVersion and the Preview/Experimental tier ships at BoduPreviewVersion (set per project via
# BoduPackageVersionOverride, and reported in the build log). So a run tagged v1.0.0 publishes most
# packages at 1.0.0 and the preview set at its own lower version. Name the tag after BoduBaseVersion
# and check the pack log if you need the exact version a given package went out at.
# The private strong-name key is never stored in the repo: it is supplied as the base64-encoded
# BODU_SNK secret, decoded to a path outside the working tree for the duration of the job, and shredded
# afterwards. Real signing is opt-in here (BoduRealSign=true); ordinary CI builds stay public-signed.
#
# Required/optional secrets:
#   BODU_SNK        (required) base64 of the full private Bodu.snk strong-name key.
#
# Publishing uses nuget.org TRUSTED PUBLISHING (OIDC) - there is no stored push key. The job
# requests a short-lived (~1 hour) key from nuget.org via NuGet/login, which nuget.org issues only
# when the request's OIDC claims match the trusted-publishing policy: this repository, this
# workflow file, and the 'production' environment. Hence 'id-token: write' below and the
# environment on the job; changing either breaks the claim match and the exchange is refused.
# A run that does not opt in to publishing never performs the exchange, so a dry run needs no
# credential at all.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the packed packages to nuget.org.'
        type: boolean
        default: false
      packages:
        description: >-
          Optional space- or comma-separated package ids or wildcard patterns to publish instead of
          the whole manifest (e.g. "Bodu.Core Bodu.Numerics*"). An id must appear in
          bld/release-manifest.txt; a pattern (*, ?, [...]) is matched against the ids listed there
          and must match at least one. Leave empty to stage the full manifest. Ignored for tag
          runs, which always release the whole manifest, each package at the version
          bld/Versioning.props computes for it.
        type: string
        default: ''

permissions:
  contents: read
  id-token: write   # required for the trusted-publishing OIDC exchange (NuGet/login)

jobs:
  # ---------------------------------------------------------------------------------------------
  # Test gate. Nothing is signed, packed or published until the suite passes on the exact commit
  # being released. Deliberately a SEPARATE job so the release job - which holds the signing key
  # and the production environment - does not start at all on a red suite: no key is decoded, and
  # any environment approval is requested only once the commit has earned it.
  #
  # Runs the same discovery and the same tier as build-test.yml (test.runsettings = the full
  # regression tier), in Release, so the gate cannot pass on a configuration the release will not
  # ship.
  # ---------------------------------------------------------------------------------------------
  test:
    # Runs on both Ubuntu 24.04 and 26.04 while GitHub moves ubuntu-latest from one to the other,
    # gradually, between October 19 and November 19, 2026, so a release is gated on both. Drop
    # ubuntu-24.04 from the list once 26.04 has proven itself. fail-fast is off so a failure on one
    # image does not cancel the other, and the gate reports both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    # Deliberately NO job-level CONFIGURATION env. MSBuild reads environment variables as global
    # properties and property names are case-insensitive, so CONFIGURATION=Release silently becomes
    # Configuration=Release for every child process - including the nested `dotnet build` that
    # Bodu.Globalization.Calendar.Build.Test spawns over its fixture project. That test asserts the
    # compiled pack at bin/Debug/net8.0 (the nested build takes no -c and relies on the default),
    # so the leaked property moved the output to bin/Release and failed the test. Release runs 7 and
    # 8 both died here. Pass the configuration explicitly per step instead.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The .NET 10 SDK is the exact version global.json pins, so an SDK upgrade is a deliberate
          # change. The .NET 8 SDK beside it builds the Bodu.CodeStyle solution and runs the net8.0 legs.
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Pack Bodu.CodeStyle.XmlDocumentation analyzer (local feed)
        working-directory: Bodu.CodeStyle
        run: |
          dotnet pack Bodu.CodeStyle.XmlDocumentation/Bodu.CodeStyle.XmlDocumentation.csproj \
            --configuration Release \
            --output "${{ github.workspace }}/local-packages"

      - name: Discover test projects
        run: |
          # Derived from the solution, as in build-test.yml, so the gate follows projects being
          # added or removed without this workflow being edited.
          projects=$(grep -oE 'Path="[^"]*\.Test\.csproj"' bodu.slnx \
            | sed -E 's/^Path="//; s/"$//; s/\\/\//g' \
            | sort -u)

          if [ -z "$projects" ]; then
            echo "::error::No test projects discovered in bodu.slnx" >&2
            exit 1
          fi

          # Same module-presence guard build-test.yml carries: a regional pack silently dropped
          # from the solution would shrink the tested surface while the gate stayed green.
          missing=""
          for region in Africa Americas AsiaPacific Europe MiddleEast; do
            expected="Bodu.Globalization.Calendar.$region.Test.csproj"
            if ! echo "$projects" | grep -q "/$expected\$"; then
              missing="$missing $expected"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::Expected regional calendar test projects missing from bodu.slnx:$missing" >&2
            exit 1
          fi

          echo "Gating the release on $(echo "$projects" | wc -l) test project(s)."
          {
            echo 'TEST_PROJECTS<<EOF'
            echo "$projects"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Restore
        run: |
          for proj in $TEST_PROJECTS; do
            echo "::group::Restore $proj"
            dotnet restore "$proj"
            echo "::endgroup::"
          done

      - name: Build
        run: |
          # Warnings are errors, as in build-test.yml: a compiler or analyzer warning in the code being
          # released stops the release here, before anything is signed, packed or published. The pack
          # step treats warnings as errors as well, which also covers NuGet restore and pack warnings.
          for proj in $TEST_PROJECTS; do
            echo "::group::Build $proj"
            dotnet build "$proj" --configuration Release --no-restore -p:TreatWarningsAsErrors=true
            echo "::endgroup::"
          done

      - name: Test
        run: |
          # Every project is run even after one fails, so a release attempt reports the whole
          # picture rather than only the first break.
          #
          # Each project's outcome is recorded by name and exit code, and the failures are
          # restated at the end. A release gate has to survive its own logs: GitHub serves only
          # the tail of a long run, and a non-zero `dotnet test` does not always correspond to a
          # reported test failure - an aborted or crashed test host, or a run that discovers no
          # tests at all, exits non-zero with nothing named. Without this summary the only
          # evidence is "exit code 1" with the responsible project scrolled out of reach.
          #
          # The TRX logger takes LogFilePrefix, not LogFileName: every project runs once per
          # target framework, and with a fixed file name the second run overwrites the first's
          # TRX, so the uploaded record held only one framework's results. The prefix form writes
          # <name>_<framework>_<timestamp>.trx, one file per run.
          status=0
          failed=""

          for proj in $TEST_PROJECTS; do
            name=$(basename "$proj" .csproj)
            echo "::group::Test $name"
            rc=0
            dotnet test "$proj" \
              --configuration Release \
              --no-build \
              --settings test.runsettings \
              --results-directory "${{ github.workspace }}/TestResults/$name" \
              --logger "trx;LogFilePrefix=$name" \
              --logger "console;verbosity=normal" || rc=$?
            echo "::endgroup::"

            if [ "$rc" -ne 0 ]; then
              echo "::error::$name exited $rc"
              failed="$failed$name (exit $rc)%0A"
              status=$rc
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo "::error::Tests failed - refusing to pack or publish this commit. Projects:%0A$failed" >&2
            echo "### Release gate failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "These test projects exited non-zero. A project listed here with no failing test in" >> "$GITHUB_STEP_SUMMARY"
            echo "its TRX aborted or discovered no tests - check the uploaded \`release-test-results-trx-${{ matrix.os }}\` artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            printf '%s' "$failed" | sed 's/%0A/\n/g' | while IFS= read -r line; do
              [ -n "$line" ] && echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          exit $status

      # Uploaded even on success: the TRX is the only durable record of what the gate ran, and
      # GitHub serves only the tail of the console log.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results-trx-${{ matrix.os }}
          path: TestResults/**/*.trx
          retention-days: 14
          if-no-files-found: warn

  release:
    needs: test
    # Runs on one image, not the pair the test gate uses: this job signs, packs and publishes, so it
    # must run once. The label is named rather than ubuntu-latest so GitHub's move of that label to
    # 26.04 cannot change the image a release is built on. Switch it to ubuntu-26.04 when the gate
    # drops 24.04, and make a dry run on it before the next tag.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Named by the nuget.org trusted-publishing policy. The OIDC claim carries it, so the
    # exchange is refused if this is absent or renamed.
    environment: production

    env:
      CONFIGURATION: Release
      ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The .NET 10 SDK is the exact version global.json pins, so an SDK upgrade is a deliberate
          # change. The .NET 8 SDK beside it builds the Bodu.CodeStyle solution.
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Pack Bodu.CodeStyle.XmlDocumentation analyzer (local feed)
        working-directory: Bodu.CodeStyle
        run: |
          dotnet pack Bodu.CodeStyle.XmlDocumentation/Bodu.CodeStyle.XmlDocumentation.csproj \
            --configuration "$CONFIGURATION" \
            --output "${{ github.workspace }}/local-packages"

      - name: Guard - fail fast if the public key is misconfigured
        shell: bash
        run: |
          # Real signing produces strong-named assemblies whose retained cross-library
          # InternalsVisibleTo grants must carry the public key (BoduPublicKey). Refuse to publish a
          # half-configured release where signing is on but the public key is missing or stale.
          key=$(dotnet msbuild Bodu.Core/src/Bodu.Core.csproj -nologo -v:q \
            -getProperty:BoduPublicKey 2>/dev/null | tr -d '[:space:]' | tr 'A-F' 'a-f')
          if [ -z "$key" ]; then
            echo "::error::BoduPublicKey is empty in bld/Signing.props. Populate it (sn -tp bld/Bodu.public.snk) before releasing a signed build."
            exit 1
          fi

          # bld/Bodu.public.snk is a public-only key blob, so its raw bytes are exactly the
          # strong-name public key. Compare it to BoduPublicKey: if the hand-maintained hex string
          # has drifted from the committed key file, every InternalsVisibleTo grant would advertise a
          # public key the signed assemblies do not carry, and the build fails late with CS0281.
          filekey=$(od -An -v -t x1 bld/Bodu.public.snk | tr -d ' \n' | tr 'A-F' 'a-f')
          if [ "$key" != "$filekey" ]; then
            echo "::error::BoduPublicKey in bld/Signing.props does not match bld/Bodu.public.snk. Regenerate it with 'sn -tp bld/Bodu.public.snk' and update bld/Signing.props."
            echo "::error::BoduPublicKey   = $key"
            echo "::error::Bodu.public.snk = $filekey"
            exit 1
          fi
          echo "BoduPublicKey matches bld/Bodu.public.snk."

      - name: Decode strong-name private key
        shell: bash
        env:
          BODU_SNK: ${{ secrets.BODU_SNK }}
        run: |
          if [ -z "$BODU_SNK" ]; then
            echo "::error::Secret BODU_SNK is not set. Add the base64 of the private Bodu.snk key."
            exit 1
          fi
          printf '%s' "$BODU_SNK" | base64 -d > "$RUNNER_TEMP/Bodu.snk"
          # Sanity check: a valid .snk is non-empty binary.
          if [ ! -s "$RUNNER_TEMP/Bodu.snk" ]; then
            echo "::error::Decoded key is empty - BODU_SNK is not valid base64 of a .snk file."
            exit 1
          fi

      - name: Guard - verify the signing key matches the committed public key
        shell: bash
        run: |
          # The BODU_SNK secret is the full private key the assemblies are actually signed with; the
          # earlier guard only proved BoduPublicKey matches the committed public-only key file. Confirm
          # the secret is the private half of that same key pair, otherwise the signed assemblies would
          # carry a public key the InternalsVisibleTo grants never advertise (CS0281), and consumers
          # would receive packages signed under an unexpected identity.
          #
          # Both files are CAPI key blobs that store the RSA modulus in the clear, identical between a
          # key pair's private and public forms. bld/Bodu.public.snk is [12-byte strong-name header]
          # [PUBLICKEYBLOB]: bType 0x06 at offset 12, "RSA1" at 20, modulus at 32. The private blob is a
          # raw PRIVATEKEYBLOB: bType 0x07 at offset 0, "RSA2" at 8, modulus at 20. Compare the moduli.
          priv="$RUNNER_TEMP/Bodu.snk"
          btype=$(od -An -v -t x1 -N 1 "$priv" | tr -d ' \n')
          magic=$(od -An -v -t x1 -j 8 -N 4 "$priv" | tr -d ' \n')
          if [ "$btype" != "07" ] || [ "$magic" != "52534132" ]; then
            echo "::error::BODU_SNK is not a CAPI RSA private key blob (expected bType 0x07 and 'RSA2' magic). It must be the full private key produced by 'sn -k'."
            exit 1
          fi

          modlen=$(( $(stat -c%s bld/Bodu.public.snk) - 32 ))
          pubmod=$(od -An -v -t x1 -j 32 -N "$modlen" bld/Bodu.public.snk | tr -d ' \n')
          privmod=$(od -An -v -t x1 -j 20 -N "$modlen" "$priv" | tr -d ' \n')
          if [ "$pubmod" != "$privmod" ]; then
            echo "::error::The BODU_SNK signing key does not match bld/Bodu.public.snk - they are different key pairs. Update the secret and the committed public key together when rotating the strong-name key."
            exit 1
          fi
          echo "BODU_SNK matches bld/Bodu.public.snk."

      - name: Pack (real-signed, shipping)
        shell: bash
        run: |
          # Warnings are errors here too. The test job has already stopped the release on any compiler
          # or analyzer warning; this step also stops it on NuGet restore and pack warnings, a newly
          # published advisory for a dependency (NU1901-NU1904) among them. To release, update the
          # dependency, or suppress that one advisory with a NuGetAuditSuppress item giving the reason.
          dotnet pack bodu.slnx \
            --configuration "$CONFIGURATION" \
            --output "$ARTIFACTS_DIR" \
            -p:BoduSignAssembly=true \
            -p:BoduRealSign=true \
            -p:BoduStrongNameKeyFile="$RUNNER_TEMP/Bodu.snk" \
            -p:BoduShipping=true \
            -p:TreatWarningsAsErrors=true

      - name: Shred strong-name private key
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/Bodu.snk" ]; then
            shred -u "$RUNNER_TEMP/Bodu.snk" 2>/dev/null || rm -f "$RUNNER_TEMP/Bodu.snk"
          fi

      - name: Select shipping packages (bld/release-manifest.txt)
        shell: bash
        env:
          # Empty for tag runs: a tag releases the whole manifest at the tagged version.
          REQUESTED_PACKAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.packages || '' }}
        run: |
          # Pack builds every packable project in the solution, including waves that are not yet
          # released. Only packages listed in the shipping manifest are staged for publish;
          # everything else remains a build artifact only.
          #
          # A manual run may narrow that set further with the 'packages' input: exact ids, or wildcard
          # patterns matched against the manifest's ids. The subset is validated against the manifest
          # first, and an unknown id or a pattern matching no id fails the run: silently publishing a
          # different set than the operator asked for is the failure mode worth spending a build on,
          # because a nuget.org version cannot be withdrawn afterwards.
          PUBLISH_DIR="${{ github.workspace }}/publish"
          mkdir -p "$PUBLISH_DIR"
          shopt -s nullglob

          # Each manifest line is "<PackageId> <first-shipped-version>"; only the id is needed here.
          # The version records when a package first reached nuget.org and drives the package-validation
          # baseline in Directory.Build.targets, not what this run publishes.
          manifest_ids=()
          while IFS= read -r line; do
            mid="${line%%#*}"
            mid="$(printf '%s' "$mid" | tr -d '\r' | awk '{print $1}')"
            [ -n "$mid" ] && manifest_ids+=("$mid")
          done < bld/release-manifest.txt

          # Packages the manifest's comment block names as deliberately withheld, with each one's reason,
          # its wrapped comment lines joined. Requesting one of these is a different mistake from a typo -
          # the decision not to ship it was made on purpose and is recorded - so the error says which it
          # is, and the report of what was not published quotes the reason too.
          withheld_ids=(); withheld_reasons=()
          collecting=""
          while IFS= read -r line; do
            case "$line" in
              '#'*)
                stripped="$(printf '%s' "$line" | sed 's/^#[[:space:]]*//; s/[[:space:]]*$//')"
                if printf '%s' "$stripped" | grep -qE '^Bodu\.[A-Za-z0-9.]+$'; then
                  collecting="$stripped"; withheld_ids+=("$stripped"); withheld_reasons+=("")
                elif [ -n "$collecting" ] && [ -n "$stripped" ]; then
                  # Join the reason's wrapped comment lines; taking only the first truncates it mid-sentence.
                  last=$(( ${#withheld_reasons[@]} - 1 ))
                  if [ -z "${withheld_reasons[$last]}" ]; then
                    withheld_reasons[$last]="$stripped"
                  else
                    withheld_reasons[$last]="${withheld_reasons[$last]} $stripped"
                  fi
                fi
                ;;
              *) collecting="" ;;
            esac
          done < bld/release-manifest.txt

          # Split on commas and whitespace with pathname expansion off, so a wildcard reaches the
          # manifest match below intact. With it on, the unquoted split would match each word against
          # the checkout's file names instead: 'Bodu.*' would become every Bodu.* name in the
          # repository root.
          set -f
          # shellcheck disable=SC2206 # splitting is the intent, and globbing is off
          requested_ids=(${REQUESTED_PACKAGES//,/ })
          set +f

          # Adds a package to the selection once: a package named twice, or matched by both an id and
          # a pattern, is still staged once.
          select_id() {
            local sid
            for sid in "${selected_ids[@]}"; do
              [ "$sid" = "$1" ] && return 0
            done
            selected_ids+=("$1")
          }

          selected_ids=()
          if [ "${#requested_ids[@]}" -gt 0 ]; then
            bad=0
            for rid in "${requested_ids[@]}"; do
              # A wildcard pattern selects every manifest id it matches. It is matched against the
              # manifest only, never against files, so it cannot select a package the manifest does
              # not approve to ship, and one that matches nothing fails the run like an unknown id.
              case "$rid" in
                *[*?[]*)
                  matched=()
                  for mid in "${manifest_ids[@]}"; do
                    # shellcheck disable=SC2254 # rid is deliberately a pattern here
                    case "$mid" in $rid) matched+=("$mid") ;; esac
                  done
                  if [ "${#matched[@]}" -eq 0 ]; then
                    echo "::error::'$rid' matches no package id in bld/release-manifest.txt. A pattern is matched against the left-hand column of that file only, so it never selects a package the manifest does not list."
                    bad=1
                  else
                    echo "'$rid' matches ${#matched[@]} manifest package(s): ${matched[*]}"
                    for mid in "${matched[@]}"; do select_id "$mid"; done
                  fi
                  continue
                  ;;
              esac

              found=0
              for mid in "${manifest_ids[@]}"; do
                [ "$rid" = "$mid" ] && { found=1; break; }
              done
              if [ "$found" -eq 1 ]; then
                select_id "$rid"
                continue
              fi

              bad=1

              # Withheld on purpose: quote the manifest's own reason.
              reason=""
              for i in "${!withheld_ids[@]}"; do
                [ "$rid" = "${withheld_ids[$i]}" ] && { reason="${withheld_reasons[$i]}"; break; }
              done
              if [ -n "$reason" ]; then
                echo "::error::'$rid' is deliberately withheld from nuget.org, not missing. $reason  --  To ship it, add it to bld/release-manifest.txt with its first-shipped version - that edit is the decision."
                continue
              fi

              # Packs, but has not been approved to ship. The pack ran before this step, so the
              # artifacts directory is an accurate answer to "is this a package at all?".
              shopt -s nullglob
              built=("$ARTIFACTS_DIR/$rid".[0-9]*.nupkg)
              shopt -u nullglob
              if [ "${#built[@]}" -gt 0 ]; then
                echo "::error::'$rid' is built by this solution but is not in bld/release-manifest.txt, so it is not approved to ship. Add it to the manifest with the version it first ships at, or drop it from the packages input."
              else
                echo "::error::'$rid' is not a package this build produces - it may be a test or infrastructure project (IsPackable=false), a directory name rather than a package id, or a typo. Package ids are the left-hand column of bld/release-manifest.txt."
              fi
            done
            if [ "$bad" -ne 0 ]; then
              echo "::error::Nothing was published. The 'packages' input selects a SUBSET of the manifest - for a full release leave it EMPTY and all ${#manifest_ids[@]} manifest packages are staged. A tag run (v<version>) ignores this input entirely and always releases the whole manifest."
              exit 1
            fi
            echo "Subset requested: publishing ${#selected_ids[@]} of ${#manifest_ids[@]} manifest package(s)."
          else
            selected_ids=("${manifest_ids[@]}")
            echo "No subset requested: staging the full manifest (${#selected_ids[@]} packages)."
          fi

          fail=0; count=0
          for id in "${selected_ids[@]}"; do
            count=$((count + 1))
            # The [0-9] guard stops 'Bodu.Numerics' also matching 'Bodu.Numerics.Serialization.Json'.
            pkgs=("$ARTIFACTS_DIR/$id".[0-9]*.nupkg)
            if [ "${#pkgs[@]}" -ne 1 ]; then
              echo "::error::Manifest entry '$id' matched ${#pkgs[@]} nupkg(s) in $ARTIFACTS_DIR (expected exactly 1)."
              fail=1; continue
            fi
            snupkg="${pkgs[0]%.nupkg}.snupkg"
            if [ ! -f "$snupkg" ]; then
              echo "::error::Symbol package missing for '$id': $snupkg"
              fail=1; continue
            fi
            cp "${pkgs[0]}" "$snupkg" "$PUBLISH_DIR/"
          done
          [ "$fail" -eq 0 ] || exit 1
          staged=$(ls "$PUBLISH_DIR"/*.nupkg | wc -l)
          if [ "$staged" -ne "$count" ]; then
            echo "::error::Staged $staged packages but $count were selected."
            exit 1
          fi
          echo "Staged $staged package(s) for publish:"
          ls -1 "$PUBLISH_DIR"/*.nupkg

          # Every packed package that was not staged, grouped by why: a subset run leaves manifest
          # packages unselected, the manifest withholds some on purpose, and anything else is not in the
          # manifest at all. A file is matched to an id as the staging loop matches it, so that
          # 'Bodu.Numerics' does not claim 'Bodu.Numerics.Serialization.Json'.
          not_selected=(); withheld=(); unlisted=()
          for f in "$ARTIFACTS_DIR"/*.nupkg; do
            name="$(basename "$f")"
            [ -f "$PUBLISH_DIR/$name" ] && continue
            group=unlisted
            for mid in "${manifest_ids[@]}"; do
              case "$name" in "$mid".[0-9]*.nupkg) group=not_selected; break ;; esac
            done
            if [ "$group" = unlisted ]; then
              for i in "${!withheld_ids[@]}"; do
                case "$name" in "${withheld_ids[$i]}".[0-9]*.nupkg) group=withheld; wi=$i; break ;; esac
              done
            fi
            case "$group" in
              not_selected) not_selected+=("$name") ;;
              withheld) withheld+=("$wi $name") ;;
              *) unlisted+=("$name") ;;
            esac
          done
          if [ "${#not_selected[@]}" -gt 0 ]; then
            echo "Packed but NOT published (${#not_selected[@]} in the shipping manifest but not selected by the 'packages' input):"
            printf '  %s\n' "${not_selected[@]}"
          fi
          if [ "${#withheld[@]}" -gt 0 ]; then
            echo "Packed but NOT published (${#withheld[@]} withheld from nuget.org by bld/release-manifest.txt):"
            # In the manifest's order, with its reason, since a reason may refer to the entry before it.
            while read -r wi name; do
              echo "  $name"
              if [ -n "${withheld_reasons[$wi]}" ]; then echo "      ${withheld_reasons[$wi]}"; fi
            done < <(printf '%s\n' "${withheld[@]}" | sort -s -n -k1,1)
          fi
          if [ "${#unlisted[@]}" -gt 0 ]; then
            echo "Packed but NOT published (${#unlisted[@]} not in the shipping manifest):"
            printf '  %s\n' "${unlisted[@]}"
          fi
          echo "PUBLISH_DIR=$PUBLISH_DIR" >> "$GITHUB_ENV"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ${{ env.ARTIFACTS_DIR }}/*.nupkg
            ${{ env.ARTIFACTS_DIR }}/*.snupkg
          retention-days: 30
          if-no-files-found: error

      - name: Upload publish-set artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-publish
          path: |
            ${{ env.PUBLISH_DIR }}/*.nupkg
            ${{ env.PUBLISH_DIR }}/*.snupkg
          retention-days: 90
          if-no-files-found: error

      - name: Check nuget.org for versions already published
        # Runs in a dry run too, so the dry run shows ahead of a tag what a publish run would push,
        # skip or refuse. A publish run that would publish nothing stops here, before a key is
        # requested.
        shell: bash
        env:
          PUBLISHING: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          # nuget.org never accepts a version twice, and the push passes --skip-duplicate, so a
          # staged version nuget.org already holds is skipped rather than failing. That is how a
          # lock-step release leaves a stream it did not bump unchanged, and how a re-run finishes a
          # partial publish. It also lets a release whose versions were never bumped skip every
          # package and still report success, so each staged package is looked up first. A version
          # nuget.org holds from the commit being released was pushed by an earlier attempt; one
          # from any other commit belongs to an earlier release.
          new=(); this_commit=(); earlier=(); unchecked=()
          misses=0
          for nupkg in "$PUBLISH_DIR"/*.nupkg; do
            nuspec="$(unzip -p "$nupkg" '*.nuspec' || true)"
            id="$(sed -n '/<id>/{s:.*<id>\(.*\)</id>.*:\1:p;q}' <<< "$nuspec")"
            version="$(sed -n '/<version>/{s:.*<version>\(.*\)</version>.*:\1:p;q}' <<< "$nuspec")"
            if [ -z "$id" ] || [ -z "$version" ]; then
              unchecked+=("$(basename "$nupkg") (no id or version in its nuspec)")
              continue
            fi
            # nuget.org addresses a version without its build metadata, in lower case.
            lookup_version="${version%%+*}"

            # Three failed lookups in a row mean nuget.org is not answering; waiting out every
            # remaining lookup's timeout would only run into the job's.
            if [ "$misses" -ge 3 ]; then
              unchecked+=("$id $version (not looked up after three lookups in a row failed)")
              continue
            fi

            # The flat container serves the nuspec of every version nuget.org holds, listed or not,
            # and 404 for a version it does not. The nuspec records the commit the package was
            # built from.
            status="$(curl -sS --connect-timeout 10 --max-time 30 --retry 2 -o "$RUNNER_TEMP/published.nuspec" -w '%{http_code}' \
              "https://api.nuget.org/v3-flatcontainer/${id,,}/${lookup_version,,}/${id,,}.nuspec" || true)"
            case "$status" in
              404)
                misses=0
                new+=("$id $version")
                ;;
              200)
                misses=0
                commit="$(sed -n '/<repository /{s:.* commit="\([0-9a-f]*\)".*:\1:p;q}' "$RUNNER_TEMP/published.nuspec")"
                if [ -n "$commit" ] && [ "$commit" = "$RELEASE_COMMIT" ]; then
                  this_commit+=("$id $version")
                else
                  short="${commit:0:7}"
                  earlier+=("$id $version (built from ${short:-an unrecorded commit})")
                fi
                ;;
              *)
                misses=$((misses + 1))
                if [ "${status:-000}" = 000 ]; then reason="no response"; else reason="HTTP $status"; fi
                unchecked+=("$id $version ($reason from nuget.org)")
                ;;
            esac
          done

          # Prints one group of the breakdown: a heading with its count, then one line per package.
          report() {
            local heading="$1" item
            shift
            echo "$heading: $#"
            for item in "$@"; do
              echo "  $item"
            done
          }

          # Formats a list for an annotation: the first five items, then how many more the log lists.
          summarize() {
            local text
            text="$(printf '%s, ' "${@:1:5}")"
            text="${text%, }"
            if [ "$#" -gt 5 ]; then
              text="$text, and $(( $# - 5 )) more listed in the log"
            fi
            printf '%s' "$text"
          }

          report "Not yet on nuget.org, so the push publishes them" "${new[@]}"
          report "On nuget.org from this commit, pushed by an earlier attempt; the push skips them" "${this_commit[@]}"
          report "On nuget.org from an earlier release; the push skips them" "${earlier[@]}"
          report "Could not be checked" "${unchecked[@]}"

          if [ "$PUBLISHING" = true ]; then
            level=error; outcome="Nothing was pushed."
          else
            level=warning; outcome="A publish run would stop here."
          fi

          # Nothing new, and nothing already pushed from this commit: the release would publish
          # nothing, or this run cannot tell whether it would.
          if [ "${#new[@]}" -eq 0 ] && [ "${#this_commit[@]}" -eq 0 ]; then
            if [ "${#unchecked[@]}" -eq 0 ]; then
              echo "::$level::Every staged package is already on nuget.org at the version this run built, from an earlier release, so this release would publish nothing. $outcome Bump BoduBaseVersion or BoduPreviewVersion in bld/Versioning.props, or a package's BoduPackageVersionOverride, and release again."
            else
              echo "::$level::No staged package could be confirmed as new on nuget.org, because ${#unchecked[@]} could not be checked: $(summarize "${unchecked[@]}"). $outcome Re-run once they can be checked."
            fi
            if [ "$PUBLISHING" = true ]; then
              exit 1
            fi
            exit 0
          fi

          if [ "${#earlier[@]}" -gt 0 ]; then
            echo "::notice::${#earlier[@]} staged package(s) are already on nuget.org at the version this run built, so the push skips them: $(summarize "${earlier[@]}")."
          fi
          if [ "${#unchecked[@]}" -gt 0 ]; then
            echo "::warning::${#unchecked[@]} staged package(s) could not be checked against nuget.org: $(summarize "${unchecked[@]}"). The push still pushes them and skips any that nuget.org already holds."
          fi

      # Exchanges this run's GitHub OIDC token for a short-lived nuget.org API key. Runs only when
      # the job will actually publish, so a dry run never mints a credential.
      - name: Acquire a short-lived nuget.org key (trusted publishing)
        id: nuget-login
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        uses: NuGet/login@v1
        with:
          user: bodu

      - name: Publish to nuget.org
        # Publish on a tag release, or a manual run that opted in.
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Trusted publishing returned no key. Check that the nuget.org policy names this repository, this workflow file, and the 'production' environment, and that the job has id-token: write."
            exit 1
          fi

          # --skip-duplicate skips a version nuget.org already holds: a stream this release did not
          # bump, or a package an earlier attempt pushed. The check before the key was requested
          # listed those, and stopped the run if nothing here was new.
          expected=$(ls "$PUBLISH_DIR"/*.nupkg | wc -l)
          echo "Pushing $expected package(s) to nuget.org."
          dotnet nuget push "$PUBLISH_DIR"/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
