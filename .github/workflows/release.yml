name: Release

# Builds, strong-name (real) signs, packs, and optionally publishes the Bodu packages.
#
# The whole solution is packed, but only packages listed in the shipping manifest
# (bld/release-manifest.txt) are staged and pushed to nuget.org — packages for waves that have not
# been released yet are produced as build artifacts only. See bld/RELEASING.md for the release model.
#
# Triggered for a release by pushing a version tag (e.g. v1.0.0), or manually via the Actions tab.
# The private strong-name key is never stored in the repo: it is supplied as the base64-encoded
# BODU_SNK secret, decoded to a path outside the working tree for the duration of the job, and shredded
# afterwards. Real signing is opt-in here (BoduRealSign=true); ordinary CI builds stay public-signed.
#
# Required/optional secrets:
#   BODU_SNK        (required) base64 of the full private Bodu.snk strong-name key.
#
# Publishing uses nuget.org TRUSTED PUBLISHING (OIDC) - there is no stored push key. The job
# requests a short-lived (~1 hour) key from nuget.org via NuGet/login, which nuget.org issues only
# when the request's OIDC claims match the trusted-publishing policy: this repository, this
# workflow file, and the 'production' environment. Hence 'id-token: write' below and the
# environment on the job; changing either breaks the claim match and the exchange is refused.
# A run that does not opt in to publishing never performs the exchange, so a dry run needs no
# credential at all.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the packed packages to nuget.org.'
        type: boolean
        default: false
      packages:
        description: >-
          Optional space- or comma-separated package ids to publish instead of the whole manifest
          (e.g. "Bodu.Core Bodu.IO.Biff"). Every id must appear in bld/release-manifest.txt.
          Leave empty to stage the full manifest. Ignored for tag runs, which always release the
          whole manifest at the tagged version.
        type: string
        default: ''

permissions:
  contents: read
  id-token: write   # required for the trusted-publishing OIDC exchange (NuGet/login)

jobs:
  # ---------------------------------------------------------------------------------------------
  # Test gate. Nothing is signed, packed or published until the suite passes on the exact commit
  # being released. Deliberately a SEPARATE job so the release job - which holds the signing key
  # and the production environment - does not start at all on a red suite: no key is decoded, and
  # any environment approval is requested only once the commit has earned it.
  #
  # Runs the same discovery and the same tier as build-test.yml (test.runsettings = the full
  # regression tier), in Release, so the gate cannot pass on a configuration the release will not
  # ship.
  # ---------------------------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Deliberately NO job-level CONFIGURATION env. MSBuild reads environment variables as global
    # properties and property names are case-insensitive, so CONFIGURATION=Release silently becomes
    # Configuration=Release for every child process - including the nested `dotnet build` that
    # Bodu.Globalization.Calendar.Build.Test spawns over its fixture project. That test asserts the
    # compiled pack at bin/Debug/net8.0 (the nested build takes no -c and relies on the default),
    # so the leaked property moved the output to bin/Release and failed the test. Release runs 7 and
    # 8 both died here. Pass the configuration explicitly per step instead.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack Bodu.CodeStyle.XmlDocumentation analyzer (local feed)
        working-directory: Bodu.CodeStyle
        run: |
          dotnet pack Bodu.CodeStyle.XmlDocumentation/Bodu.CodeStyle.XmlDocumentation.csproj \
            --configuration Release \
            --output "${{ github.workspace }}/local-packages"

      - name: Discover test projects
        run: |
          # Derived from the solution, as in build-test.yml, so the gate follows projects being
          # added or removed without this workflow being edited.
          projects=$(grep -oE 'Path="[^"]*\.Test\.csproj"' bodu.slnx \
            | sed -E 's/^Path="//; s/"$//; s/\\/\//g' \
            | sort -u)

          if [ -z "$projects" ]; then
            echo "::error::No test projects discovered in bodu.slnx" >&2
            exit 1
          fi

          # Same module-presence guard build-test.yml carries: a regional pack silently dropped
          # from the solution would shrink the tested surface while the gate stayed green.
          missing=""
          for region in Africa Americas AsiaPacific Europe MiddleEast; do
            expected="Bodu.Globalization.Calendar.$region.Test.csproj"
            if ! echo "$projects" | grep -q "/$expected\$"; then
              missing="$missing $expected"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::Expected regional calendar test projects missing from bodu.slnx:$missing" >&2
            exit 1
          fi

          echo "Gating the release on $(echo "$projects" | wc -l) test project(s)."
          {
            echo 'TEST_PROJECTS<<EOF'
            echo "$projects"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Restore
        run: |
          for proj in $TEST_PROJECTS; do
            echo "::group::Restore $proj"
            dotnet restore "$proj"
            echo "::endgroup::"
          done

      - name: Build
        run: |
          for proj in $TEST_PROJECTS; do
            echo "::group::Build $proj"
            dotnet build "$proj" --configuration Release --no-restore
            echo "::endgroup::"
          done

      - name: Test
        run: |
          # Every project is run even after one fails, so a release attempt reports the whole
          # picture rather than only the first break.
          #
          # Each project's outcome is recorded by name and exit code, and the failures are
          # restated at the end. A release gate has to survive its own logs: GitHub serves only
          # the tail of a long run, and a non-zero `dotnet test` does not always correspond to a
          # reported test failure - an aborted or crashed test host, or a run that discovers no
          # tests at all, exits non-zero with nothing named. Without this summary the only
          # evidence is "exit code 1" with the responsible project scrolled out of reach.
          status=0
          failed=""

          for proj in $TEST_PROJECTS; do
            name=$(basename "$proj" .csproj)
            echo "::group::Test $name"
            rc=0
            dotnet test "$proj" \
              --configuration Release \
              --no-build \
              --settings test.runsettings \
              --results-directory "${{ github.workspace }}/TestResults/$name" \
              --logger "trx;LogFileName=$name.trx" \
              --logger "console;verbosity=normal" || rc=$?
            echo "::endgroup::"

            if [ "$rc" -ne 0 ]; then
              echo "::error::$name exited $rc"
              failed="$failed$name (exit $rc)%0A"
              status=$rc
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo "::error::Tests failed - refusing to pack or publish this commit. Projects:%0A$failed" >&2
            echo "### Release gate failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "These test projects exited non-zero. A project listed here with no failing test in" >> "$GITHUB_STEP_SUMMARY"
            echo "its TRX aborted or discovered no tests - check the uploaded \`release-test-results-trx\` artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            printf '%s' "$failed" | sed 's/%0A/\n/g' | while IFS= read -r line; do
              [ -n "$line" ] && echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          exit $status

      # Uploaded even on success: the TRX is the only durable record of what the gate ran, and
      # GitHub serves only the tail of the console log.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results-trx
          path: TestResults/**/*.trx
          retention-days: 14
          if-no-files-found: warn

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Named by the nuget.org trusted-publishing policy. The OIDC claim carries it, so the
    # exchange is refused if this is absent or renamed.
    environment: production

    env:
      CONFIGURATION: Release
      ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack Bodu.CodeStyle.XmlDocumentation analyzer (local feed)
        working-directory: Bodu.CodeStyle
        run: |
          dotnet pack Bodu.CodeStyle.XmlDocumentation/Bodu.CodeStyle.XmlDocumentation.csproj \
            --configuration "$CONFIGURATION" \
            --output "${{ github.workspace }}/local-packages"

      - name: Guard — fail fast if the public key is misconfigured
        shell: bash
        run: |
          # Real signing produces strong-named assemblies whose retained cross-library
          # InternalsVisibleTo grants must carry the public key (BoduPublicKey). Refuse to publish a
          # half-configured release where signing is on but the public key is missing or stale.
          key=$(dotnet msbuild Bodu.Core/src/Bodu.Core.csproj -nologo -v:q \
            -getProperty:BoduPublicKey 2>/dev/null | tr -d '[:space:]' | tr 'A-F' 'a-f')
          if [ -z "$key" ]; then
            echo "::error::BoduPublicKey is empty in bld/Signing.props. Populate it (sn -tp bld/Bodu.public.snk) before releasing a signed build."
            exit 1
          fi

          # bld/Bodu.public.snk is a public-only key blob, so its raw bytes are exactly the
          # strong-name public key. Compare it to BoduPublicKey: if the hand-maintained hex string
          # has drifted from the committed key file, every InternalsVisibleTo grant would advertise a
          # public key the signed assemblies do not carry, and the build fails late with CS0281.
          filekey=$(od -An -v -t x1 bld/Bodu.public.snk | tr -d ' \n' | tr 'A-F' 'a-f')
          if [ "$key" != "$filekey" ]; then
            echo "::error::BoduPublicKey in bld/Signing.props does not match bld/Bodu.public.snk. Regenerate it with 'sn -tp bld/Bodu.public.snk' and update bld/Signing.props."
            echo "::error::BoduPublicKey   = $key"
            echo "::error::Bodu.public.snk = $filekey"
            exit 1
          fi
          echo "BoduPublicKey matches bld/Bodu.public.snk."

      - name: Decode strong-name private key
        shell: bash
        env:
          BODU_SNK: ${{ secrets.BODU_SNK }}
        run: |
          if [ -z "$BODU_SNK" ]; then
            echo "::error::Secret BODU_SNK is not set. Add the base64 of the private Bodu.snk key."
            exit 1
          fi
          printf '%s' "$BODU_SNK" | base64 -d > "$RUNNER_TEMP/Bodu.snk"
          # Sanity check: a valid .snk is non-empty binary.
          if [ ! -s "$RUNNER_TEMP/Bodu.snk" ]; then
            echo "::error::Decoded key is empty — BODU_SNK is not valid base64 of a .snk file."
            exit 1
          fi

      - name: Guard — verify the signing key matches the committed public key
        shell: bash
        run: |
          # The BODU_SNK secret is the full private key the assemblies are actually signed with; the
          # earlier guard only proved BoduPublicKey matches the committed public-only key file. Confirm
          # the secret is the private half of that same key pair, otherwise the signed assemblies would
          # carry a public key the InternalsVisibleTo grants never advertise (CS0281), and consumers
          # would receive packages signed under an unexpected identity.
          #
          # Both files are CAPI key blobs that store the RSA modulus in the clear, identical between a
          # key pair's private and public forms. bld/Bodu.public.snk is [12-byte strong-name header]
          # [PUBLICKEYBLOB]: bType 0x06 at offset 12, "RSA1" at 20, modulus at 32. The private blob is a
          # raw PRIVATEKEYBLOB: bType 0x07 at offset 0, "RSA2" at 8, modulus at 20. Compare the moduli.
          priv="$RUNNER_TEMP/Bodu.snk"
          btype=$(od -An -v -t x1 -N 1 "$priv" | tr -d ' \n')
          magic=$(od -An -v -t x1 -j 8 -N 4 "$priv" | tr -d ' \n')
          if [ "$btype" != "07" ] || [ "$magic" != "52534132" ]; then
            echo "::error::BODU_SNK is not a CAPI RSA private key blob (expected bType 0x07 and 'RSA2' magic). It must be the full private key produced by 'sn -k'."
            exit 1
          fi

          modlen=$(( $(stat -c%s bld/Bodu.public.snk) - 32 ))
          pubmod=$(od -An -v -t x1 -j 32 -N "$modlen" bld/Bodu.public.snk | tr -d ' \n')
          privmod=$(od -An -v -t x1 -j 20 -N "$modlen" "$priv" | tr -d ' \n')
          if [ "$pubmod" != "$privmod" ]; then
            echo "::error::The BODU_SNK signing key does not match bld/Bodu.public.snk — they are different key pairs. Update the secret and the committed public key together when rotating the strong-name key."
            exit 1
          fi
          echo "BODU_SNK matches bld/Bodu.public.snk."

      - name: Pack (real-signed, shipping)
        shell: bash
        run: |
          dotnet pack bodu.slnx \
            --configuration "$CONFIGURATION" \
            --output "$ARTIFACTS_DIR" \
            -p:BoduSignAssembly=true \
            -p:BoduRealSign=true \
            -p:BoduStrongNameKeyFile="$RUNNER_TEMP/Bodu.snk" \
            -p:BoduShipping=true

      - name: Shred strong-name private key
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/Bodu.snk" ]; then
            shred -u "$RUNNER_TEMP/Bodu.snk" 2>/dev/null || rm -f "$RUNNER_TEMP/Bodu.snk"
          fi

      - name: Select shipping packages (bld/release-manifest.txt)
        shell: bash
        env:
          # Empty for tag runs: a tag releases the whole manifest at the tagged version.
          REQUESTED_PACKAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.packages || '' }}
        run: |
          # Pack builds every packable project in the solution, including waves that are not yet
          # released. Only packages listed in the shipping manifest are staged for publish;
          # everything else remains a build artifact only.
          #
          # A manual run may narrow that set further with the 'packages' input. The subset is
          # validated against the manifest first and an unknown id fails the run: silently
          # publishing a different set than the operator asked for is the failure mode worth
          # spending a build on, because a nuget.org version cannot be withdrawn afterwards.
          PUBLISH_DIR="${{ github.workspace }}/publish"
          mkdir -p "$PUBLISH_DIR"
          shopt -s nullglob

          # Each manifest line is "<PackageId> <first-shipped-version>"; only the id is needed here.
          # The version records when a package first reached nuget.org and drives the package-validation
          # baseline in Directory.Build.targets, not what this run publishes.
          manifest_ids=()
          while IFS= read -r line; do
            mid="${line%%#*}"
            mid="$(printf '%s' "$mid" | tr -d '\r' | awk '{print $1}')"
            [ -n "$mid" ] && manifest_ids+=("$mid")
          done < bld/release-manifest.txt

          # Packages the manifest's comment block names as deliberately withheld, with the first line
          # of each reason. Requesting one of these is a different mistake from a typo - the decision
          # not to ship it was made on purpose and is recorded - so the error says which it is.
          withheld_ids=(); withheld_reasons=()
          collecting=""
          while IFS= read -r line; do
            case "$line" in
              '#'*)
                stripped="$(printf '%s' "$line" | sed 's/^#[[:space:]]*//; s/[[:space:]]*$//')"
                if printf '%s' "$stripped" | grep -qE '^Bodu\.[A-Za-z0-9.]+$'; then
                  collecting="$stripped"; withheld_ids+=("$stripped"); withheld_reasons+=("")
                elif [ -n "$collecting" ] && [ -n "$stripped" ]; then
                  # Join the reason's wrapped comment lines; taking only the first truncates it mid-sentence.
                  last=$(( ${#withheld_reasons[@]} - 1 ))
                  if [ -z "${withheld_reasons[$last]}" ]; then
                    withheld_reasons[$last]="$stripped"
                  else
                    withheld_reasons[$last]="${withheld_reasons[$last]} $stripped"
                  fi
                fi
                ;;
              *) collecting="" ;;
            esac
          done < bld/release-manifest.txt

          requested="${REQUESTED_PACKAGES//,/ }"
          selected_ids=()
          if [ -n "${requested// /}" ]; then
            bad=0
            for rid in $requested; do
              found=0
              for mid in "${manifest_ids[@]}"; do
                [ "$rid" = "$mid" ] && { found=1; break; }
              done
              if [ "$found" -eq 1 ]; then
                selected_ids+=("$rid")
                continue
              fi

              bad=1

              # Withheld on purpose: quote the manifest's own reason.
              reason=""
              for i in "${!withheld_ids[@]}"; do
                [ "$rid" = "${withheld_ids[$i]}" ] && { reason="${withheld_reasons[$i]}"; break; }
              done
              if [ -n "$reason" ]; then
                echo "::error::'$rid' is deliberately withheld from nuget.org, not missing. $reason  --  To ship it, add it to bld/release-manifest.txt with its first-shipped version - that edit is the decision."
                continue
              fi

              # Packs, but has not been approved to ship. The pack ran before this step, so the
              # artifacts directory is an accurate answer to "is this a package at all?".
              shopt -s nullglob
              built=("$ARTIFACTS_DIR/$rid".[0-9]*.nupkg)
              shopt -u nullglob
              if [ "${#built[@]}" -gt 0 ]; then
                echo "::error::'$rid' is built by this solution but is not in bld/release-manifest.txt, so it is not approved to ship. Add it to the manifest with the version it first ships at, or drop it from the packages input."
              else
                echo "::error::'$rid' is not a package this build produces - it may be a test or infrastructure project (IsPackable=false), a directory name rather than a package id, or a typo. Package ids are the left-hand column of bld/release-manifest.txt."
              fi
            done
            if [ "$bad" -ne 0 ]; then
              echo "::error::Nothing was published. The 'packages' input selects a SUBSET of the manifest - for a full release leave it EMPTY and all ${#manifest_ids[@]} manifest packages are staged. A tag run (v<version>) ignores this input entirely and always releases the whole manifest."
              exit 1
            fi
            echo "Subset requested: publishing ${#selected_ids[@]} of ${#manifest_ids[@]} manifest package(s)."
          else
            selected_ids=("${manifest_ids[@]}")
            echo "No subset requested: staging the full manifest (${#selected_ids[@]} packages)."
          fi

          fail=0; count=0
          for id in "${selected_ids[@]}"; do
            count=$((count + 1))
            # The [0-9] guard stops 'Bodu.Numerics' also matching 'Bodu.Numerics.Serialization.Json'.
            pkgs=("$ARTIFACTS_DIR/$id".[0-9]*.nupkg)
            if [ "${#pkgs[@]}" -ne 1 ]; then
              echo "::error::Manifest entry '$id' matched ${#pkgs[@]} nupkg(s) in $ARTIFACTS_DIR (expected exactly 1)."
              fail=1; continue
            fi
            snupkg="${pkgs[0]%.nupkg}.snupkg"
            if [ ! -f "$snupkg" ]; then
              echo "::error::Symbol package missing for '$id': $snupkg"
              fail=1; continue
            fi
            cp "${pkgs[0]}" "$snupkg" "$PUBLISH_DIR/"
          done
          [ "$fail" -eq 0 ] || exit 1
          staged=$(ls "$PUBLISH_DIR"/*.nupkg | wc -l)
          if [ "$staged" -ne "$count" ]; then
            echo "::error::Staged $staged packages but $count were selected."
            exit 1
          fi
          echo "Staged $staged package(s) for publish:"
          ls -1 "$PUBLISH_DIR"/*.nupkg
          echo "Packed but NOT published (not in the shipping manifest):"
          for f in "$ARTIFACTS_DIR"/*.nupkg; do
            [ -f "$PUBLISH_DIR/$(basename "$f")" ] || echo "  $(basename "$f")"
          done
          echo "PUBLISH_DIR=$PUBLISH_DIR" >> "$GITHUB_ENV"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ${{ env.ARTIFACTS_DIR }}/*.nupkg
            ${{ env.ARTIFACTS_DIR }}/*.snupkg
          retention-days: 30
          if-no-files-found: error

      - name: Upload publish-set artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-publish
          path: |
            ${{ env.PUBLISH_DIR }}/*.nupkg
            ${{ env.PUBLISH_DIR }}/*.snupkg
          retention-days: 90
          if-no-files-found: error

      # Exchanges this run's GitHub OIDC token for a short-lived nuget.org API key. Runs only when
      # the job will actually publish, so a dry run never mints a credential.
      - name: Acquire a short-lived nuget.org key (trusted publishing)
        id: nuget-login
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        uses: NuGet/login@v1
        with:
          user: bodu

      - name: Publish to nuget.org
        # Publish on a tag release, or a manual run that opted in.
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Trusted publishing returned no key. Check that the nuget.org policy names this repository, this workflow file, and the 'production' environment, and that the job has id-token: write."
            exit 1
          fi

          # --skip-duplicate keeps a re-run idempotent, but it also means an already-published
          # version is reported as skipped rather than failing. Count what actually pushed so a
          # scope or policy problem cannot masquerade as a clean release.
          expected=$(ls "$PUBLISH_DIR"/*.nupkg | wc -l)
          echo "Pushing $expected package(s) to nuget.org."
          dotnet nuget push "$PUBLISH_DIR"/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
