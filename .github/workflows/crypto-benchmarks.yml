name: Cryptography benchmarks

# Measures Bodu.Security.Cryptography's kernels on hosted hardware this repository cannot otherwise measure, and
# uploads the results. It is not a test: nothing fails on the numbers, which plans/crypto-performance-followups.md
# records (F7).
#
#   • ARM64: GitHub's hosted Linux runner (Arm Neoverse) and its macOS runner (Apple silicon). Every AdvSimd kernel,
#     the PMULL GHASH and POLYVAL kernels, and the umulh products run here and nowhere else in CI, where the
#     build-test job proves them correct but does not time them.
#   • A hosted x64 runner whose last-level cache is smaller than one 64 MiB Argon2 matrix, for Argon2's thread
#     heuristic, which was tuned on a machine whose cache holds the whole matrix. The pool mixes an AMD EPYC with AVX2
#     and an Intel Xeon with AVX-512, so it also times the x64 kernels that spread one state across a vector's lanes
#     (BLAKE2, BLAKE3's single block, scrypt, Argon2) where the common desktop runs them: the AVX2 kernels, with
#     AVX-512 switched off, and the SSSE3 ones, with AVX2 switched off.
#
# Each machine builds the benchmarks from this checkout and against the published 1.0.0 package, then runs every
# suite in its configurations, alternating their order from run to run: the kernels dispatch selects, the same build
# with the library's DisableSimd switch set (its scalar paths), and 1.0.0, with the x64 suite also run with AVX-512 off
# and with AVX2 off.
# harness_matrix.py describes the suites and prints the comparison into the job summary.
#
# It runs on manual dispatch, and on a pull request that changes this file or harness_matrix.py, the script it runs,
# so a change to either is exercised before it merges.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Runs of each configuration (two or more give ranges)'
        default: '2'
  pull_request:
    paths:
      - '.github/workflows/crypto-benchmarks.yml'
      - 'Bodu.Security.Cryptography/bench/harness_matrix.py'

permissions:
  contents: read

concurrency:
  group: crypto-benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    strategy:
      fail-fast: false
      matrix:
        # TEMPORARY (#760): eight x64 runners timing Argon2's kernels, to draw processors with AVX-512. Reverted after the run.
        include:
          - os: ubuntu-24.04
            suites: argon2-kernels
            shard: 1
          - os: ubuntu-24.04
            suites: argon2-kernels
            shard: 2
          - os: ubuntu-24.04
            suites: argon2-kernels
            shard: 3
          - os: ubuntu-24.04
            suites: argon2-kernels
            shard: 4
          - os: ubuntu-24.04
            suites: argon2-kernels
            shard: 5
          - os: ubuntu-24.04
            suites: argon2-kernels
            shard: 6
          - os: ubuntu-24.04
            suites: argon2-kernels
            shard: 7
          - os: ubuntu-24.04
            suites: argon2-kernels
            shard: 8
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The .NET 10 SDK global.json pins, and the .NET 8 SDK beside it for the Bodu.CodeStyle solution and the
          # net8.0 runs.
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Pack Bodu.CodeStyle.XmlDocumentation analyzer (local feed)
        working-directory: Bodu.CodeStyle
        run: |
          dotnet pack Bodu.CodeStyle.XmlDocumentation/Bodu.CodeStyle.XmlDocumentation.csproj \
            --configuration Release \
            --output "${{ github.workspace }}/local-packages"

      - name: Report processor
        run: |
          uname -m
          if [ "$(uname -s)" = "Darwin" ]; then
            sysctl -n machdep.cpu.brand_string
            sysctl hw.ncpu hw.memsize hw.perflevel0.physicalcpu hw.perflevel0.l2cachesize hw.perflevel1.physicalcpu hw.perflevel1.l2cachesize || true
          else
            lscpu
            grep -m1 -i 'features' /proc/cpuinfo || true
          fi

      - name: Build and run
        run: |
          python3 Bodu.Security.Cryptography/bench/harness_matrix.py run \
            --out "${{ github.workspace }}/bench-results" \
            --runs "${{ github.event.inputs.runs || '4' }}" \
            --suites "${{ matrix.suites }}"

      - name: Summarize
        if: always()
        run: |
          python3 Bodu.Security.Cryptography/bench/harness_matrix.py summarize "${{ github.workspace }}/bench-results" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crypto-benchmarks-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            bench-results/**/*.txt
            !bench-results/bin/**
          retention-days: 30
          if-no-files-found: warn
