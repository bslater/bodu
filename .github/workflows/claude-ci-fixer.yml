name: Claude CI Fixer

# Autonomous "keep addressing the code until the gate is green" agent.
#
# The loop:
#   1. Build and Test (build-test.yml) runs on a PR and FAILS.
#   2. This workflow fires on that failure (workflow_run / conclusion == failure).
#   3. It checks an attempt counter (bounded — see MAX_ATTEMPTS) and, if under the cap,
#      launches Claude Code to diagnose and fix the failure, following CLAUDE.md.
#   4. Claude commits and pushes the fix to the PR branch USING A GITHUB APP TOKEN.
#   5. Because the push is authored by the app (not the default GITHUB_TOKEN), Build and
#      Test re-runs on the new commit. If it is green, no failure event fires and the loop
#      ends. If it is still red, step 2 fires again until the fix lands or the cap is hit.
#
# The DETERMINISTIC gate is `dotnet test --settings test.runsettings` inside build-test.yml
# plus your branch-protection required check — never the agent's own opinion. The agent only
# proposes commits; CI decides when the work is done, and a human still approves the merge.
#
# ── Required secrets ────────────────────────────────────────────────────────────────────────
#   ANTHROPIC_API_KEY      Anthropic API key for Claude Code. (Or swap for CLAUDE_CODE_OAUTH_TOKEN
#                          below if you use OAuth.)
#   CLAUDE_APP_ID          GitHub App id whose installation token pushes the fix. The app needs
#   CLAUDE_APP_PRIVATE_KEY   Contents + Pull requests: write on this repo. Using an APP (or a PAT)
#                          instead of GITHUB_TOKEN is REQUIRED — otherwise the pushed fix will not
#                          re-trigger Build and Test and the loop deadlocks against branch protection.
#
# ── Prerequisites ───────────────────────────────────────────────────────────────────────────
#   • Make "Build and Test" a REQUIRED status check in branch protection so red code cannot merge.
#   • Keep auto-merge OFF. This agent gets you to green; a human reviews and merges.
# ─────────────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]

permissions:
  contents: read          # the push uses the APP token, not GITHUB_TOKEN
  pull-requests: write     # to post the bounded-attempt / escalation status comment
  actions: read            # to correlate the triggering run

# Serialize fixer runs per branch so two attempts never race on the same PR head.
concurrency:
  group: claude-ci-fixer-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  # Hard cap on consecutive automated fix attempts per PR. The counter resets automatically
  # when a human (any commit NOT tagged [claude-ci-fixer]) pushes fresh work to the branch.
  MAX_ATTEMPTS: "3"
  # Marker every fixer commit carries, used to (a) detect fixer commits for the reset rule and
  # (b) label the automated attempt state comment on the PR.
  FIXER_MARKER: "[claude-ci-fixer]"

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Gate hard on the shape of the triggering run:
    #   • only when Build and Test actually FAILED,
    #   • only when it was a pull_request run (we need a PR branch to push back to),
    #   • only for SAME-REPO branches — never fork PRs. Fork heads cannot receive our push,
    #     and running an autonomous agent with Bash on attacker-authored fork content is unsafe.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      - name: Resolve PR and enforce attempt cap
        id: gate
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const marker = '<!-- claude-ci-fixer-state -->';
            const fixerMarker = process.env.FIXER_MARKER;
            const maxAttempts = parseInt(process.env.MAX_ATTEMPTS, 10);
            const headBranch = context.payload.workflow_run.head_branch;
            const headSha = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;

            // Find the open PR whose head is the branch Build and Test just failed on.
            const prs = await github.rest.pulls.list({
              owner, repo, state: 'open',
              head: `${owner}:${headBranch}`,
              per_page: 10,
            });
            if (prs.data.length === 0) {
              core.info(`No open PR for head '${headBranch}'; nothing to fix.`);
              core.setOutput('should_fix', 'false');
              return;
            }
            const pr = prs.data[0];

            // Reset rule: if the head commit is NOT a fixer commit, a human pushed fresh work,
            // so the automated attempt budget starts over.
            const headCommit = await github.rest.repos.getCommit({ owner, repo, ref: headSha });
            const isFixerCommit = (headCommit.data.commit.message || '').includes(fixerMarker);

            // Read the current attempt count from the state marker comment (if any).
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const stateComment = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.includes(marker));

            let attempts = 0;
            if (stateComment && isFixerCommit) {
              const m = stateComment.body.match(/attempts:\s*(\d+)/);
              if (m) attempts = parseInt(m[1], 10);
            }
            // (If !isFixerCommit we intentionally leave attempts at 0 — the human reset.)

            if (attempts >= maxAttempts) {
              const body = [
                marker,
                '## 🛑 Claude CI Fixer — stopped',
                '',
                `The automated fixer reached its cap of **${maxAttempts} attempts** on this pull ` +
                `request without turning CI green. This failure needs a human.`,
                '',
                `attempts: ${attempts} (capped)`,
                '',
                '_Push a commit of your own to reset the counter and re-arm the fixer._',
              ].join('\n');
              if (stateComment) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: stateComment.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              }
              core.info(`Attempt cap (${maxAttempts}) reached; escalating to a human.`);
              core.setOutput('should_fix', 'false');
              return;
            }

            const next = attempts + 1;
            const body = [
              marker,
              '## 🤖 Claude CI Fixer — working',
              '',
              `Build and Test failed on \`${headSha.substring(0, 7)}\`. Attempting an automated fix.`,
              '',
              `attempts: ${next}`,
              '',
              `_Automated attempt ${next} of ${maxAttempts}. The fixer stops at the cap and hands ` +
              `back to a human. Push your own commit any time to reset._`,
            ].join('\n');
            if (stateComment) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: stateComment.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }

            core.setOutput('should_fix', 'true');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('head_branch', headBranch);
            core.setOutput('attempt', String(next));

      - name: Checkout PR head
        if: steps.gate.outputs.should_fix == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head_branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          # The Bodu.Text.Yaml Regression tier reads the yaml-test-suite conformance corpus,
          # linked as a submodule — check it out so those tests have their vectors (mirrors build-test.yml).
          submodules: recursive

      - name: Setup .NET
        if: steps.gate.outputs.should_fix == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            10.0.x

      - name: Pack Bodu.CodeStyle.XmlDocumentation analyzer (local feed)
        if: steps.gate.outputs.should_fix == 'true'
        working-directory: Bodu.CodeStyle
        run: |
          # The main build resolves this analyzer from the 'bodu-local' source in NuGet.config
          # (./local-packages). Pack it first, exactly as build-test.yml and release.yml do, or the
          # agent's `dotnet build` fails to restore before it can even see the real test failures.
          dotnet pack Bodu.CodeStyle.XmlDocumentation/Bodu.CodeStyle.XmlDocumentation.csproj \
            --configuration Release \
            --output "${{ github.workspace }}/local-packages"

      - name: Configure git identity
        if: steps.gate.outputs.should_fix == 'true'
        run: |
          git config user.name  "claude-ci-fixer[bot]"
          git config user.email "claude-ci-fixer[bot]@users.noreply.github.com"

      - name: Run Claude Code to fix the failure
        if: steps.gate.outputs.should_fix == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Swap for `claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}` if you use OAuth.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # IMPORTANT: the app token (not GITHUB_TOKEN) so the pushed fix re-triggers Build and Test.
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            You are the CI fixer for the Bodu repository. Build and Test failed on this
            pull request branch (${{ steps.gate.outputs.head_branch }}), and your job is to make
            it green — this is automated attempt ${{ steps.gate.outputs.attempt }} of ${{ env.MAX_ATTEMPTS }}.

            The DETERMINISTIC success gate — the exact command CI runs — is:

                dotnet test bodu.slnx --settings test.runsettings --configuration Release

            (the local analyzer feed is already packed into ./local-packages). A clean
            `dotnet build bodu.slnx --configuration Release` must also succeed with no new warnings.

            Procedure:
            1. Reproduce the failure by building, then running the failing test project(s). Prefer
               scoping to the affected project(s) while iterating; do a full `test.runsettings` run
               before you finish.
            2. Read CLAUDE.md and obey it exactly. Non-negotiable guardrails:
               • Do NOT weaken, delete, skip, or `[Ignore]` tests, and do NOT loosen assertions to
                 force a pass. Fix the real defect. If a test is genuinely wrong, correct it to assert
                 the right contract — do not neuter it.
               • Do NOT suppress analyzer warnings (StyleCop / Roslynator / NetAnalyzers / AsyncFixer /
                 threading). Warnings are errors here — fix the cause.
               • Source every exception/user-facing message from the project's *ResourceStrings resx via
                 the ThrowHelper pattern; never hard-code message literals.
               • Follow the file-scoped namespace, file-header banner, `var` cascade, member-named test
                 partial, and XML-doc conventions in CLAUDE.md.
            3. Make the SMALLEST change that fixes the failure. Do not refactor unrelated code.
            4. Do NOT edit anything under `.github/workflows/**`, `bld/` signing files, `*.snk`,
               `NuGet.config`, or `global.json`. If the only real fix is in one of those, STOP and
               explain why in your final message instead of pushing.
            5. When (and only when) the build is clean and `test.runsettings` is green, commit the
               change and push it to this branch. The commit message MUST include the literal marker
               ${{ env.FIXER_MARKER }} on its own line so the loop can track automated attempts, e.g.:

                   Fix <what> so <which tests> pass

                   ${{ env.FIXER_MARKER }}

               Then run `git push`. If you could not reach a green gate, do NOT push a partial fix —
               end your turn with a clear diagnosis of what is wrong and what a human needs to decide.
          claude_args: |
            --max-turns 60
            --allowedTools "Bash,Edit,MultiEdit,Write,Read,Glob,Grep"
