name: Build and Publish DocFX Sites

on:
  push:
    branches: [ master ]
    # A release tag publishes that release's docs: to the root, and to its own /<series>/ copy.
    # Master publishes to /dev/. See "Publish to the versioned gh-pages branch" below.
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      publish_slot:
        description: >-
          Publish this run into a specific gh-pages slot ("1.0", "dev"). Leave empty to derive it
          from the ref, as a push does. Use it to seed or repair a slot out of band — a series
          whose tag predates this workflow, or a root that needs rebuilding before the next tag.
        required: false
        default: ''

# The site is served from the gh-pages branch, so the only permission this workflow needs is the
# one that lets it push there. pages: write and id-token: write went with the deploy-pages job, and
# actions: read was part of the same boilerplate — nothing here reads the Actions API.
permissions:
  contents: write

# Serialises publishing. This guarded the Pages deployment when one existed; it now guards the
# branch push, which needs it just as much — two runs racing to push gh-pages would leave one
# rejected as a non-fast-forward. In-progress runs are never cancelled, so a publish always
# finishes rather than leaving the branch half-written.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Dotnet Setup
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x

    # Pinned. An unpinned `tool update` means a docfx release can change the generated output or
    # trip --warningsAsErrors below, turning master red with no commit of ours; everything else
    # here is pinned on purpose (global.json, Directory.Packages.props, the manifest versions).
    # 2.81.0 is what the unpinned command resolved to, so this preserves current behaviour.
    - run: dotnet tool update -g docfx --version 2.81.0

    - name: Stamp build metadata into the docs footer
      # The versions matter as much as the commit. The site is rebuilt from master on every merge,
      # so without them a reader cannot tell whether the API they are reading is the one on
      # nuget.org or something not yet released - and the two streams publish at different
      # versions, so naming only one would be misleading.
      run: |
        set -eu
        SHORT_SHA="$(git rev-parse --short HEAD)"
        BRANCH="${GITHUB_REF_NAME:-unknown}"
        BUILT="$(date -u +'%Y-%m-%d')"
        STABLE="$(sed -n 's:.*<BoduBaseVersion>\(.*\)</BoduBaseVersion>.*:\1:p' bld/Versioning.props)"
        PREVIEW="$(sed -n 's:.*<BoduPreviewVersion>\(.*\)</BoduPreviewVersion>.*:\1:p' bld/Versioning.props)"

        # An empty stamp would read as a site that documents nothing in particular, which is worse
        # than a failed build: fail here rather than publish it.
        if [ -z "$STABLE" ] || [ -z "$PREVIEW" ]; then
          echo "::error::Could not read BoduBaseVersion / BoduPreviewVersion from bld/Versioning.props (got '$STABLE' / '$PREVIEW'). Has the property been renamed?"
          exit 1
        fi

        VERSIONS="Documents Bodu <strong>${STABLE}</strong> (Stable) and <strong>${PREVIEW}</strong> (Preview)"
        FOOTER="Documentation © 2026 Bodu contributors · Licensed under the MIT licence · Generated by <strong>DocFX</strong><br/><span class=\"docs-build-meta\">${VERSIONS} · Source: ${GITHUB_REPOSITORY:-bslater/bodu} · Branch: ${BRANCH} · Commit: ${SHORT_SHA} · Built: ${BUILT} (UTC)</span>"
        jq --arg footer "$FOOTER" '.build.globalMetadata._appFooter = $footer' docs/docfx.json > docs/docfx.json.tmp
        mv docs/docfx.json.tmp docs/docfx.json
        echo "Footer stamped: stable=${STABLE} preview=${PREVIEW} branch=${BRANCH} commit=${SHORT_SHA} built=${BUILT}"

    - name: Build DocFX site
      run: docfx docs/docfx.json --warningsAsErrors

    - name: Check documentation coverage guard rails
      # Orphaned pages, namespaces without an apidoc overview, prose identifiers
      # that do not exist in src/, package-status claims that disagree with
      # docs/docs/package-matrix.md, the per-package definition of done
      # (landing page, guides, samples page) declared in
      # bld/docs-checks/package-docs-map.txt, and the publication check: every
      # packable package accounted for by bld/release-manifest.txt, an install
      # command for each published one, and no nuget.org install command for a
      # package the manifest deliberately withholds. Allow-lists live in
      # bld/docs-checks/. The publication check replaced an inline bash step here,
      # so it can be run locally: python3 bld/check-docs.py publication.
      run: python3 bld/check-docs.py all

    - name: Audit content for stale link patterns
      run: |
        set -eu
        # Scoped to the trees DocFX actually publishes. reviews/ and forensic-review/ are
        # excluded from build.content in docs/docfx.json, so nothing in them renders as a link —
        # a file path named in a planning table there is not a stale link, and failing on it
        # blocks the build for no reachable defect.
        echo "Checking for direct apidoc/Bodu.*.md links (should use xref instead)..."
        AUDIT_SKIP="--exclude-dir=reviews --exclude-dir=forensic-review --exclude-dir=_site"
        if grep -rEn $AUDIT_SKIP 'apidoc/Bodu\.[A-Za-z0-9_.]+\.md' docs/ --include='*.md' >/dev/null; then
          echo "::error::Found direct apidoc/Bodu.*.md links in published docs/. Use xref:Bodu.<Namespace> instead."
          grep -rEn $AUDIT_SKIP 'apidoc/Bodu\.[A-Za-z0-9_.]+\.md' docs/ --include='*.md'
          exit 1
        fi
        echo "Checking for stale Text.Configuration profile names..."
        if grep -rEn 'Standard, PureIni|"PureIni"|`PureIni`' docs/ --include='*.md' >/dev/null; then
          echo "::error::Found stale Text.Configuration profile names. Use Bodu/EditorConfigCompatible/Strict/Relaxed."
          grep -rEn 'Standard, PureIni|"PureIni"|`PureIni`' docs/ --include='*.md'
          exit 1
        fi
        echo "Checking for HTML-escaped characters in hand-authored TOC/YAML files (use raw < > & instead)..."
        if grep -rEn '&lt;|&gt;|&amp;|&quot;|&#[0-9]+;' docs/ --include='*.yml' --exclude-dir=api >/dev/null; then
          echo "::error::Found HTML entities in hand-authored docs/*.yml. DocFX HTML-encodes TOC 'name:' values, so pre-escaped entities are double-encoded and render literally (e.g. Fraction<T> shows as Fraction&lt;T&gt;). Use raw < > & characters. (The generated docs/api output is excluded: DocFX legitimately encodes < > & inside its code blocks there.)"
          grep -rEn '&lt;|&gt;|&amp;|&quot;|&#[0-9]+;' docs/ --include='*.yml' --exclude-dir=api
          exit 1
        fi
        echo "All content audits passed."

    - name: Validate package artwork
      run: |
        set -eu
        MANIFEST=docs/images/hero-manifest.txt
        # Shared/non-package banners: namespace, format-level, and family art.
        ALLOWLIST="hero-text.svg hero-delimited.svg hero-dotenv.svg hero-ini.svg hero-serializers.svg"
        fail=0

        # Canonical packable package IDs = the projects DocFX documents:
        # every **/src/*.csproj, excluding the CodeStyle and archive trees and
        # projects that explicitly opt out of packing with <IsPackable>false</IsPackable>
        # (e.g. Bodu.Financial.ExchangeRates.Testing, which ships contract-test bases
        # to sibling test projects but is not published).
        ids="$(find . -path ./archive -prune -o -path ./Bodu.CodeStyle -prune -o \
          -name '*.csproj' -print | grep -E '/src/[^/]+\.csproj$' \
          | while read -r proj; do \
              grep -qi '<IsPackable>false</IsPackable>' "$proj" || basename "$proj" .csproj; \
            done | sort -u)"

        rows="$(grep -v '^\s*#' "$MANIFEST" | grep -v '^\s*$')"

        # 1. Every packable package has a manifest row; the mapped banner exists, is referenced, and is 480x220.
        for id in $ids; do
          banner="$(printf '%s\n' "$rows" | awk -v id="$id" '$1 == id { print $2 }')"
          if [ -z "$banner" ]; then
            echo "::error::Package '${id}' has no hero-banner row in ${MANIFEST}."
            fail=1
            continue
          fi
          if [ ! -f "docs/images/$banner" ]; then
            echo "::error::${MANIFEST} maps '${id}' to docs/images/${banner}, which does not exist."
            fail=1
            continue
          fi
          if ! grep -q 'viewBox="0 0 480 220"' "docs/images/$banner"; then
            echo "::error::docs/images/${banner} is not a 480x220 hero banner (viewBox mismatch)."
            fail=1
          fi
          if ! grep -rqF "$banner" docs/ --include='*.md'; then
            echo "::error::docs/images/${banner} ('${id}') is not referenced by any page under docs/."
            fail=1
          fi
        done

        # 2. Distinctness: no two packages may share a banner, and no package may be listed twice.
        dup_files="$(printf '%s\n' "$rows" | awk '{ print $2 }' | sort | uniq -d)"
        if [ -n "$dup_files" ]; then
          echo "::error::Hero banners are shared by more than one package in ${MANIFEST}: ${dup_files}"
          fail=1
        fi
        dup_ids="$(printf '%s\n' "$rows" | awk '{ print $1 }' | sort | uniq -d)"
        if [ -n "$dup_ids" ]; then
          echo "::error::Duplicate package rows in ${MANIFEST}: ${dup_ids}"
          fail=1
        fi

        # 3. Orphans: every hero-*.svg is either a manifest banner or an allowlisted shared banner.
        for f in docs/images/hero-*.svg; do
          base="$(basename "$f")"
          if printf '%s\n' "$rows" | awk '{ print $2 }' | grep -qxF "$base"; then continue; fi
          if printf '%s\n' $ALLOWLIST | grep -qxF "$base"; then continue; fi
          echo "::error::${f} is neither mapped to a package in ${MANIFEST} nor allowlisted as shared art."
          fail=1
        done

        # 4. Icons: every packable package ships a checked-in 128x128 icon PNG; no orphan icons or stale sources.
        for id in $ids; do
          png="bld/icons/$id.png"
          if [ ! -f "$png" ]; then
            echo "::error::Package '${id}' has no NuGet icon at ${png} (see bld/icons/README.md)."
            fail=1
            continue
          fi
          if [ "$(wc -c < "$png")" -gt 1048576 ]; then
            echo "::error::${png} exceeds the 1 MiB NuGet icon limit."
            fail=1
          fi
          if ! file "$png" | grep -q 'PNG image data, 128 x 128'; then
            echo "::error::${png} is not a 128x128 PNG: $(file -b "$png")"
            fail=1
          fi
        done
        for png in bld/icons/*.png; do
          id="$(basename "$png" .png)"
          if ! printf '%s\n' $ids | grep -qxF "$id"; then
            echo "::error::${png} does not map to any packable project. Stale or renamed package?"
            fail=1
          fi
        done
        for svg in bld/icons/svg/*.svg; do
          id="$(basename "$svg" .svg)"
          if [ ! -f "bld/icons/$id.png" ]; then
            echo "::error::${svg} has no rasterized sibling bld/icons/${id}.png. Run bld/icons/generate-icons.sh."
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then exit 1; fi
        echo "Package artwork (hero banners + NuGet icons) is complete, distinct, and referenced."

    - name: Validate generated API output
      run: |
        set -eu
        SITE_DIR=docs/_site
        if [ ! -d "$SITE_DIR/api" ]; then
          echo "::error::DocFX did not produce an api/ directory under $SITE_DIR. Check metadata generation."
          exit 1
        fi
        # Spot-check that every primary library produced a namespace page.
        missing=0
        for ns in \
          Bodu.Collections.Generic \
          Bodu.IO.Hashing \
          Bodu.Security.Cryptography \
          Bodu.Globalization.Calendar \
          Bodu.Text.Encoding \
          Bodu.Text.Bencode \
          Bodu.Text.Configuration \
          Bodu.Extensions.Configuration.Text \
          Bodu.Text \
          Bodu.Numerics \
          Bodu.Financial; do
          if [ ! -f "$SITE_DIR/api/$ns.html" ]; then
            echo "::error::Missing generated API page: $SITE_DIR/api/$ns.html"
            missing=1
          fi
        done
        if [ $missing -ne 0 ]; then exit 1; fi
        echo "All primary-library namespace API pages present."

    - name: Publish to the versioned gh-pages branch
      # Writes the built site into the branch layout bld/stage-docs-site.sh documents: the latest
      # release at the root and under /<series>/, master under /dev/.
      #
      # This step IS the publication now: the repository serves Pages from the gh-pages branch, so
      # what this pushes is what the world reads. There is no longer a deploy-pages job beside it.
      #
      # A manual run may publish into a slot of its own choosing (publish_slot), to seed or repair
      # one out of band. Dispatching a release TAG cannot do that - workflow_dispatch runs the
      # workflow as defined at the dispatched ref, so a tag cut before this step existed does not
      # have it - and an old tag's docs may not even build, since the guard rails above have
      # tightened since. Dispatch from master with publish_slot instead.
      if: >-
        (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PUBLISH_SLOT: ${{ github.event.inputs.publish_slot }}
      run: |
        set -eu

        if [ -n "${PUBLISH_SLOT:-}" ]; then
          # Validated here as well as in the script, so a typo names itself instead of surfacing as
          # a staging failure further down.
          if ! printf '%s' "$PUBLISH_SLOT" | grep -qE '^(dev|[0-9]+\.[0-9]+)$'; then
            echo "::error::publish_slot must be \"dev\" or a release series like \"1.0\", got \"${PUBLISH_SLOT}\"."
            exit 1
          fi
          SLOT="$PUBLISH_SLOT"
          echo "Publishing into the slot requested by this run: ${SLOT}"
        elif [ "$GITHUB_REF" = "refs/heads/master" ]; then
          SLOT="dev"
        else
          VERSION="${GITHUB_REF_NAME#v}"      # v1.2.3 -> 1.2.3

          # Only a plain MAJOR.MINOR.PATCH tag publishes. A prerelease is not "the latest release"
          # and must not replace the root site; a malformed tag should not fail the run either.
          # Both would otherwise derive a slot stage-docs-site.sh rejects — "1.0.0-rc" from
          # v1.0.0-rc.1, "1" from v1.0 — turning a stray tag into a red build.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag ${GITHUB_REF_NAME} is not a plain vMAJOR.MINOR.PATCH release — not publishing it as the latest docs."
            exit 0
          fi

          SLOT="${VERSION%.*}"                # 1.2.3  -> 1.2
        fi

        WORK="$(mktemp -d)"
        REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        # Shallow-clone the branch if it exists; create it empty and orphaned the first time, so
        # the docs history never carries the source history.
        if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
          git clone --depth 1 --branch gh-pages "$REMOTE" "$WORK"
        else
          echo "gh-pages does not exist yet — creating it."
          git clone --depth 1 "$REMOTE" "$WORK"
          git -C "$WORK" checkout --orphan gh-pages
          git -C "$WORK" rm -rf . >/dev/null 2>&1 || true
        fi

        bash bld/stage-docs-site.sh docs/_site "$WORK" "$SLOT"

        git -C "$WORK" config user.name  "github-actions[bot]"
        git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -C "$WORK" add -A
        if git -C "$WORK" diff --cached --quiet; then
          echo "No change to publish for slot '${SLOT}'."
          exit 0
        fi
        git -C "$WORK" commit -m "Publish docs for ${GITHUB_REF_NAME} into /${SLOT}/ (${GITHUB_SHA})"
        git -C "$WORK" push "$REMOTE" gh-pages
        echo "Published slot '${SLOT}' to gh-pages."
