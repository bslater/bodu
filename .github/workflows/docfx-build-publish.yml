name: Build and Publish DocFX Sites

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Dotnet Setup
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.x

    - run: dotnet tool update -g docfx

    - name: Build DocFX site
      run: docfx docs/docfx.json --warningsAsErrors

    - name: Audit content for stale link patterns
      run: |
        set -eu
        echo "Checking for direct apidoc/Bodu.*.md links (should use xref instead)..."
        if grep -rEn 'apidoc/Bodu\.[A-Za-z0-9_.]+\.md' docs/ --include='*.md' >/dev/null; then
          echo "::error::Found direct apidoc/Bodu.*.md links in docs/. Use xref:Bodu.<Namespace> instead."
          grep -rEn 'apidoc/Bodu\.[A-Za-z0-9_.]+\.md' docs/ --include='*.md'
          exit 1
        fi
        echo "Checking for stale Text.Configuration profile names..."
        if grep -rEn 'Standard, PureIni|"PureIni"|`PureIni`' docs/ --include='*.md' >/dev/null; then
          echo "::error::Found stale Text.Configuration profile names. Use Bodu/EditorConfigCompatible/Strict/Relaxed."
          grep -rEn 'Standard, PureIni|"PureIni"|`PureIni`' docs/ --include='*.md'
          exit 1
        fi
        echo "Checking for HTML-escaped characters in hand-authored TOC/YAML files (use raw < > & instead)..."
        # Scope to source-authored YAML only. The generated managed-reference YAML
        # (docs/api/, gitignored) and the built site (docs/_site/) legitimately carry
        # HTML entities inside <code>/<pre> blocks within summaries and remarks; the
        # double-encoding hazard this guards against only applies to hand-authored TOC
        # 'name:' values.
        if grep -rEn '&lt;|&gt;|&amp;|&quot;|&#[0-9]+;' docs/ --include='*.yml' --exclude-dir=api --exclude-dir=_site >/dev/null; then
          echo "::error::Found HTML entities in hand-authored docs/*.yml. DocFX HTML-encodes TOC 'name:' values, so pre-escaped entities are double-encoded and render literally (e.g. Fraction<T> shows as Fraction&lt;T&gt;). Use raw < > & characters."
          grep -rEn '&lt;|&gt;|&amp;|&quot;|&#[0-9]+;' docs/ --include='*.yml' --exclude-dir=api --exclude-dir=_site
          exit 1
        fi
        echo "All content audits passed."

    - name: Validate generated API output
      run: |
        set -eu
        SITE_DIR=docs/_site
        if [ ! -d "$SITE_DIR/api" ]; then
          echo "::error::DocFX did not produce an api/ directory under $SITE_DIR. Check metadata generation."
          exit 1
        fi
        # Spot-check that every primary library produced a namespace page.
        missing=0
        for ns in \
          Bodu.Collections.Generic \
          Bodu.IO.Hashing \
          Bodu.Security.Cryptography \
          Bodu.Globalization.Calendar \
          Bodu.Text.Encoding \
          Bodu.Text.Bencode \
          Bodu.Text.Configuration \
          Bodu.Extensions.Configuration.Text \
          Bodu.Numerics \
          Bodu.Financial; do
          if [ ! -f "$SITE_DIR/api/$ns.html" ]; then
            echo "::error::Missing generated API page: $SITE_DIR/api/$ns.html"
            missing=1
          fi
        done
        if [ $missing -ne 0 ]; then exit 1; fi
        echo "All primary-library namespace API pages present."

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        # Upload entire repository
        path: 'docs/_site'

  deploy-docs:
    needs: build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
