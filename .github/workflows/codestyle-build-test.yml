name: Bodu.CodeStyle - Build, Test, Pack

on:
  push:
    branches:
      - master
      - 'claude/**'
    paths:
      - 'Bodu.CodeStyle/**'
      - '.github/workflows/codestyle-build-test.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'Bodu.CodeStyle/**'
      - '.github/workflows/codestyle-build-test.yml'

jobs:
  # Runs on both Ubuntu 24.04 and 26.04 while GitHub moves ubuntu-latest from one to the other,
  # gradually, between October 19 and November 19, 2026. Drop ubuntu-24.04 from the list once 26.04
  # has proven itself. fail-fast is off so a failure on one image does not cancel the other.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        working-directory: Bodu.CodeStyle
        run: dotnet restore Bodu.CodeStyle.sln

      - name: Build
        working-directory: Bodu.CodeStyle
        run: dotnet build Bodu.CodeStyle.sln --configuration Release --no-restore

      - name: Test - Bodu.CodeStyle.XmlDocumentation.Core
        working-directory: Bodu.CodeStyle
        run: dotnet test Bodu.CodeStyle.XmlDocumentation.Core/test/Bodu.CodeStyle.XmlDocumentation.Core.Test.csproj --configuration Release --no-build --logger "trx;LogFileName=core.trx"

      - name: Test - Bodu.CodeStyle.XmlDocumentation.Analyzers
        working-directory: Bodu.CodeStyle
        run: dotnet test Bodu.CodeStyle.XmlDocumentation.Analyzers/test/Bodu.CodeStyle.XmlDocumentation.Analyzers.Test.csproj --configuration Release --no-build --logger "trx;LogFileName=analyzers.trx"

      - name: Test - Bodu.CodeStyle.XmlDocumentation.CodeFixes
        working-directory: Bodu.CodeStyle
        run: dotnet test Bodu.CodeStyle.XmlDocumentation.CodeFixes/test/Bodu.CodeStyle.XmlDocumentation.CodeFixes.Test.csproj --configuration Release --no-build --logger "trx;LogFileName=codefixes.trx"

      - name: Pack
        working-directory: Bodu.CodeStyle
        run: dotnet pack Bodu.CodeStyle.XmlDocumentation/Bodu.CodeStyle.XmlDocumentation.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package
        # Both images pack the same package, so only the first in the list uploads it.
        if: strategy.job-index == 0
        uses: actions/upload-artifact@v7
        with:
          name: Bodu.CodeStyle.XmlDocumentation.nupkg
          path: Bodu.CodeStyle/artifacts/*.nupkg
