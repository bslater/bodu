name: Bodu.Numerics NativeAOT smoke

# Publishes the Bodu.Numerics AOT smoke app with NativeAOT and runs the native binary, so the
# reflection-based bounded-type probe in Fraction<T> is proven to survive trimming and native
# compilation rather than relying on the IL2026 / IL3050 suppressions alone.

on:
  push:
    branches: [ master ]
    paths:
      - 'Bodu.Numerics/**'
      - 'Bodu.Core/**'
      - '.github/workflows/numerics-aot-smoke.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'Bodu.Numerics/**'
      - 'Bodu.Core/**'
      - '.github/workflows/numerics-aot-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on both Ubuntu 24.04 and 26.04 while GitHub moves ubuntu-latest from one to the other,
  # gradually, between October 19 and November 19, 2026. Drop ubuntu-24.04 from the list once 26.04
  # has proven itself. fail-fast is off so a failure on one image does not cancel the other.
  aot-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Dotnet Setup
      uses: actions/setup-dotnet@v6
      with:
        # The .NET 10 SDK is the exact version global.json pins; .NET 8 serves the net8.0 leg.
        global-json-file: global.json
        dotnet-version: 8.x

    - name: Install NativeAOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    - name: Publish and run the AOT smoke app on each target framework
      # PublishAot is set inside the AotSmoke csproj rather than passed with -p: a command-line
      # -p:PublishAot=true is a global MSBuild property that propagates to every project in the
      # restore graph — including the netstandard2.0 Bodu.CodeStyle analyzer projects wired in as
      # analyzer-only ProjectReferences — which fails restore with NETSDK1207.
      #
      # The project multi-targets, so -f is required and each leg is published and run in turn:
      # trimming and AOT warnings differ between framework versions, and a leg that is never
      # published is a leg whose AOT compatibility is unverified.
      run: |
        set -euo pipefail
        for tfm in net8.0 net10.0; do
          echo "::group::AOT smoke ($tfm)"
          dotnet publish Bodu.Numerics/aot/Bodu.Numerics.AotSmoke.csproj \
            -c Release -r linux-x64 -f "$tfm"
          "./Bodu.Numerics/aot/bin/Release/$tfm/linux-x64/publish/Bodu.Numerics.AotSmoke"
          echo "::endgroup::"
        done
