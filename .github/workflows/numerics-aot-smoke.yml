name: Bodu.Numerics NativeAOT smoke

# Publishes the Bodu.Numerics AOT smoke app with NativeAOT and runs the native binary, so the
# reflection-based bounded-type probe in Fraction<T> is proven to survive trimming and native
# compilation rather than relying on the IL2026 / IL3050 suppressions alone, and so is
# Bodu.Numerics.Serialization.Json's documented native-AOT path (closed converters on the options
# of a source-generated context).

on:
  push:
    branches: [ master ]
    paths:
      - 'Bodu.Numerics/**'
      - 'Bodu.Numerics.Serialization.Json/**'
      - 'Bodu.Core/**'
      - '.github/workflows/numerics-aot-smoke.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'Bodu.Numerics/**'
      - 'Bodu.Numerics.Serialization.Json/**'
      - 'Bodu.Core/**'
      - '.github/workflows/numerics-aot-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on Windows as well as Linux (#1339): NativeAOT compiles to the operating system's own binary
  # format with its own toolchain, so each is a separate proof. The Linux legs run on both Ubuntu 24.04
  # and 26.04 while GitHub moves ubuntu-latest from one to the other, gradually, between October 19 and
  # November 19, 2026. Drop ubuntu-24.04 from the list once 26.04 has proven itself. fail-fast is off
  # so a failure on one image does not cancel the others.
  aot-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-26.04
            rid: linux-x64
          # The Windows image carries the Visual Studio C++ toolchain NativeAOT links with.
          - os: windows-2025
            rid: win-x64
            exe: .exe
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Dotnet Setup
      uses: actions/setup-dotnet@v6
      with:
        # The .NET 10 SDK is the exact version global.json pins; .NET 8 serves the net8.0 leg.
        global-json-file: global.json
        dotnet-version: 8.x

    - name: Install NativeAOT prerequisites
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    - name: Publish and run the AOT smoke app on each target framework
      # PublishAot is set inside the AotSmoke csproj rather than passed with -p: a command-line
      # -p:PublishAot=true is a global MSBuild property that propagates to every project in the
      # restore graph - including the netstandard2.0 Bodu.CodeStyle analyzer projects wired in as
      # analyzer-only ProjectReferences - which fails restore with NETSDK1207.
      #
      # The project multi-targets, so -f is required and each leg is published and run in turn:
      # trimming and AOT warnings differ between framework versions, and a leg that is never
      # published is a leg whose AOT compatibility is unverified.
      run: |
        set -euo pipefail
        for tfm in net8.0 net10.0; do
          echo "::group::AOT smoke ($tfm)"
          dotnet publish Bodu.Numerics/aot/Bodu.Numerics.AotSmoke.csproj \
            -c Release -r "${{ matrix.rid }}" -f "$tfm"
          "./Bodu.Numerics/aot/bin/Release/$tfm/${{ matrix.rid }}/publish/Bodu.Numerics.AotSmoke${{ matrix.exe }}"
          echo "::endgroup::"
        done
