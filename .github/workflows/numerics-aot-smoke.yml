name: Bodu.Numerics NativeAOT smoke

# Publishes the Bodu.Numerics AOT smoke app with NativeAOT and runs the native binary, so the
# reflection-based bounded-type probe in Fraction<T> is proven to survive trimming and native
# compilation rather than relying on the IL2026 / IL3050 suppressions alone.

on:
  push:
    branches: [ master ]
    paths:
      - 'Bodu.Numerics/**'
      - 'Bodu.Core/**'
      - '.github/workflows/numerics-aot-smoke.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'Bodu.Numerics/**'
      - 'Bodu.Core/**'
      - '.github/workflows/numerics-aot-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aot-smoke:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Dotnet Setup
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x

    - name: Install NativeAOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    - name: Publish AOT smoke app
      # PublishAot is set inside the AotSmoke csproj rather than passed with -p: a command-line
      # -p:PublishAot=true is a global MSBuild property that propagates to every project in the
      # restore graph — including the netstandard2.0 Bodu.CodeStyle analyzer projects wired in as
      # analyzer-only ProjectReferences — which fails restore with NETSDK1207.
      run: dotnet publish Bodu.Numerics/aot/Bodu.Numerics.AotSmoke.csproj -c Release -r linux-x64

    - name: Run the native binary
      run: ./Bodu.Numerics/aot/bin/Release/net8.0/linux-x64/publish/Bodu.Numerics.AotSmoke
