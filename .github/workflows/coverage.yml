name: Coverage

# Deliberately separate from build-test.yml. That workflow is the fast red/green signal and its
# 30-minute budget is worth protecting; instrumented collection across every test project on the
# regression tier is an order of magnitude slower and belongs on its own schedule.
#
# Every job here runs on ubuntu-24.04 alone, not on the 24.04 and 26.04 pair the verification jobs
# use while GitHub moves ubuntu-latest from one to the other: coverage measures the code, not the
# platform, and a second image would only double the collection. The label is named rather than
# ubuntu-latest so the gradual move cannot put one run's jobs on different images. Switch it to
# ubuntu-26.04 when the verification jobs drop 24.04.
on:
  schedule:
    # Weekly full baseline, Sunday 15:00 UTC.
    - cron: '0 15 * * 0'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of collection shards'
        required: false
        default: '8'

permissions:
  contents: read
  pull-requests: write

env:
  SHARD_COUNT: ${{ github.event.inputs.shards || '8' }}

jobs:
  # ---------------------------------------------------------------------------------------------
  # Decide what to collect. A full run on schedule/dispatch; on a pull request, only the test
  # projects whose production sources the diff actually touched.
  # ---------------------------------------------------------------------------------------------
  scope:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      projects: ${{ steps.decide.outputs.projects }}
      shards: ${{ steps.decide.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide collection scope
        id: decide
        # The rule is bld/coverage-scope.sh, which bld/policy/tests/test_coverage_scope.py holds to its
        # cases in the Policy Gate; this step only names the event and, on a pull request, hands it the
        # changed paths. The diff is taken into a variable first, so a git failure stops the step under
        # errexit before the script can decide anything from an empty list, and the script reads the
        # here-string whole before it tests anything (#1337). The script writes the three output lines
        # (mode, projects, shards) itself.
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            bash bld/coverage-scope.sh <<< "$changed" >> "$GITHUB_OUTPUT"
          else
            bash bld/coverage-scope.sh --event "${{ github.event_name }}" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------------------------
  # Collect. Shards are balanced inside collect-coverage.sh by test-project size, so the matrix
  # only has to supply the index.
  # ---------------------------------------------------------------------------------------------
  collect:
    needs: scope
    if: needs.scope.outputs.mode != 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(format('[{0}]', needs.scope.outputs.shards)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The Bodu.Text.Yaml Regression tier reads the yaml/yaml-test-suite conformance corpus,
          # linked as the 'yaml-test-suite' git submodule; check it out so those tests have vectors.
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The .NET 10 SDK is the exact version global.json pins, so an SDK upgrade is a deliberate
          # change. The .NET 8 SDK beside it builds the Bodu.CodeStyle solution; collect-coverage.sh
          # covers one framework, the newest in BoduNetTargets, so the net8.0 legs are not run here.
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          # The in-repo XML-documentation analyzer is packed from source in the next step, always at
          # version 1.0.0, and NuGet never re-extracts a package version it already holds. Kept in the
          # cache, an old extraction would outlive every analyzer change and report against stale
          # rules (#966), so it stays out; bld/pack-codestyle-analyzer.ps1 evicts it locally for the
          # same reason.
          path: |
            ~/.nuget/packages
            !~/.nuget/packages/bodu.codestyle.xmldocumentation
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pack Bodu.CodeStyle.XmlDocumentation analyzer (local feed)
        working-directory: Bodu.CodeStyle
        run: |
          dotnet pack Bodu.CodeStyle.XmlDocumentation/Bodu.CodeStyle.XmlDocumentation.csproj \
            --configuration Release \
            --output "${{ github.workspace }}/local-packages"

      - name: Collect coverage
        run: |
          if [ "${{ needs.scope.outputs.mode }}" = "diff" ]; then
            # The probe still runs: without it the manifest records AVX-512 as unknown, and the
            # matrix would then classify the *.Avx512.cs files as hardware-gated on a runner that
            # may in fact support them.
            for proj in ${{ needs.scope.outputs.projects }}; do
              bld/collect-coverage.sh --project "$proj"
            done
          else
            bld/collect-coverage.sh --shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }}
          fi

      - name: Collect scalar (SIMD-disabled) pass
        # Bodu.Security.Cryptography is the only package with hardware-gated dispatch: the JIT picks
        # one of the AVX-512 or scalar implementations per process, so a single run cannot cover
        # both. Re-run just that suite with intrinsics disabled; the merge unions the two. Keyed off
        # the raw directory rather than the shard index so it works in diff-scoped runs too, and so
        # it does not silently stop firing if sharding changes.
        if: always()
        run: |
          if [ -d artifacts/coverage/raw/Bodu.Security.Cryptography.Test ]; then
            bld/collect-coverage.sh --scalar --no-probe \
              --project Bodu.Security.Cryptography/test/Bodu.Security.Cryptography.Test.csproj
          else
            echo "Crypto suite not collected in this job; no scalar pass needed."
          fi

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cobertura-shard-${{ matrix.shard }}
          path: |
            artifacts/coverage/raw/**/coverage.cobertura.xml
            artifacts/coverage/report/environment*.json
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  # Merge, publish, and enforce.
  # ---------------------------------------------------------------------------------------------
  aggregate:
    needs: [scope, collect]
    # always() keeps the merge and its report running when a collect shard fails, but only after a
    # scope that succeeded: a skipped scope (a draft pull request) has no mode, which is not 'skip',
    # and merging nothing would fail the run and comment an empty summary on the pull request (#1341).
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.mode != 'skip'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download shard results
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-cobertura-shard-*
          merge-multiple: true
          path: artifacts/coverage

      - name: Merge
        run: bld/merge-coverage.sh

      - name: Build matrix
        run: pwsh tools/New-CoverageMatrix.ps1

      - name: Enforce ratchet
        id: ratchet
        # Hard-fail. The step ran report-only (continue-on-error) from the day the ratchet was written
        # until its floors had proven stable on the default branch: after the per-package hardware
        # gating (#1364) and the floor corrections (#1357), the dispatched full run #299 and the weekly
        # scheduled run #300 of 2026-11-01 both satisfied it for every collected package, and the floors
        # were then raised from run #300. A breach now fails this job, on a pull request's diff-scoped
        # run as on the weekly full run. The Publish summary step still states the outcome and keeps the
        # check's own text, since this step's trace is a bare "Process completed with exit code 1".
        run: |
          # The output is kept beside the report, so it lands in the coverage-report artifact, and the
          # exit code returned is pwsh's, not tee's. The Publish summary step reads both.
          mkdir -p artifacts/coverage/report
          pwsh tools/New-CoverageMatrix.ps1 -Check 2>&1 | tee artifacts/coverage/report/ratchet.txt
          exit "${PIPESTATUS[0]}"

      - name: Publish summary
        if: always()
        env:
          RATCHET_OUTCOME: ${{ steps.ratchet.outcome }}
        run: |
          if [ -f artifacts/coverage/report/SummaryGithub.md ]; then
            cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

          # The ratchet step's own trace on a failure is a bare exit code, so its outcome is stated here,
          # with the captured output, and as an error annotation: two scheduled runs once failed the
          # ratchet with no trace but a bare exit-code annotation, while the step was report-only.
          {
            echo
            echo "## Coverage ratchet"
            echo
            case "$RATCHET_OUTCOME" in
              success)
                echo "Coverage ratchet satisfied."
                ;;
              failure)
                echo "Coverage ratchet FAILED."
                echo
                echo '```text'
                if [ -f artifacts/coverage/report/ratchet.txt ]; then
                  # pwsh colors its output with escape sequences, which the summary cannot render.
                  sed 's/\x1b\[[0-9;]*m//g' artifacts/coverage/report/ratchet.txt
                else
                  echo "The ratchet output was not captured."
                fi
                echo '```'
                ;;
              *)
                echo "Coverage ratchet did not run (outcome: ${RATCHET_OUTCOME:-none})."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RATCHET_OUTCOME" = "failure" ]; then
            echo "::error::Coverage ratchet failed: see the job summary"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage/report/**
          retention-days: 14
          if-no-files-found: warn

      - name: Comment coverage summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            const summaryPath = 'artifacts/coverage/report/SummaryGithub.md';
            const marker = '<!-- bodu-ci-coverage-summary -->';

            if (!fs.existsSync(summaryPath)) {
              return;
            }

            const summary = fs.readFileSync(summaryPath, 'utf8');

            const maxBodyLength = 60000;
            let body = [
              marker,
              '## Coverage',
              '',
              '_Diff-scoped: only the test projects for the production sources this PR touched were collected, so packages absent below were not measured in this run._',
              '',
              summary
            ].join('\n');

            if (body.length > maxBodyLength) {
              body = body.substring(0, maxBodyLength) + '\n\n_Comment truncated because the report was too large. See the uploaded coverage-report artifact for the full output._';
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body &&
              comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });

              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body
            });
