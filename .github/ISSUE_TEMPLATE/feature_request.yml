name: Feature request
description: Propose a new type, member, algorithm, format, or package.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search the [existing issues](https://github.com/bslater/bodu/issues) and the [roadmap](https://github.com/bslater/bodu/blob/master/ROADMAP.md) first. Agreeing on the shape of an API here, before any code is written, keeps a pull request short.
  - type: input
    id: package
    attributes:
      label: Package
      description: The package the feature belongs in, or "new package".
      placeholder: Bodu.Text.Encoding
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why the current API does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: The public surface you have in mind, and a short example of its use.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Specifications and references
      description: Any RFC, standard, paper, or reference implementation the feature should follow, and where its test vectors are published.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other designs, or existing libraries that already do this.
  - type: dropdown
    id: breaking
    attributes:
      label: Breaking change
      description: Whether the proposal changes or removes existing public API.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
