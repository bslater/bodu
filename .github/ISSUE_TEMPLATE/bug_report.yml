name: Bug report
description: Report a defect in a Bodu package, including documentation that contradicts its behaviour.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem.

        **Do not report a security vulnerability here.** Follow [SECURITY.md](https://github.com/bslater/bodu/blob/master/SECURITY.md) to report it privately.

        Please search the [existing issues](https://github.com/bslater/bodu/issues) first.
  - type: input
    id: package
    attributes:
      label: Package and version
      description: The NuGet package and version, or the commit, where you see the problem.
      placeholder: Bodu.Collections 1.0.0
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What goes wrong, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest code or input that reproduces the problem, and what it does.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected instead. Cite the documentation or specification it contradicts, if any.
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Target framework
      options:
        - net10.0
        - net8.0
        - Both
        - Other or not known
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and processor
      description: Needed when the problem may depend on them, for example a cryptographic primitive that selects a SIMD kernel by processor.
      placeholder: Ubuntu 24.04, x64, AVX-512
  - type: textarea
    id: location
    attributes:
      label: Location
      description: The file and line where the defect lives, if you know it.
      placeholder: Bodu.Collections/src/Collections.Generic/CircularBuffer{T}.cs:120
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix
      description: Optional. How you would fix it.
