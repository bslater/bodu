; Application configuration (sample data).
; The global section holds top-level keys; named sections group the rest.
environment = production

[server]
; Bind address and port for the listener.
host = 0.0.0.0
port = 8080
request_timeout = 30

[logging]
level = information
; Rolling file sink settings.
path = logs/app.log
max_size_mb = 64
