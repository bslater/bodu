<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="xts-title xts-desc">
  <title id="xts-title">XTS mode of operation</title>
  <desc id="xts-desc">XTS encrypts each block j with a tweak T_j = α^j · tweakCipher.Encrypt(sector). The tweak is XORed into plaintext before and into ciphertext after the data cipher.</desc>

  <defs>
    <style>
      .bg { fill: #0F172A; }
      .panel { fill: #1E293B; stroke: #334155; stroke-width: 1; }
      .header { fill: #111827; stroke: #334155; stroke-width: 1; }
      .title { fill: #F8FAFC; font: 700 15px/1 "Segoe UI",Arial,sans-serif; }
      .formula { fill: #94A3B8; font: italic 12px/1 "Cambria",Georgia,serif; }
      .label { fill: #F8FAFC; font: 700 13px/1 "Segoe UI",Arial,sans-serif; }
      .sub { fill: #CBD5E1; font: 400 11px/1 "Segoe UI",Arial,sans-serif; }
      .cipher-e { fill: #3B82F6; stroke: #60A5FA; stroke-width: 1; }
      .cipher-t { fill: #0EA5E9; stroke: #67E8F9; stroke-width: 1; }
      .cipher-text { fill: #F8FAFC; font: 700 15px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .plain { fill: #F59E0B; }
      .cipher-out { fill: #14B8A6; }
      .tweak { fill: #A78BFA; }
      .wire { stroke: #CBD5E1; stroke-width: 1.6; fill: none; }
      .wire-tweak { stroke: #A78BFA; stroke-width: 1.6; fill: none; }
      .xor { fill: #0F172A; stroke: #F8FAFC; stroke-width: 1.6; }
      .xor-sym { fill: #F8FAFC; font: 700 14px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .gfmul { fill: #7C3AED; stroke: #A78BFA; stroke-width: 1; }
    </style>
    <marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#CBD5E1"/>
    </marker>
    <marker id="arrxt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect class="bg" width="820" height="340"/>

  <g transform="translate(10 10)">
    <rect class="panel" width="800" height="320" rx="8"/>
    <rect class="header" width="800" height="46" rx="8"/>
    <rect class="header" y="38" width="800" height="8"/>
    <text class="title" x="16" y="20">XTS — XEX-based Tweaked-Codebook with Ciphertext Stealing (IEEE 1619)</text>
    <text class="formula" x="784" y="38" text-anchor="end">Cⱼ = E_K₁(Pⱼ ⊕ Tⱼ) ⊕ Tⱼ,    Tⱼ = αʲ · E_K₂(sector)</text>

    <!-- Tweak derivation column on the left -->
    <g transform="translate(70 70)">
      <rect class="tweak" x="-34" y="0" width="68" height="18" rx="3"/>
      <text class="label" x="0" y="13" text-anchor="middle" fill="#0F172A">sector</text>
      <line class="wire-tweak" x1="0" y1="18" x2="0" y2="36" marker-end="url(#arrxt)"/>
      <rect class="cipher-t" x="-30" y="40" width="60" height="34" rx="5"/>
      <text class="cipher-text" x="0" y="62">E_K₂</text>
      <text class="sub" x="0" y="88" text-anchor="middle">(tweak cipher)</text>

      <!-- Base tweak T -->
      <line class="wire-tweak" x1="0" y1="74" x2="0" y2="108" marker-end="url(#arrxt)"/>
      <rect class="tweak" x="-22" y="108" width="44" height="18" rx="3"/>
      <text class="label" x="0" y="121" text-anchor="middle" fill="#0F172A">T</text>

      <!-- GF multiplication chain to produce T_j for j=1,2,3 -->
      <line class="wire-tweak" x1="22" y1="117" x2="100" y2="117" marker-end="url(#arrxt)"/>
    </g>

    <!-- GF multipliers between cells -->
    <g transform="translate(240 187)">
      <rect class="gfmul" x="-18" y="-10" width="36" height="20" rx="3"/>
      <text class="sub" x="0" y="5" text-anchor="middle" fill="#F8FAFC">·α</text>
    </g>
    <g transform="translate(420 187)">
      <rect class="gfmul" x="-18" y="-10" width="36" height="20" rx="3"/>
      <text class="sub" x="0" y="5" text-anchor="middle" fill="#F8FAFC">·α</text>
    </g>

    <!-- Horizontal tweak bus: T → T₁ → T₂ → T₃ along y=187 -->
    <line class="wire-tweak" x1="170" y1="187" x2="222" y2="187" marker-end="url(#arrxt)"/>
    <line class="wire-tweak" x1="258" y1="187" x2="402" y2="187" marker-end="url(#arrxt)"/>
    <line class="wire-tweak" x1="438" y1="187" x2="582" y2="187" marker-end="url(#arrxt)"/>

    <!-- Three XTS cells for j=1,2,3 at x=330,510,690 (approximate) -->
    <!-- Actually align with tweak bus: cells centered at x=180,360,540,720? Let me use 180,360,540 -->

    <!-- cell j=1 at (cx=180) -->
    <g transform="translate(180 70)">
      <rect class="plain" x="-22" y="0" width="44" height="18" rx="3"/>
      <text class="label" x="0" y="13" text-anchor="middle" fill="#0F172A">P₁</text>
      <line class="wire" x1="0" y1="18" x2="0" y2="40" marker-end="url(#arrx)"/>
      <circle class="xor" cx="0" cy="50" r="10"/>
      <text class="xor-sym" x="0" y="55">⊕</text>
      <!-- T₁ arrow in from the right (from tweak bus at y=117 local = (parent 187) minus translate 70 = 117) -->
      <line class="wire-tweak" x1="60" y1="50" x2="10" y2="50" marker-end="url(#arrxt)"/>
      <text class="sub" x="40" y="42" text-anchor="middle" fill="#A78BFA">T₁</text>
      <rect class="cipher-e" x="-30" y="66" width="60" height="34" rx="5"/>
      <text class="cipher-text" x="0" y="88">E_K₁</text>
      <line class="wire" x1="0" y1="100" x2="0" y2="122" marker-end="url(#arrx)"/>
      <circle class="xor" cx="0" cy="132" r="10"/>
      <text class="xor-sym" x="0" y="137">⊕</text>
      <line class="wire-tweak" x1="60" y1="132" x2="10" y2="132" marker-end="url(#arrxt)"/>
      <text class="sub" x="40" y="124" text-anchor="middle" fill="#A78BFA">T₁</text>
      <line class="wire" x1="0" y1="142" x2="0" y2="168"/>
      <rect class="cipher-out" x="-22" y="168" width="44" height="18" rx="3"/>
      <text class="label" x="0" y="181" text-anchor="middle" fill="#0F172A">C₁</text>
    </g>

    <!-- cell j=2 at (cx=360) -->
    <g transform="translate(360 70)">
      <rect class="plain" x="-22" y="0" width="44" height="18" rx="3"/>
      <text class="label" x="0" y="13" text-anchor="middle" fill="#0F172A">P₂</text>
      <line class="wire" x1="0" y1="18" x2="0" y2="40" marker-end="url(#arrx)"/>
      <circle class="xor" cx="0" cy="50" r="10"/>
      <text class="xor-sym" x="0" y="55">⊕</text>
      <line class="wire-tweak" x1="60" y1="50" x2="10" y2="50" marker-end="url(#arrxt)"/>
      <text class="sub" x="40" y="42" text-anchor="middle" fill="#A78BFA">T₂</text>
      <rect class="cipher-e" x="-30" y="66" width="60" height="34" rx="5"/>
      <text class="cipher-text" x="0" y="88">E_K₁</text>
      <line class="wire" x1="0" y1="100" x2="0" y2="122" marker-end="url(#arrx)"/>
      <circle class="xor" cx="0" cy="132" r="10"/>
      <text class="xor-sym" x="0" y="137">⊕</text>
      <line class="wire-tweak" x1="60" y1="132" x2="10" y2="132" marker-end="url(#arrxt)"/>
      <text class="sub" x="40" y="124" text-anchor="middle" fill="#A78BFA">T₂</text>
      <line class="wire" x1="0" y1="142" x2="0" y2="168"/>
      <rect class="cipher-out" x="-22" y="168" width="44" height="18" rx="3"/>
      <text class="label" x="0" y="181" text-anchor="middle" fill="#0F172A">C₂</text>
    </g>

    <!-- cell j=3 at (cx=540) -->
    <g transform="translate(540 70)">
      <rect class="plain" x="-22" y="0" width="44" height="18" rx="3"/>
      <text class="label" x="0" y="13" text-anchor="middle" fill="#0F172A">P₃</text>
      <line class="wire" x1="0" y1="18" x2="0" y2="40" marker-end="url(#arrx)"/>
      <circle class="xor" cx="0" cy="50" r="10"/>
      <text class="xor-sym" x="0" y="55">⊕</text>
      <line class="wire-tweak" x1="60" y1="50" x2="10" y2="50" marker-end="url(#arrxt)"/>
      <text class="sub" x="40" y="42" text-anchor="middle" fill="#A78BFA">T₃</text>
      <rect class="cipher-e" x="-30" y="66" width="60" height="34" rx="5"/>
      <text class="cipher-text" x="0" y="88">E_K₁</text>
      <line class="wire" x1="0" y1="100" x2="0" y2="122" marker-end="url(#arrx)"/>
      <circle class="xor" cx="0" cy="132" r="10"/>
      <text class="xor-sym" x="0" y="137">⊕</text>
      <line class="wire-tweak" x1="60" y1="132" x2="10" y2="132" marker-end="url(#arrxt)"/>
      <text class="sub" x="40" y="124" text-anchor="middle" fill="#A78BFA">T₃</text>
      <line class="wire" x1="0" y1="142" x2="0" y2="168"/>
      <rect class="cipher-out" x="-22" y="168" width="44" height="18" rx="3"/>
      <text class="label" x="0" y="181" text-anchor="middle" fill="#0F172A">C₃</text>
    </g>

    <!-- Note -->
    <text class="sub" x="620" y="85">Two independent keys K₁, K₂.</text>
    <text class="sub" x="620" y="105">Tⱼ = αʲ · E_K₂(sector)</text>
    <text class="sub" x="620" y="125">in GF(2¹²⁸), deterministic</text>
    <text class="sub" x="620" y="145">per sector + block offset.</text>
    <text class="sub" x="620" y="175">Decrypt uses D_K₁, same tweak.</text>
  </g>
</svg>
