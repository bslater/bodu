      <text class="cnm-type" x="12" y="80">DateOnlyExtensions</text>
      <text class="cnm-type" x="12" y="98">NumericExtensions</text>
      <text class="cnm-type" x="12" y="116">NaturalStringComparer</text>
    </g>
    <g transform="translate(416 220)">
      <rect class="cnm-card" width="189" height="148" rx="7"/>
      <text class="cnm-ns" x="12" y="22">Bodu.Text</text>
      <text class="cnm-role" x="12" y="42">Text helpers</text>
      <text class="cnm-type" x="12" y="62">EncodingDetection,</text>
      <text class="cnm-type" x="12" y="80">span- and UTF-8-friendly</text>
      <text class="cnm-type" x="12" y="98">transcoding and</text>
      <text class="cnm-type" x="12" y="116">preamble handling</text>
    </g>
    <g transform="translate(617 220)">
      <rect class="cnm-card" width="189" height="148" rx="7"/>
      <text class="cnm-ns" x="12" y="22">Bodu.Xml.Linq</text>
      <text class="cnm-role" x="12" y="42">XML helpers</text>
      <text class="cnm-type" x="12" y="62">LINQ-to-XML helpers</text>
