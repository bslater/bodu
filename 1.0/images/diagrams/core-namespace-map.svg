      <text class="cnm-type" x="12" y="116">available publicly</text>
    </g>

    <!-- Annotation: the collection catalogue ships separately -->
    <rect class="cnm-aux" x="14" y="380" width="792" height="34" rx="6"/>
    <text class="cnm-auxt" x="28" y="401">Collection catalogue</text>
    <text class="cnm-auxs" x="168" y="401">Bodu.Collections.Generic · .Graphs · .Trees · Probabilistic ship in the Bodu.Collections package; thread-safe variants in Bodu.Collections.Concurrent</text>
  </g>
</svg>
