<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="aead-title aead-desc">
  <title id="aead-title">Generic AEAD mode data flow</title>
  <desc id="aead-desc">A generalised AEAD construction: the plaintext is encrypted under a CTR-style keystream derived from the nonce, while a MAC over the associated data and ciphertext produces an authentication tag. Exemplar for GCM, CCM, OCB, EAX, SIV, and GCM-SIV.</desc>

  <defs>
    <style>
      .bg { fill: #0F172A; }
      .panel { fill: #1E293B; stroke: #334155; stroke-width: 1; }
      .header { fill: #111827; stroke: #334155; stroke-width: 1; }
      .title { fill: #F8FAFC; font: 700 15px/1 "Segoe UI",Arial,sans-serif; }
      .formula { fill: #94A3B8; font: italic 12px/1 "Cambria",Georgia,serif; }
      .label { fill: #F8FAFC; font: 700 13px/1 "Segoe UI",Arial,sans-serif; }
      .sub { fill: #CBD5E1; font: 400 11px/1 "Segoe UI",Arial,sans-serif; }
      .sub-muted { fill: #94A3B8; font: 400 10.5px/1 "Segoe UI",Arial,sans-serif; }
      .cipher-e { fill: #3B82F6; stroke: #60A5FA; stroke-width: 1; }
      .mac { fill: #F43F5E; stroke: #FDA4AF; stroke-width: 1; }
      .cipher-text { fill: #F8FAFC; font: 700 14px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
      .plain { fill: #F59E0B; }
      .cipher-out { fill: #14B8A6; }
      .ad { fill: #22D3EE; }
      .nonce { fill: #A78BFA; }
      .tag { fill: #FBBF24; stroke: #F59E0B; stroke-width: 1; }
      .wire { stroke: #CBD5E1; stroke-width: 1.6; fill: none; }
      .wire-nonce { stroke: #A78BFA; stroke-width: 1.6; fill: none; }
      .wire-mac { stroke: #FDA4AF; stroke-width: 1.6; fill: none; }
      .xor { fill: #0F172A; stroke: #F8FAFC; stroke-width: 1.6; }
      .xor-sym { fill: #F8FAFC; font: 700 14px/1 "Segoe UI",Arial,sans-serif; text-anchor: middle; }
    </style>
    <marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#CBD5E1"/>
    </marker>
    <marker id="arran" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
    <marker id="arram" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FDA4AF"/>
    </marker>
  </defs>

  <rect class="bg" width="820" height="360"/>

  <g transform="translate(10 10)">
    <rect class="panel" width="800" height="340" rx="8"/>
    <rect class="header" width="800" height="46" rx="8"/>
    <rect class="header" y="38" width="800" height="8"/>
    <text class="title" x="16" y="20">AEAD — Authenticated Encryption with Associated Data (generic flow)</text>
    <text class="formula" x="784" y="38" text-anchor="end">(C, T) = ENC_K(N, A, P);    P or ⊥ = DEC_K(N, A, C, T)</text>

    <!-- Top row: encryption path -->
    <!-- Nonce box on left -->
    <g transform="translate(50 90)">
      <rect class="nonce" x="-30" y="-11" width="60" height="22" rx="3"/>
      <text class="label" x="0" y="5" text-anchor="middle" fill="#0F172A">nonce N</text>
    </g>

    <!-- Keystream generator (CTR-style) -->
    <g transform="translate(200 70)">
      <rect class="cipher-e" x="-55" y="0" width="110" height="42" rx="5"/>
      <text class="cipher-text" x="0" y="20">Keystream</text>
      <text class="cipher-text" x="0" y="36">Generator (CTR)</text>
    </g>
    <line class="wire-nonce" x1="80" y1="90" x2="145" y2="90" marker-end="url(#arran)"/>

    <!-- Plaintext input -->
    <g transform="translate(200 140)">
      <rect class="plain" x="-40" y="-11" width="80" height="22" rx="3"/>
      <text class="label" x="0" y="5" text-anchor="middle" fill="#0F172A">plaintext P</text>
    </g>

    <!-- XOR to produce ciphertext -->
    <g transform="translate(370 120)">
      <circle class="xor" cx="0" cy="0" r="13"/>
      <text class="xor-sym" x="0" y="5">⊕</text>
    </g>
    <line class="wire" x1="255" y1="91" x2="320" y2="91" marker-end="url(#arra)"/>
    <path class="wire" d="M 320 91 L 340 91 L 340 115 L 356 120" marker-end="url(#arra)"/>
    <line class="wire" x1="240" y1="140" x2="357" y2="123" marker-end="url(#arra)"/>

    <!-- Ciphertext output -->
    <g transform="translate(480 120)">
      <rect class="cipher-out" x="-40" y="-11" width="80" height="22" rx="3"/>
      <text class="label" x="0" y="5" text-anchor="middle" fill="#0F172A">ciphertext C</text>
    </g>
    <line class="wire" x1="383" y1="120" x2="440" y2="120" marker-end="url(#arra)"/>

    <!-- Bottom row: authentication path -->
    <!-- Associated data input -->
    <g transform="translate(75 240)">
      <rect class="ad" x="-60" y="-11" width="120" height="22" rx="3"/>
      <text class="label" x="0" y="5" text-anchor="middle" fill="#0F172A">associated data A</text>
    </g>

    <!-- MAC engine -->
    <g transform="translate(370 250)">
      <rect class="mac" x="-85" y="-22" width="170" height="44" rx="5"/>
      <text class="cipher-text" x="0" y="-2">MAC / polynomial hash</text>
      <text class="cipher-text" x="0" y="16">(GHASH, CBC-MAC, OMAC, …)</text>
    </g>

    <!-- Arrows into MAC: A, N, C -->
    <line class="wire-mac" x1="135" y1="240" x2="285" y2="250" marker-end="url(#arram)"/>
    <path class="wire-mac" d="M 80 100 L 80 190 L 290 190 L 290 230" marker-end="url(#arram)"/>
    <text class="sub-muted" x="180" y="184">N</text>
    <path class="wire-mac" d="M 480 131 L 480 184 L 378 184 L 378 230" marker-end="url(#arram)"/>
    <text class="sub-muted" x="384" y="200">C</text>

    <!-- Tag output -->
    <g transform="translate(600 250)">
      <rect class="tag" x="-30" y="-13" width="60" height="26" rx="4"/>
      <text class="label" x="0" y="6" text-anchor="middle" fill="#0F172A">tag T</text>
    </g>
    <line class="wire-mac" x1="455" y1="250" x2="570" y2="250" marker-end="url(#arram)"/>

    <!-- Side legend -->
    <g transform="translate(650 60)">
      <text class="sub" x="0" y="0">Per mode:</text>
      <text class="sub-muted" x="0" y="18">GCM — CTR + GHASH</text>
      <text class="sub-muted" x="0" y="34">CCM — CTR + CBC-MAC</text>
      <text class="sub-muted" x="0" y="50">OCB — offset-based, 1-pass</text>
      <text class="sub-muted" x="0" y="66">EAX — CTR + OMAC(N‖A‖C)</text>
      <text class="sub-muted" x="0" y="82">SIV — deterministic, S2V first</text>
      <text class="sub-muted" x="0" y="98">GCM-SIV — POLYVAL SIV</text>
    </g>

    <!-- bottom row description -->
    <text class="sub" x="20" y="320">Encryption and authentication are separate but coupled outputs. Verification repeats the MAC and compares in constant time.</text>
  </g>
</svg>
