<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bodu.Globalization.Calendar.Plugins — trust-gated loading of external date algorithms">
  <title>Bodu.Globalization.Calendar.Plugins</title>
  <defs>
    <linearGradient id="calplg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#calplg-bg)"/>

  <!-- Left panel -->
  <g transform="translate(28 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="150" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="150" height="22" rx="8" fill="#2DD4BF"/>
    <rect y="14" width="150" height="8" fill="#2DD4BF"/>
    <text x="75" y="16" fill="#042F2A" text-anchor="middle" font-weight="700" font-size="10">External assembly</text>

    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="10" y="44">MyAlgorithms.dll</text>
      <text x="10" y="68"><tspan fill="#2DD4BF">INotableDate</tspan></text>
      <text x="10" y="84"><tspan fill="#2DD4BF">Algorithm</tspan></text>
    </g>
    <g transform="translate(102 108)">
      <path d="M 0 -14 L 12 -9 L 12 3 Q 12 12 0 17 Q -12 12 -12 3 L -12 -9 Z" fill="none" stroke="#2DD4BF" stroke-width="2"/>
      <circle cy="-2" r="2.6" fill="none" stroke="#2DD4BF" stroke-width="1.6"/>
      <rect x="-1.3" y="0" width="2.6" height="6" rx="1.3" fill="#2DD4BF"/>
    </g>
    <text x="10" y="118" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">signed ·</text>
    <text x="10" y="130" fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="9">allow-listed</text>
  </g>

  <!-- Bidirectional pipeline arrows -->
  <g transform="translate(186 80)" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="104" y2="0"/>
    <polygon points="104,0 96,-4 96,4" fill="#2DD4BF" stroke="none"/>
    <line x1="104" y1="36" x2="0" y2="36"/>
    <polygon points="0,36 8,32 8,40" fill="#2DD4BF" stroke="none"/>
  </g>
  <g transform="translate(186 80)" fill="#2DD4BF" font-family="'Consolas','Menlo',monospace" font-size="10" text-anchor="middle">
    <text x="52" y="-6">load</text>
    <text x="52" y="56">gate</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(310 30)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
    <rect width="142" height="160" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect width="142" height="22" rx="8" fill="#3B82F6"/>
    <rect y="14" width="142" height="8" fill="#3B82F6"/>
    <text x="71" y="16" fill="#F8FAFC" text-anchor="middle" font-weight="700" font-size="10">Calendar engine</text>

    <g stroke="#334155" stroke-width="1">
      <rect x="12" y="36" width="118" height="20" rx="4" fill="#0F172A"/>
      <rect x="12" y="62" width="118" height="20" rx="4" fill="#0F172A"/>
      <rect x="12" y="88" width="118" height="20" rx="4" fill="#0F172A" stroke="#2DD4BF" stroke-dasharray="4 3"/>
    </g>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="9.5">
      <text x="20" y="50">EasterCalculator</text>
      <text x="20" y="76">LunarPhaseCalculator</text>
      <text x="20" y="102" fill="#2DD4BF">← plugin slot</text>
    </g>
    <g fill="#E2E8F0" font-family="'Consolas','Menlo',monospace" font-size="10.5">
      <text x="12" y="128"><tspan fill="#94A3B8" font-size="9">strategies resolve by</tspan></text>
      <text x="12" y="142"><tspan fill="#94A3B8" font-size="9">algorithm name</tspan></text>
    </g>
  </g>

  <!-- Bottom caption -->
  <g fill="#94A3B8" font-family="'Consolas','Menlo',monospace" font-size="10">
    <text x="240" y="206" text-anchor="middle">trust-gated assembly loading</text>
  </g>
</svg>
